q": "At a stop sign, where should you stop?", "a": ["Where you first see the sign", "At the stop line if present, otherwise before entering the road/intersection where you have visibility", "After the crossing road", "Only beside the signpost"], "correct": 1, "exp": "Stop at the stop line; if none, stop where appropriate before entering and where you can assess traffic.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"48,8 92,8 132,48 132,92 92,132 48,132 8,92 8,48\" fill=\"#d40000\" stroke=\"white\" stroke-width=\"6\"/><text x=\"70\" y=\"82\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"34\" font-weight=\"800\" fill=\"white\">STOP</text></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What does a solid centre line mean for overtaking?", "a": ["You may cross it if on a motorcycle", "Do not cross it for overtaking", "It only warns of a bus stop", "It marks a cycle lane"], "correct": 1, "exp": "A solid line indicates you must not cross it in situations such as overtaking.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "You miss your exit in a roundabout. What should you do?", "a": ["Stop and reverse", "Continue around safely and exit on the next opportunity", "Cut across lanes immediately", "Ride over the centre island"], "correct": 1, "exp": "Do not make sudden unsafe manoeuvres; continue around and plan again.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 180 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"140\" rx=\"10\" fill=\"#233123\"/><circle cx=\"90\" cy=\"70\" r=\"48\" fill=\"#454b55\"/><circle cx=\"90\" cy=\"70\" r=\"26\" fill=\"#233123\"/><path d=\"M88 28a42 42 0 0 1 40 38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M123 58l13 16-20-2z\" fill=\"#ffd200\"/><path d=\"M92 112a42 42 0 0 1-40-38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M57 82L44 66l20 2z\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is safest near schools or bus stops?", "a": ["Maintain speed if no crossing is marked", "Reduce speed and expect children/pedestrians", "Use horn as warning continuously", "Ride close to parked cars"], "correct": 1, "exp": "Vulnerable road users can appear suddenly around schools and bus stops.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What is the friction-circle idea?", "a": ["Tyre grip is limited and shared between braking, cornering and acceleration", "A roundabout rule", "A tyre brand mark", "A fuel economy diagram"], "correct": 0, "exp": "Asking for too much braking/turning/acceleration at once can exceed available grip.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What should you do after riding through deep water?", "a": ["Ride fast to dry clothes", "Gently test/apply brakes at low speed to dry them, when safe", "Ignore brakes until needed", "Stop and open the engine"], "correct": 1, "exp": "Wet brakes can have reduced effect; dry/test them safely after water.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Before you may take the Swedish motorcycle theory test, what must normally be completed?", "a": ["Only the practical riding test", "Both parts of the motorcycle risk course, and it must still be valid", "A car risk course only", "A vehicle inspection of your own motorcycle"], "correct": 1, "exp": "For motorcycle licence candidates, both parts of the motorcycle risk training must be completed and valid before the theory test.", "source": "Trafikverket: Motorcycles / theory test", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "How many multiple-choice questions are shown in the Swedish motorcycle theory test?", "a": ["50", "60", "70", "100"], "correct": 2, "exp": "Trafikverket states that the theory test consists of 70 multiple-choice questions.", "source": "Trafikverket: Motorcycle theory test", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "How many correct answers are required to pass the motorcycle theory test?", "a": ["45", "50", "52", "65"], "correct": 2, "exp": "The pass requirement is 52 correct answers. The maximum score is 65 because 5 sample questions do not count.", "source": "Trafikverket: Motorcycle theory test", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "How long do you have to complete the Swedish motorcycle theory test?", "a": ["35 minutes", "45 minutes", "50 minutes", "75 minutes"], "correct": 2, "exp": "The ordinary motorcycle theory test time is 50 minutes.", "source": "Trafikverket: Motorcycle theory test", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "If you pass the motorcycle theory test, how long is it normally valid?", "a": ["3 months", "6 months", "1 year", "Until you pass the practical test, no time limit"], "correct": 2, "exp": "The passed theory test is valid for one year, so the riding test must be passed within that period.", "source": "Trafikverket: Motorcycle theory test", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What does category A1 allow in Sweden?", "a": ["Any motorcycle up to 35 kW", "Motorcycles up to 125 cm³, 11 kW and 0.1 kW/kg", "Only mopeds up to 45 km/h", "All two-wheeled motorcycles"], "correct": 1, "exp": "A1 covers light motorcycles with max 125 cm³, max 11 kW and max 0.1 kW/kg.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What is the minimum age for category A1 in Sweden?", "a": ["15", "16", "18", "20"], "correct": 1, "exp": "The age limit for A1 is 16 years.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What is the minimum age for category A2 in Sweden?", "a": ["16", "18", "20", "24"], "correct": 1, "exp": "The age limit for A2 is 18 years.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Which statement about A2 motorcycles is correct?", "a": ["Maximum 25 kW and 0.16 kW/kg", "Maximum 35 kW and 0.2 kW/kg, and not derived from more than 70 kW if restricted", "Any motorcycle up to 500 cm³", "Only automatic motorcycles"], "correct": 1, "exp": "A2 allows medium motorcycles up to 35 kW and 0.2 kW/kg; if restricted, the original version must not exceed 70 kW.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Which statement about category A is correct?", "a": ["It allows only motorcycles up to 35 kW", "It allows all two-wheeled motorcycles regardless of engine size or power", "It is the same as AM", "It is only for three-wheeled motorcycles"], "correct": 1, "exp": "Category A is the unrestricted two-wheeled motorcycle category.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "When can you normally obtain unrestricted category A directly, without two years of A2 experience?", "a": ["18 years", "20 years", "21 years", "24 years"], "correct": 3, "exp": "Direct access to category A is from 24 years. With two years of A2, it can be obtained from 20.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "If you already have A2 for at least two years, from what age can you obtain category A?", "a": ["18", "20", "22", "24"], "correct": 1, "exp": "Progressive access allows category A from 20 after at least two years with A2.", "source": "Trafikverket: MC licence categories", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Which insurance is legally mandatory for a motorcycle used in traffic in Sweden?", "a": ["Full comprehensive insurance", "Third-party traffic insurance (trafikförsäkring)", "Theft insurance only", "No insurance if the motorcycle is paid for"], "correct": 1, "exp": "Motor vehicles used in traffic must have traffic insurance, which covers damage caused to others.", "source": "Transportstyrelsen: Vehicle/traffic insurance rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "When is a Swedish motorcycle first due for periodic inspection after first being licensed for use?", "a": ["No later than 24 months", "No later than 36 months", "No later than 48 months", "Only when sold"], "correct": 2, "exp": "Transportstyrelsen states motorcycles must be inspected first no later than 48 months after first being licensed for use.", "source": "Transportstyrelsen: Motor vehicle inspection of motorcycles", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "After the first inspection, how often is a motorcycle normally due for inspection?", "a": ["Every 12 months", "Every 24 months after the month of the last full inspection", "Every 36 months", "Only after 10,000 km"], "correct": 1, "exp": "After the first inspection, the next inspection is due no later than 24 months after the month of the last full inspection.", "source": "Transportstyrelsen: Motor vehicle inspection of motorcycles", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What is the legal blood alcohol concentration limit for ordinary drink-driving in Sweden?", "a": ["0.0 per mille", "0.2 per mille", "0.5 per mille", "1.0 per mille"], "correct": 1, "exp": "The criminal drink-driving limit is 0.2 per mille in blood. The safer practical rule for riding is not to drink at all.", "source": "Transportstyrelsen/Polisen: Drink-driving rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "At what blood alcohol concentration is aggravated drink-driving normally reached in Sweden?", "a": ["0.2 per mille", "0.5 per mille", "1.0 per mille", "1.5 per mille"], "correct": 2, "exp": "1.0 per mille in blood is a threshold for aggravated drink-driving, though other circumstances can also matter.", "source": "Transportstyrelsen/Polisen: Drink-driving rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Which statement about handheld mobile phone use while riding is correct in Sweden?", "a": ["It is allowed below 30 km/h", "It is allowed if the road is straight", "Handheld use is prohibited while driving or riding", "It is allowed for motorcycles only"], "correct": 2, "exp": "Drivers and riders may not use handheld mobile phones or similar equipment while driving.", "source": "Transportstyrelsen: Mobile phone rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Is car risk training valid instead of motorcycle risk training for a motorcycle licence?", "a": ["Yes, always", "Only if it was completed within one year", "No, motorcycle risk training is separate", "Only for category A1"], "correct": 2, "exp": "Transportstyrelsen states that risk training for passenger car does not count for motorcycle.", "source": "Transportstyrelsen: Riskutbildning motorcykel", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the main rule when approaching an uncontrolled intersection in Sweden?", "a": ["Traffic from the left has priority", "The largest vehicle has priority", "The right-hand rule applies unless signs or signals say otherwise", "Motorcycles always have priority"], "correct": 2, "exp": "At many uncontrolled intersections, you give way to traffic approaching from the right.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "You are on a priority road and a car approaches from a side road on your right. Who normally has priority?", "a": ["The car from the right", "You, because priority-road rules override the right-hand rule", "Whoever arrives first", "The vehicle travelling fastest"], "correct": 1, "exp": "On a signed priority road, side-road traffic must give way; the right-hand rule does not apply in the same way.", "source": "Transportstyrelsen: Vägmärken / Priority road", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"28\" y=\"28\" width=\"84\" height=\"84\" transform=\"rotate(45 70 70)\" fill=\"#ffd200\" stroke=\"white\" stroke-width=\"8\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "At a give-way sign, must you always come to a full stop?", "a": ["Yes, every time", "No, but you must slow/stop if needed and give way", "Only at night", "Only if a police officer is present"], "correct": 1, "exp": "Give way means you must yield and may need to stop, but a complete stop is only mandatory if required by the traffic situation or by a stop sign.", "source": "Transportstyrelsen: B1 Väjningsplikt", "img": "<svg viewBox=\"0 0 140 125\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"70,112 130,12 10,12\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "At a stop sign, what is different from a give-way sign?", "a": ["You must make a complete stop before proceeding", "You have priority after slowing down", "It only applies to cars", "It means parking is prohibited"], "correct": 0, "exp": "A stop sign requires a complete stop and giving way before continuing.", "source": "Transportstyrelsen: STOP sign", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"48,8 92,8 132,48 132,92 92,132 48,132 8,92 8,48\" fill=\"#d40000\" stroke=\"white\" stroke-width=\"6\"/><text x=\"70\" y=\"82\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"34\" font-weight=\"800\" fill=\"white\">STOP</text></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When entering a roundabout in Sweden, what must you normally do?", "a": ["Accelerate because entering traffic has priority", "Give way to traffic already in the roundabout", "Stop every time regardless of traffic", "Use the left lane only"], "correct": 1, "exp": "Traffic entering a roundabout normally has give-way duties to traffic already circulating.", "source": "Transportstyrelsen: Trafikregler / Roundabouts", "img": "<svg viewBox=\"0 0 180 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"140\" rx=\"10\" fill=\"#233123\"/><circle cx=\"90\" cy=\"70\" r=\"48\" fill=\"#454b55\"/><circle cx=\"90\" cy=\"70\" r=\"26\" fill=\"#233123\"/><path d=\"M88 28a42 42 0 0 1 40 38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M123 58l13 16-20-2z\" fill=\"#ffd200\"/><path d=\"M92 112a42 42 0 0 1-40-38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M57 82L44 66l20 2z\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When leaving a roundabout, what should you normally do?", "a": ["Signal right in good time", "Signal left until fully out", "Never signal", "Stop before exiting"], "correct": 0, "exp": "You should show your intention to leave the roundabout, normally by signalling right in good time.", "source": "Transportstyrelsen: Trafikregler / Roundabouts", "img": "<svg viewBox=\"0 0 180 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"140\" rx=\"10\" fill=\"#233123\"/><circle cx=\"90\" cy=\"70\" r=\"48\" fill=\"#454b55\"/><circle cx=\"90\" cy=\"70\" r=\"26\" fill=\"#233123\"/><path d=\"M88 28a42 42 0 0 1 40 38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M123 58l13 16-20-2z\" fill=\"#ffd200\"/><path d=\"M92 112a42 42 0 0 1-40-38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M57 82L44 66l20 2z\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "If a pedestrian is already on an uncontrolled pedestrian crossing, what must you do?", "a": ["Continue if you are on a motorcycle", "Give way and stop if necessary", "Sound the horn and pass behind", "Only slow down if there is a sign"], "correct": 1, "exp": "Drivers and riders must give way to pedestrians who are on or just entering an uncontrolled pedestrian crossing.", "source": "Transportstyrelsen: Pedestrian crossing rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#1f2937\"/><rect x=\"0\" y=\"42\" width=\"180\" height=\"36\" fill=\"#374151\"/><g fill=\"white\"><rect x=\"48\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"64\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"80\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"96\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"112\" y=\"40\" width=\"10\" height=\"40\"/></g><circle cx=\"88\" cy=\"36\" r=\"8\" fill=\"#ffd200\"/><path d=\"M88 44v22M88 55l-12 8M88 55l12 8M88 66l-9 18M88 66l9 18\" stroke=\"#ffd200\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is true about cyclists at cycle crossings and cycle passages?", "a": ["The same rule always applies everywhere", "The duty depends on the type of crossing/passage and traffic situation; reduce speed and be prepared to yield", "Cyclists always have priority over motorcycles", "Motorcycles always have priority over cyclists"], "correct": 1, "exp": "Swedish rules differ between cycle crossings and cycle passages. For the theory test, identify signs/markings and always adapt speed to protect vulnerable users.", "source": "Transportstyrelsen: Trafikregler / Cyclists", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "How close before a pedestrian crossing may you normally park?", "a": ["1 metre", "5 metres", "10 metres", "20 metres"], "correct": 2, "exp": "Parking within 10 metres before a pedestrian crossing is prohibited, because it blocks visibility.", "source": "Transportstyrelsen: Parking rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#1f2937\"/><rect x=\"0\" y=\"42\" width=\"180\" height=\"36\" fill=\"#374151\"/><g fill=\"white\"><rect x=\"48\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"64\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"80\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"96\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"112\" y=\"40\" width=\"10\" height=\"40\"/></g><circle cx=\"88\" cy=\"36\" r=\"8\" fill=\"#ffd200\"/><path d=\"M88 44v22M88 55l-12 8M88 55l12 8M88 66l-9 18M88 66l9 18\" stroke=\"#ffd200\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "How close to an intersection may you normally park?", "a": ["Within 2 metres", "Within 5 metres", "Not within 10 metres of the intersection", "Anywhere if only for a motorcycle"], "correct": 2, "exp": "Parking is generally prohibited within 10 metres of an intersection.", "source": "Transportstyrelsen: Parking rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When may you use your motorcycle horn?", "a": ["To greet friends", "To express irritation", "Only to warn of danger", "Every time you overtake"], "correct": 2, "exp": "The horn is for warning of danger, not for greetings or frustration.", "source": "Transportstyrelsen: Trafikregler / Signals", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What should you do when a bus at a bus stop signals to pull out in a built-up area where the speed limit is 50 km/h or lower?", "a": ["Always accelerate past it", "Give the bus the opportunity to leave the stop safely", "Stop for at least 30 seconds", "Overtake on the right"], "correct": 1, "exp": "In built-up areas with speed limit 50 km/h or lower, you must allow a bus to leave a stop when it signals.", "source": "Transportstyrelsen: Trafikregler / Bus stops", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When may a motorcycle use a bus lane?", "a": ["Always, because motorcycles are narrow", "Only when signs/road markings allow motorcycles or the local rule permits it", "Never, even if signed", "Only on Sundays"], "correct": 1, "exp": "A motorcycle may use a bus lane only if it is permitted by the signs or local traffic regulation.", "source": "Transportstyrelsen: Traffic signs / Bus lanes", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What must you do if a police officer gives instructions that conflict with a traffic light?", "a": ["Follow the traffic light", "Follow the police officer", "Follow the sign only", "Choose the safest-looking rule"], "correct": 1, "exp": "Police directions override traffic lights and signs.", "source": "Transportstyrelsen: Trafikregler / Traffic control", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "A railway crossing has flashing red lights. What must you do?", "a": ["Slow down but continue if no train is visible", "Stop and wait until it is safe and the signal allows passage", "Only stop if barriers are down", "Ride around the barrier if there is room"], "correct": 1, "exp": "Red warning lights at a railway crossing require you to stop and never cross until it is safe and allowed.", "source": "Transportstyrelsen: Railway crossing rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#1f2937\"/><rect x=\"76\" y=\"0\" width=\"12\" height=\"120\" fill=\"#6b7280\"/><rect x=\"92\" y=\"0\" width=\"12\" height=\"120\" fill=\"#6b7280\"/><g stroke=\"#92400e\" stroke-width=\"5\"><line x1=\"62\" y1=\"12\" x2=\"118\" y2=\"12\"/><line x1=\"62\" y1=\"38\" x2=\"118\" y2=\"38\"/><line x1=\"62\" y1=\"82\" x2=\"118\" y2=\"82\"/><line x1=\"62\" y1=\"108\" x2=\"118\" y2=\"108\"/></g><circle cx=\"64\" cy=\"55\" r=\"9\" fill=\"#ef4444\"/><circle cx=\"116\" cy=\"55\" r=\"9\" fill=\"#ef4444\" opacity=\".45\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What should you do before crossing a railway crossing without barriers?", "a": ["Only look straight ahead", "Reduce speed, look and listen carefully, and be ready to stop", "Accelerate to minimize time on the track", "Stop on the track to check both directions"], "correct": 1, "exp": "At railway crossings, especially unguarded ones, you must ensure no train is approaching before crossing.", "source": "Transportstyrelsen: Railway crossing rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#1f2937\"/><rect x=\"76\" y=\"0\" width=\"12\" height=\"120\" fill=\"#6b7280\"/><rect x=\"92\" y=\"0\" width=\"12\" height=\"120\" fill=\"#6b7280\"/><g stroke=\"#92400e\" stroke-width=\"5\"><line x1=\"62\" y1=\"12\" x2=\"118\" y2=\"12\"/><line x1=\"62\" y1=\"38\" x2=\"118\" y2=\"38\"/><line x1=\"62\" y1=\"82\" x2=\"118\" y2=\"82\"/><line x1=\"62\" y1=\"108\" x2=\"118\" y2=\"108\"/></g><circle cx=\"64\" cy=\"55\" r=\"9\" fill=\"#ef4444\"/><circle cx=\"116\" cy=\"55\" r=\"9\" fill=\"#ef4444\" opacity=\".45\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the basic rule for speed limits?", "a": ["Posted speed is a target you should always reach", "Posted speed is a maximum; you must adapt to conditions", "Motorcycles may exceed by 10 km/h when overtaking", "Speed rules do not apply during training"], "correct": 1, "exp": "The speed limit is the maximum permitted speed, but you must choose a lower safe speed when conditions require.", "source": "Transportstyrelsen: Trafikregler / Speed", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When is overtaking forbidden even if the road seems clear?", "a": ["When it would create danger or is prohibited by signs/markings/visibility rules", "Only when the vehicle ahead is a bus", "Never for motorcycles", "Only in daylight"], "correct": 0, "exp": "Overtaking must not be done if it is unsafe or prohibited by signs, markings, junctions, crossings or poor visibility.", "source": "Transportstyrelsen: Trafikregler / Overtaking", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the correct approach when overtaking a cyclist on a rural road?", "a": ["Pass as close as possible to stay in lane", "Leave a safe lateral distance and adapt speed; more space is needed at higher speed", "Use the horn continuously", "Overtake only on the right"], "correct": 1, "exp": "You must pass vulnerable road users with sufficient safety margin and adapted speed.", "source": "Transportstyrelsen: Trafikregler / Overtaking vulnerable road users", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is true about indicators when changing lanes?", "a": ["They give you priority", "They show intention, but you must still check and give way if necessary", "They are optional on motorcycles", "They replace the blind-spot check"], "correct": 1, "exp": "Signalling does not give priority. You must check mirrors/blind spots and change only when safe.", "source": "Transportstyrelsen: Trafikregler / Signalling", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What should you do if a traffic light is out of order at an intersection?", "a": ["Treat it as a motorway", "Apply signs and normal priority rules, and proceed with caution", "All traffic from the left has priority", "Motorcycles may pass first"], "correct": 1, "exp": "If signals are not working, follow any signs and general priority rules, using extra caution.", "source": "Transportstyrelsen: Trafikregler / Intersections", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A circular sign with red border and yellow centre means a prohibition. What does that usually tell you?", "a": ["Something is mandatory", "Something is forbidden or restricted", "A tourist route begins", "A railway crossing is ahead"], "correct": 1, "exp": "Swedish prohibition signs are generally circular with red border and yellow centre.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "What does a blue circular sign usually mean?", "a": ["Warning", "Prohibition", "Mandatory instruction", "End of restriction"], "correct": 2, "exp": "Blue circular signs give mandatory instructions, such as direction or lane use.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A triangular sign with red border and yellow centre normally means:", "a": ["Warning", "Mandatory route", "Priority road", "End of prohibition"], "correct": 0, "exp": "Swedish warning signs are usually triangular with a red border and yellow centre.", "source": "Transportstyrelsen: Road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"44\" x2=\"80\" y2=\"86\" stroke=\"#111\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A rectangular blue sign with a white “P” means:", "a": ["No parking", "Parking place", "Priority road", "Police checkpoint"], "correct": 1, "exp": "The blue P sign indicates a parking place, subject to any supplementary signs.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "What do supplementary plates below a sign do?", "a": ["Cancel the sign completely", "Give additional information such as distance, time, vehicle type or extent", "Only decorate the sign", "Apply only to pedestrians"], "correct": 1, "exp": "Supplementary plates specify how, when or to whom the main sign applies.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A sign showing the end of a speed limit means:", "a": ["You may drive at any speed", "The previous local speed limit ends; another applicable limit then applies", "The road becomes private", "You must stop"], "correct": 1, "exp": "End signs cancel the specific restriction; you still must obey the general or newly signed limit.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A motorway sign means:", "a": ["A road where motorway rules apply", "A road only for motorcycles", "A road with no speed limit", "A road where pedestrians may walk"], "correct": 0, "exp": "The motorway sign indicates a motorway and the special rules that apply there.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A motor-traffic road sign (motortrafikled) means:", "a": ["A road for slow vehicles", "A road with motorway-like restrictions but not a motorway", "A road only for buses", "A private road"], "correct": 1, "exp": "Motortrafikled has special rules and restrictions, but it is not the same as a motorway.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A warning sign for road works means you should:", "a": ["Maintain speed and ignore workers", "Reduce speed and expect workers, machinery, temporary lanes and loose material", "Only watch for police", "Use high beam"], "correct": 1, "exp": "Road works often involve changing road layout, workers, uneven surfaces and loose gravel.", "source": "Transportstyrelsen: Road signs / Road works", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"44\" x2=\"80\" y2=\"86\" stroke=\"#111\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A warning sign for loose gravel is especially important for motorcyclists because:", "a": ["It improves traction", "It can make braking and cornering unstable", "It only affects cars", "It means the road is closed"], "correct": 1, "exp": "Loose gravel can drastically reduce motorcycle grip, especially while leaning or braking.", "source": "Transportstyrelsen: Road signs / Loose gravel", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"44\" x2=\"80\" y2=\"86\" stroke=\"#111\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A sign prohibiting motor vehicles normally applies to:", "a": ["Only cars", "Motor vehicles as indicated by the sign, including motorcycles unless exempted", "Only heavy vehicles", "Only vehicles over 3.5 tonnes"], "correct": 1, "exp": "Always read the symbol and any supplementary plate; motorcycles are motor vehicles unless specifically exempted.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "What does a “no overtaking” sign mean for you on a motorcycle?", "a": ["Motorcycles may still overtake cars", "You must not overtake motor vehicles covered by the sign", "It only applies to trucks", "It means end of speed limit"], "correct": 1, "exp": "No-overtaking signs apply as indicated and do not give motorcycles a general exemption.", "source": "Transportstyrelsen: Road signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "A sign showing a pedestrian crossing indicates:", "a": ["A place where drivers must be especially prepared to give way to pedestrians", "A place only pedestrians may use, vehicles forbidden everywhere", "A warning only with no duty of care", "A cycle-only crossing"], "correct": 0, "exp": "At pedestrian crossings, approach at a speed that lets you give way to pedestrians.", "source": "Transportstyrelsen: Road signs / Pedestrian crossing", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#1f2937\"/><rect x=\"0\" y=\"42\" width=\"180\" height=\"36\" fill=\"#374151\"/><g fill=\"white\"><rect x=\"48\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"64\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"80\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"96\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"112\" y=\"40\" width=\"10\" height=\"40\"/></g><circle cx=\"88\" cy=\"36\" r=\"8\" fill=\"#ffd200\"/><path d=\"M88 44v22M88 55l-12 8M88 55l12 8M88 66l-9 18M88 66l9 18\" stroke=\"#ffd200\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What does a yellow-red road-work direction board or temporary marking usually mean?", "a": ["The normal rules no longer apply", "Temporary traffic guidance; follow it carefully and expect changed layout", "Parking is free", "Only cyclists must follow it"], "correct": 1, "exp": "Temporary signs/markings at worksites guide traffic through a changed layout and must be obeyed.", "source": "Transportstyrelsen: Road signs / Temporary signs", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "What should you do when you see a warning sign for children?", "a": ["Expect children to behave unpredictably and reduce speed", "Only slow down during school hours", "Use the horn as you pass", "Assume children will follow all rules"], "correct": 0, "exp": "Children can move unpredictably, so the safe response is lower speed and high readiness.", "source": "Transportstyrelsen: Road signs / Children", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"44\" x2=\"80\" y2=\"86\" stroke=\"#111\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why should you avoid sitting in another vehicle’s blind spot?", "a": ["It saves fuel", "The driver may not see you and may change lane into you", "It improves your visibility", "It gives you priority"], "correct": 1, "exp": "Motorcycles are easily hidden in blind spots. Either pass decisively when safe or stay back.", "source": "Trafikverket: Motorcycle safety and road safety", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#111827\"/><g transform=\"translate(35,32)\" stroke=\"#ffd166\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"25\" cy=\"54\" r=\"20\"/><circle cx=\"95\" cy=\"54\" r=\"20\"/><path d=\"M25 34h38l18-30h22\"/><path d=\"M60 34l35 20\"/><path d=\"M50 34L33 54\"/><circle cx=\"76\" cy=\"0\" r=\"10\"/></g></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What does “ride as if you are invisible” mean?", "a": ["Use no lights", "Assume others may not notice you and plan escape options", "Break the rules to stay ahead", "Always ride on the shoulder"], "correct": 1, "exp": "Motorcyclists must actively manage visibility and never rely only on having priority.", "source": "Trafikverket: Motorcycle safety and road safety", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#111827\"/><g transform=\"translate(35,32)\" stroke=\"#ffd166\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"25\" cy=\"54\" r=\"20\"/><circle cx=\"95\" cy=\"54\" r=\"20\"/><path d=\"M25 34h38l18-30h22\"/><path d=\"M60 34l35 20\"/><path d=\"M50 34L33 54\"/><circle cx=\"76\" cy=\"0\" r=\"10\"/></g></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is the safest approach to a car waiting to turn left across your path?", "a": ["Assume it has seen you", "Cover the brakes, reduce risk and be ready to stop", "Accelerate to pass before it turns", "Move into oncoming traffic"], "correct": 1, "exp": "A classic motorcycle collision is a car turning across the rider’s path after failing to notice the motorcycle.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why is lane position important on a motorcycle?", "a": ["It only affects style", "It affects visibility, escape routes, surface hazards and distance from other traffic", "It makes speed limits higher", "It replaces signalling"], "correct": 1, "exp": "Good lane position increases what you can see, how well others see you and where you can escape.", "source": "Trafikverket: Motorcycle safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "In a left-hand bend on a two-way road, why should you avoid being close to the centre line?", "a": ["It is always illegal", "Oncoming vehicles may cut the corner and your head/body can be near the opposite lane", "It reduces fuel economy", "It makes ABS stop working"], "correct": 1, "exp": "A motorcycle leans and the rider’s body can be near the centre line; keep a safety margin from oncoming traffic.", "source": "Trafikverket: Motorcycle road positioning", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is the best visual technique through a bend?", "a": ["Stare at the road directly in front of the front wheel", "Look through the bend toward where you want to go", "Look at the hazard you want to avoid", "Close one eye to judge distance"], "correct": 1, "exp": "Motorcycles tend to go where the rider looks; looking through the bend supports smooth steering.", "source": "Trafikverket: Motorcycle manoeuvring", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should you do if the front wheel locks on a motorcycle without ABS?", "a": ["Hold the brake locked", "Release the front brake immediately and reapply progressively if possible", "Accelerate hard", "Stand on the rear brake"], "correct": 1, "exp": "A locked front wheel can quickly cause a fall. Release and reapply smoothly.", "source": "Trafikverket: Motorcycle braking", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What does ABS help with during hard braking?", "a": ["It guarantees no crash", "It helps prevent wheel lock so steering control is more likely retained", "It shortens every stop on all surfaces", "It removes the need to practise braking"], "correct": 1, "exp": "ABS reduces the risk of wheel lock, but it does not overcome all traction limits or replace proper technique.", "source": "Trafikverket: Motorcycle braking", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "When braking hard on a straight road, which brake usually provides most stopping power?", "a": ["Rear brake", "Front brake", "Engine braking only", "Neither brake"], "correct": 1, "exp": "Weight transfers forward during braking, so the front brake normally provides most stopping force.", "source": "Trafikverket: Motorcycle braking", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is safest if you must brake while leaned over in a curve?", "a": ["Grab the front brake abruptly", "Brake smoothly and progressively, and straighten the bike if possible", "Close your eyes and hold lean", "Use only the horn"], "correct": 1, "exp": "Traction is shared between cornering and braking; sudden inputs while leaned over can exceed grip.", "source": "Trafikverket: Motorcycle handling", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is countersteering at road speed?", "a": ["Pushing the handlebar on the side you want to turn toward", "Turning the bars sharply the same way as a bicycle at walking speed", "Using only body weight", "Using the rear brake to turn"], "correct": 0, "exp": "At normal riding speeds, a light push on the right bar initiates a right lean/turn, and vice versa.", "source": "Trafikverket: Motorcycle manoeuvring", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why should you keep a relaxed grip on the handlebars?", "a": ["To reduce control", "A tense grip can cause fatigue and make steering less smooth", "To let the bike steer itself at all times", "Because brakes work better"], "correct": 1, "exp": "A relaxed but secure grip supports smooth control and reduces fatigue.", "source": "Trafikverket: Motorcycle manoeuvring", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should you check before carrying a passenger?", "a": ["Only that the passenger has a phone", "That the motorcycle is equipped for a passenger and the passenger has suitable protective equipment", "Only tyre colour", "Nothing if the trip is short"], "correct": 1, "exp": "Passenger carrying requires suitable seat/footrests and protective equipment; handling and braking change with extra weight.", "source": "Trafikverket: Motorcycle safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "How does a passenger affect motorcycle handling?", "a": ["No effect", "More weight changes braking distance, acceleration, suspension and balance", "It improves cornering automatically", "It makes speed limits lower by law everywhere"], "correct": 1, "exp": "Extra load changes the motorcycle’s dynamics and may require adjusted tyre pressure/suspension according to the manual.", "source": "Trafikverket: Motorcycle safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should luggage on a motorcycle be like?", "a": ["Loose but light", "Secure, balanced and not interfering with steering, lights, suspension or controls", "As high and far back as possible", "Held by the passenger by hand"], "correct": 1, "exp": "Poorly secured or unbalanced luggage can destabilize the motorcycle or interfere with controls.", "source": "Trafikverket: Motorcycle safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why is gravel on the road edge dangerous in a bend?", "a": ["It increases tyre temperature", "It can reduce grip suddenly while the motorcycle is leaned over", "It improves braking", "It only affects bicycles"], "correct": 1, "exp": "Loose gravel can make the tyre slide, especially during cornering or braking.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should you do when crossing wet tram tracks or metal covers?", "a": ["Brake hard on them", "Cross as upright and as close to a right angle as practical, with smooth inputs", "Accelerate sharply", "Lean more to improve grip"], "correct": 1, "exp": "Metal and rails are slippery when wet; minimize lean and avoid sudden braking/throttle.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why is the first rain after a dry period especially hazardous?", "a": ["Rain makes tyres larger", "Oil, rubber and dirt can rise to the surface before being washed away", "ABS is disabled by rain", "Visibility always improves"], "correct": 1, "exp": "The first rain can create a very slippery film before the road is washed clean.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "How should you handle strong crosswinds on a motorcycle?", "a": ["Ride with stiff arms and high speed", "Reduce speed, keep a relaxed grip and be prepared for gusts, especially near openings or large vehicles", "Close your eyes briefly", "Ride very close to lorries"], "correct": 1, "exp": "Crosswinds can push a motorcycle sideways. Lower speed and relaxed control give more margin.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why are large vehicles especially hazardous for motorcyclists?", "a": ["They are always slower", "They create blind spots, wind turbulence and can hide other road users", "They always have priority", "They have shorter stopping distances"], "correct": 1, "exp": "Lorries and buses can hide hazards, create wind turbulence and have large blind spots.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "When following a large vehicle, what is a safe strategy?", "a": ["Stay close for slipstream", "Keep enough distance to see ahead and be seen", "Ride in its blind spot", "Use high beam constantly"], "correct": 1, "exp": "A larger following gap improves your view, your visibility and your stopping margin.", "source": "Trafikverket: Motorcycle safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why should you check mirrors before braking firmly?", "a": ["To see whether following traffic is close and adjust your warning/braking if possible", "To check your hairstyle", "Because it is only required in the test", "To see the speed limit"], "correct": 0, "exp": "Rear traffic may not react as fast as you; mirror checks help you manage rear-end risk.", "source": "Trafikverket: Motorcycle safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is the safest response if your rear tyre begins to slide under acceleration?", "a": ["Abruptly close the throttle", "Smoothly reduce throttle and avoid sudden steering/braking", "Apply full front brake", "Jump off"], "correct": 1, "exp": "Sudden throttle changes can worsen the slide; smooth control gives the tyre a chance to regain grip.", "source": "Trafikverket: Motorcycle handling", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should you do before a bend on an unfamiliar road?", "a": ["Enter fast and brake in the bend", "Set a safe speed before the bend and be ready for it to tighten", "Look only at the centre line", "Use the horn instead of slowing"], "correct": 1, "exp": "Speed should be set before the bend so you have traction and time for surprises.", "source": "Trafikverket: Motorcycle handling", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "In fog, what is the most important speed rule?", "a": ["Drive at the posted speed limit", "Be able to stop within the distance you can see to be clear", "Use high beam and continue", "Follow the vehicle ahead closely"], "correct": 1, "exp": "In poor visibility, speed must match visible stopping distance. High beam often worsens fog glare.", "source": "Trafikverket: Road safety / visibility", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#020617\"/><circle cx=\"135\" cy=\"30\" r=\"15\" fill=\"#fde68a\"/><rect x=\"0\" y=\"70\" width=\"180\" height=\"34\" fill=\"#1f2937\"/><path d=\"M45 80l90-28v56z\" fill=\"#fde68a\" opacity=\".35\"/><circle cx=\"45\" cy=\"85\" r=\"8\" fill=\"#fde68a\"/><g transform=\"translate(65,78)\" stroke=\"#ffd166\" fill=\"none\" stroke-width=\"3\"><circle cx=\"6\" cy=\"10\" r=\"6\"/><circle cx=\"28\" cy=\"10\" r=\"6\"/><path d=\"M6 4h22\"/></g></svg>", "difficulty": "standard"}, {"cat": "Risk awareness", "q": "Why is high beam often unsuitable in fog or heavy snowfall?", "a": ["It uses too much battery", "Light reflects back and can reduce what you see", "It is illegal at all times", "It makes tyres colder"], "correct": 1, "exp": "High beam can reflect off fog/snow and reduce visibility; low beam/fog lights are usually better.", "source": "Trafikverket: Road safety / visibility", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#020617\"/><circle cx=\"135\" cy=\"30\" r=\"15\" fill=\"#fde68a\"/><rect x=\"0\" y=\"70\" width=\"180\" height=\"34\" fill=\"#1f2937\"/><path d=\"M45 80l90-28v56z\" fill=\"#fde68a\" opacity=\".35\"/><circle cx=\"45\" cy=\"85\" r=\"8\" fill=\"#fde68a\"/><g transform=\"translate(65,78)\" stroke=\"#ffd166\" fill=\"none\" stroke-width=\"3\"><circle cx=\"6\" cy=\"10\" r=\"6\"/><circle cx=\"28\" cy=\"10\" r=\"6\"/><path d=\"M6 4h22\"/></g></svg>", "difficulty": "standard"}, {"cat": "Risk awareness", "q": "At dusk, why are wildlife collisions a major motorcycle risk in Sweden?", "a": ["Animals are less active then", "Animals may appear suddenly and a motorcycle rider is very exposed", "Motorcycles scare all wildlife away", "Only cars hit animals"], "correct": 1, "exp": "Wildlife such as deer and moose can appear suddenly; on a motorcycle the consequences can be severe.", "source": "Trafikverket: Road safety / wildlife", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "If an animal suddenly appears ahead, what is usually safest?", "a": ["Swerve violently without braking", "Brake firmly in a straight line if possible and avoid abrupt swerving", "Accelerate toward it", "Look at the animal until impact"], "correct": 1, "exp": "A controlled straight-line brake is often safer than a panic swerve that may cause loss of control.", "source": "Trafikverket: Road safety / wildlife", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "Why are painted road markings slippery when wet?", "a": ["They are always heated", "They can have much lower friction than asphalt", "They are magnetic", "They raise tyre pressure"], "correct": 1, "exp": "Painted markings can be very slippery for motorcycle tyres when wet.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "Why is diesel spill on a roundabout especially dangerous?", "a": ["Roundabouts are always downhill", "You are often leaning and accelerating/braking, so grip demand is high", "Diesel improves tyre grip", "It only affects trucks"], "correct": 1, "exp": "Spilt diesel drastically reduces grip, especially when tyres are leaned in a roundabout.", "source": "Trafikverket: Motorcycle risk awareness", "img": "<svg viewBox=\"0 0 180 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"140\" rx=\"10\" fill=\"#233123\"/><circle cx=\"90\" cy=\"70\" r=\"48\" fill=\"#454b55\"/><circle cx=\"90\" cy=\"70\" r=\"26\" fill=\"#233123\"/><path d=\"M88 28a42 42 0 0 1 40 38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M123 58l13 16-20-2z\" fill=\"#ffd200\"/><path d=\"M92 112a42 42 0 0 1-40-38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M57 82L44 66l20 2z\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What does a safe following distance give you?", "a": ["Only better fuel economy", "Time to see, decide and act if traffic ahead changes", "The right to overtake", "A shorter stopping distance"], "correct": 1, "exp": "Following distance is reaction time and escape margin. Increase it in rain, darkness or poor visibility.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "When should you increase following distance beyond normal?", "a": ["Only on motorways", "In rain, darkness, fog, gravel, heavy traffic or when following large vehicles", "Only when riding below 30 km/h", "Never; keep the same gap"], "correct": 1, "exp": "Reduced visibility or grip and hidden hazards require a larger margin.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What is a common danger at intersections for motorcycles?", "a": ["Drivers always overestimate motorcycle speed", "Drivers may look but fail to register the motorcycle", "Motorcycles cannot brake at intersections", "Traffic lights hide motorcycles"], "correct": 1, "exp": "Motorcycles are small and can be misjudged or not perceived; expect others may not see you.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "Why should you avoid riding too close to parked cars?", "a": ["It makes fuel consumption worse", "Doors can open and pedestrians can step out suddenly", "It is always illegal to pass parked cars", "It makes lights dimmer"], "correct": 1, "exp": "The door zone is a real motorcycle hazard; leave space and reduce speed.", "source": "Trafikverket: Motorcycle risk awareness", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What is safest when you see a ball roll into the road?", "a": ["Assume no one follows it", "Expect a child may run after it and slow down", "Sound the horn only", "Accelerate past quickly"], "correct": 1, "exp": "A ball or toy can indicate a child nearby; reduce speed and prepare to stop.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What is the best approach to a hidden side road or driveway?", "a": ["Move faster to clear it", "Expect traffic or pedestrians may emerge and adjust speed/position", "Ignore it if you have priority", "Use the centre line always"], "correct": 1, "exp": "Hidden junctions require anticipation, speed adjustment and escape planning.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "Which is safest if you are very tired before a ride?", "a": ["Ride anyway but slower", "Do not ride until rested, or choose another transport", "Drink coffee and ignore tiredness", "Open your visor fully"], "correct": 1, "exp": "Fatigue impairs attention, reaction and judgement; slowing down does not remove the risk.", "source": "Trafikverket: Personal circumstances", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "What should you do if medication can cause drowsiness?", "a": ["Ride if the trip is short", "Do not ride until you know it is safe; consult doctor/pharmacist if unsure", "Take double dose early", "Ride only in daylight"], "correct": 1, "exp": "Drowsy medication can make riding unsafe. Follow warnings and professional advice.", "source": "Trafikverket: Personal circumstances", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "How can anger or stress affect riding?", "a": ["It improves focus", "It can narrow attention and increase risk-taking", "It makes braking shorter", "It only affects car drivers"], "correct": 1, "exp": "Strong emotions can reduce judgement and increase aggressive or distracted riding.", "source": "Trafikverket: Personal circumstances", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "What is safest if your visor becomes too scratched or dirty?", "a": ["Continue because the helmet is legal", "Clean/replace it so you have clear vision, especially against low sun or headlights", "Only ride faster to shorten the trip", "Use high beam"], "correct": 1, "exp": "Clear vision is essential; scratches and dirt can scatter light and hide hazards.", "source": "Trafikverket: Personal circumstances / visibility", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "Why is alcohol especially dangerous for motorcyclists?", "a": ["It only affects balance at walking pace", "It impairs balance, coordination, judgement and reaction time", "It improves confidence safely", "It only affects vision"], "correct": 1, "exp": "Motorcycle riding depends heavily on balance and judgement, both impaired by alcohol.", "source": "Transportstyrelsen/Trafikverket: Alcohol and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What is the legal minimum tread depth for a motorcycle tyre in Sweden?", "a": ["0.8 mm", "1.0 mm", "1.6 mm", "3.0 mm"], "correct": 1, "exp": "For motorcycles, the legal minimum tread depth is 1.0 mm, but replacing earlier is often safer.", "source": "Transportstyrelsen: Motorcycle equipment/tyres", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Why should tyre pressure be checked when tyres are cold?", "a": ["Cold tyres are easier to remove", "Warm tyres show a higher pressure and can give a misleading reading", "It is required only for cars", "ABS needs cold tyres"], "correct": 1, "exp": "Pressure rises with heat, so cold checks match manufacturer recommendations.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Where should you find the correct tyre pressure for your motorcycle?", "a": ["On any petrol pump sticker", "In the motorcycle manual/label for the specific bike and load", "Always 2.5 bar front and rear", "From the tyre colour"], "correct": 1, "exp": "Correct pressure depends on motorcycle model, tyre and load; use manufacturer information.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Why is a worn or squared-off rear tyre a risk?", "a": ["It improves cornering", "It can reduce grip and make cornering less predictable", "It makes the bike legally faster", "It only affects appearance"], "correct": 1, "exp": "Tyre wear changes the contact patch and handling, especially in bends and wet conditions.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What should you do if brake lever feel suddenly becomes spongy?", "a": ["Ignore it until service", "Treat it as a serious fault and inspect/repair before riding", "Pump the throttle", "Reduce tyre pressure"], "correct": 1, "exp": "A spongy brake lever may indicate air, fluid problems or other brake faults. Do not continue as normal.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Why is old brake fluid a problem?", "a": ["It becomes too colourful", "It absorbs moisture, lowering boiling point and risking brake fade", "It increases tyre wear", "It makes lights dim"], "correct": 1, "exp": "Brake fluid is hygroscopic; moisture can reduce braking performance under heat.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What does the oil-pressure warning light usually require?", "a": ["Continue to the next city", "Stop safely as soon as possible and investigate; engine damage may occur", "Rev the engine", "Turn on high beam"], "correct": 1, "exp": "Oil pressure warnings can mean immediate engine risk; stop safely and check.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What does the coolant temperature warning light mean?", "a": ["Fuel is low", "Engine temperature is too high; stop safely and let it cool", "ABS is active", "Tyres are cold"], "correct": 1, "exp": "Overheating can damage the engine; stop safely and do not open a hot coolant system.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What should you check on a chain-driven motorcycle before riding?", "a": ["Only the colour", "Chain tension, lubrication and obvious damage/wear", "The radio antenna", "Only the front tyre"], "correct": 1, "exp": "Chain condition and tension affect safety and drive reliability.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What can an over-tight motorcycle chain cause?", "a": ["Smoother suspension always", "Damage to chain, sprockets or bearings and poor suspension movement", "Higher legal speed", "No effect"], "correct": 1, "exp": "Incorrect chain tension can damage components and affect handling.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Why should controls move freely and return properly?", "a": ["It is only for comfort", "A sticking throttle, brake or clutch can create a dangerous loss of control", "It saves fuel only", "It improves paint life"], "correct": 1, "exp": "Control faults can directly cause crashes; check operation before riding.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What should you check about lights and indicators before riding?", "a": ["Only headlight colour", "That headlight, brake light, tail light and indicators work", "Only that the dashboard lights up", "Nothing in daytime"], "correct": 1, "exp": "Motorcycles rely on lights for visibility and signalling.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Why should suspension be adjusted for passenger/luggage when recommended?", "a": ["To make the seat higher only", "To maintain correct sag, ground clearance, steering and stability", "To reduce the need for insurance", "To turn off ABS"], "correct": 1, "exp": "Load changes suspension geometry and handling; follow the manual.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What is aquaplaning risk on a motorcycle?", "a": ["Impossible on two wheels", "Loss of tyre contact with the road through water, especially with speed/worn tyres", "Only a car problem", "A type of engine braking"], "correct": 1, "exp": "Water can reduce contact and grip; reduce speed in standing water.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What should you do if a mirror is loose or badly adjusted?", "a": ["Ride anyway and turn your head less", "Fix/adjust it before riding", "Remove both mirrors", "Use only the speedometer"], "correct": 1, "exp": "Mirrors are needed for rear awareness but do not replace blind-spot checks.", "source": "Trafikverket: Vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "Which riding style is most fuel-efficient and safe?", "a": ["Hard acceleration and hard braking", "Smooth acceleration, early planning and avoiding unnecessary braking", "Keeping high revs at all times", "Idling to warm up for a long time"], "correct": 1, "exp": "Smooth, anticipatory riding reduces fuel use and emissions while improving safety.", "source": "Trafikverket: Environment and eco-driving", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "Why does high speed increase fuel use strongly?", "a": ["Because tyres become square immediately", "Air resistance increases rapidly with speed", "Because fuel expands", "It does not affect motorcycles"], "correct": 1, "exp": "Aerodynamic drag rises strongly with speed, so high cruising speed increases consumption.", "source": "Trafikverket: Environment and eco-driving", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "How can correct tyre pressure reduce environmental impact?", "a": ["It increases rolling resistance", "It reduces unnecessary rolling resistance and tyre wear", "It removes exhaust emissions", "It makes fuel free"], "correct": 1, "exp": "Correct pressure improves efficiency and tyre life.", "source": "Trafikverket: Environment and vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "What is the environmental benefit of maintaining your motorcycle?", "a": ["None", "A well-maintained engine and drivetrain can use less fuel and emit less pollution", "It makes riding licence-free", "It increases noise"], "correct": 1, "exp": "Maintenance such as correct oil, filters, chain and tyre pressure supports cleaner, efficient operation.", "source": "Trafikverket: Environment and vehicle knowledge", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "Why should you avoid unnecessary noise from a motorcycle?", "a": ["Noise has no effect", "Noise disturbs people and can lead to negative environmental and legal consequences", "It improves safety in all cases", "It lowers fuel tax"], "correct": 1, "exp": "Unnecessary noise is a disturbance and riding should be considerate.", "source": "Trafikverket: Environment and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You approach a green light but traffic is stopped just after the intersection. What should you do?", "a": ["Enter and block the intersection", "Wait before entering until there is space beyond it", "Use the pavement", "Sound horn and continue"], "correct": 1, "exp": "Do not enter an intersection if you cannot clear it; blocking creates danger and obstruction.", "source": "Transportstyrelsen: Traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "A car ahead brakes suddenly. What is your first priority?", "a": ["Check phone navigation", "Brake/evade while keeping the motorcycle stable and aware of following traffic if possible", "Sound horn only", "Accelerate around blindly"], "correct": 1, "exp": "Emergency response requires controlled braking/escape and awareness of surrounding traffic.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You are approaching a zebra crossing with a van stopped just before it. What is safest?", "a": ["Overtake the van at speed", "Assume pedestrians may be hidden and slow/stop", "Ride between van and kerb", "Use horn and continue"], "correct": 1, "exp": "A stopped vehicle can hide pedestrians; approach ready to stop.", "source": "Transportstyrelsen: Pedestrian crossing rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#1f2937\"/><rect x=\"0\" y=\"42\" width=\"180\" height=\"36\" fill=\"#374151\"/><g fill=\"white\"><rect x=\"48\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"64\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"80\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"96\" y=\"40\" width=\"10\" height=\"40\"/><rect x=\"112\" y=\"40\" width=\"10\" height=\"40\"/></g><circle cx=\"88\" cy=\"36\" r=\"8\" fill=\"#ffd200\"/><path d=\"M88 44v22M88 55l-12 8M88 55l12 8M88 66l-9 18M88 66l9 18\" stroke=\"#ffd200\" stroke-width=\"5\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic situations", "q": "A vehicle behind you is following too closely. What is usually safest?", "a": ["Brake-check it", "Increase your forward safety margin and let it pass when safe", "Speed far above the limit", "Ignore it completely"], "correct": 1, "exp": "If rear margin is poor, create more space ahead and avoid sudden braking; let the tailgater pass safely if possible.", "source": "Trafikverket: Road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You need to turn left from a rural road and traffic is close behind. What should you do?", "a": ["Signal early, position correctly, check mirrors and be ready to wait safely", "Turn without signalling", "Stop in the middle without warning", "Wave the traffic past blindly"], "correct": 0, "exp": "Turning across traffic requires early signalling, observation and a safe position.", "source": "Transportstyrelsen: Traffic rules", "img": null, "difficulty": "standard"}];
const SOURCE_LINKS = [["Transportstyrelsen – Vägmärken", "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/vagmarken/"], ["Transportstyrelsen – Trafikregler", "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/trafikregler/"], ["Transportstyrelsen – Motorcykel licence", "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/ta-korkort/valj-behorighet/motorcykel/"], ["Transportstyrelsen – MC rules", "https://www.transportstyrelsen.se/mc"], ["Transportstyrelsen – Kontrollbesiktning motorcykel", "https://www.transportstyrelsen.se/sv/vagtrafik/fordon/aga-kopa-eller-salja-fordon/fordonsbesiktning/besiktningsregler/motorcykel/"], ["Transportstyrelsen – Körkort och alkohol", "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/har-korkort/villkor-och-medicinska-krav/korkort-och-alkohol/"], ["Transportstyrelsen – Mobile phone rules", "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/trafikregler/i-fordonet/regler-for-mobilanvandning-och-kommunikationsutrustning/"], ["Transportstyrelsen – Riskutbildning MC", "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/ta-korkort/riskutbildning/riskutbildning-motorcykel/"], ["Trafikverket – Motorcycle tests", "https://www.trafikverket.se/korkort/ta-korkort/motorcykel/"]];
const STORAGE_KEY = 'swedish_mc_theory_release_candidate_answers_v1';
let order = QUESTIONS.map((_,i)=>i);
let current=0;
let answers = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
let mode='quiz';
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(answers))}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function setFilter(){const cats=[...new Set(QUESTIONS.map(q=>q.cat))]; $('filter').innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
function rebuildOrder(){const f=$('filter').value; order=QUESTIONS.map((q,i)=>[q,i]).filter(([q])=>f==='all'||q.cat===f).map(x=>x[1]); current=0; render()}
function stats(){let ok=0,bad=0,total=0; for(const [k,v] of Object.entries(answers)){if(!QUESTIONS[k]) continue; total++; if(QUESTIONS[k].correct===v)ok++; else bad++;} $('sOk').textContent=ok; $('sBad').textContent=bad; if($('sTotal')) $('sTotal').textContent=QUESTIONS.length; $('pct').textContent=total?Math.round(ok/total*100)+'%':'0%'; $('scoreText').textContent=`${ok} / ${total} answered correctly`;}
function renderNav(){const nav=$('nav'); nav.innerHTML=''; order.forEach((idx,pos)=>{let b=document.createElement('button'); b.textContent=pos+1; b.className='qnav'+(pos===current?' current':'')+(answers[idx]!==undefined?(answers[idx]===QUESTIONS[idx].correct?' ok':' bad'):''); b.onclick=()=>{current=pos; render()}; nav.appendChild(b)})}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); stats(); renderNav(); if(mode==='all')return renderAll(); if(mode==='sources')return renderSources(); renderQuiz()}
function renderQuiz(){const idx=order[current]; const q=QUESTIONS[idx]; $('cat').textContent=q.cat; $('counter').textContent=`${current+1} / ${order.length}`; $('bar').style.width=((current+1)/order.length*100)+'%'; const chosen=answers[idx]; const media=q.img?`<div class="media">${q.img}</div>`:''; $('content').innerHTML=`<h1>${q.q}</h1>${media}<div class="answers">${q.a.map((a,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}</div><div class="explain" id="exp"><b>Explanation</b><br>${q.exp}<div class="source">Source: ${q.source}</div></div><div class="actions"><button class="secondary" onclick="prevQ()">Previous</button><button class="secondary" onclick="resetCurrent()">Reset this</button><button class="secondary" onclick="resetAll()">Reset all</button><button class="secondary" onclick="newShuffledPractice()">Shuffle</button><button class="secondary" onclick="nextUnanswered()">Next unanswered</button><button class="primary" id="next" onclick="nextQ()">Next question →</button></div>`; document.querySelectorAll('.answer').forEach(btn=>{btn.onclick=()=>choose(idx,Number(btn.dataset.i));}); if(chosen!==undefined) reveal(idx, chosen);}
function choose(idx,i){if(answers[idx]!==undefined)return; answers[idx]=i; save(); reveal(idx,i); stats(); renderNav();}
function reveal(idx,chosen){const q=QUESTIONS[idx]; document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true; if(j===q.correct)b.classList.add('correct'); else if(j===chosen)b.classList.add('wrong'); else b.classList.add('dim');}); const exp=$('exp'); if(exp)exp.classList.add('show');}
function nextQ(){if(current<order.length-1)current++; else current=0; render()} function prevQ(){if(current>0)current--; else current=order.length-1; render()}
function nextUnanswered(){const start=current; for(let step=1; step<=order.length; step++){const pos=(start+step)%order.length; if(answers[order[pos]]===undefined){current=pos; render(); return;}} nextQ();}
function resetCurrent(){const idx=order[current]; if(idx!==undefined){delete answers[idx]; save(); render();}}
function resetAll(){if(confirm('Reset all saved answers and start over?')){answers={}; save(); current=0; render();}}
function newShuffledPractice(){if(confirm('Start a fresh shuffled practice session? This clears saved answers.')){answers={}; save(); rebuildOrder(); shuffle(order); current=0; mode='quiz'; render();}}
$('backBtn').onclick=prevQ;
$('filter').onchange=rebuildOrder;
document.querySelectorAll('.navbtn[data-mode]').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; render(); };
});
if($('resetBtn')) $('resetBtn').onclick=resetAll;
if($('shuffleBtn')) $('shuffleBtn').onclick=newShuffledPractice;
function renderAll(){$('cat').textContent='All questions'; $('counter').textContent=`${QUESTIONS.length} total`; $('bar').style.width='100%'; $('content').innerHTML='<h1>All questions</h1>'+QUESTIONS.map((q,i)=>`<div class="reviewitem"><span class="pill">${q.cat}</span><h3>${i+1}. ${q.q}</h3><p><b>Answer:</b> ${q.a[q.correct]}</p><p style="color:var(--muted)">${q.exp}</p><p class="source">${q.source}</p></div>`).join('')}
function renderSources(){$('cat').textContent='Official sources'; $('counter').textContent=''; $('bar').style.width='100%'; $('content').innerHTML='<h1>Official sources used</h1><p style="color:var(--muted);line-height:1.6">This preview is based on official Swedish sources and conservative, exam-relevant wording. It does not claim to replace official study material or a driving school.</p>'+SOURCE_LINKS.map(([name,url])=>`<div class="reviewitem"><b>${name}</b><br><a href="${url}" target="_blank" rel="noopener" style="color:#ffb18f">${url}</a></div>`).join('')}
setFilter(); render();
</script>
</body></html>
