<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swedish MC Theory</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --accent: #ff5c1a;
    --accent2: #ff8c5a;
    --text: #f0ede8;
    --muted: #7a7880;
    --success: #2dd4a0;
    --error: #ff4466;
    --border: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── HOME ── */
  #home {
    background: radial-gradient(ellipse at 20% 10%, #1a0a00 0%, var(--bg) 55%),
                radial-gradient(ellipse at 80% 90%, #0a0510 0%, transparent 60%);
    position: relative;
    overflow: hidden;
    justify-content: space-between;
    padding: 0;
  }

  .home-noise {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    opacity: 0.5;
  }

  .home-header {
    position: relative; z-index: 1;
    padding: 56px 28px 0;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(255,92,26,0.12);
    border: 1px solid rgba(255,92,26,0.25);
    border-radius: 100px;
    padding: 4px 12px;
    margin-bottom: 20px;
  }

  .home-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(64px, 18vw, 96px);
    line-height: 0.9;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .home-title span {
    color: var(--accent);
    display: block;
  }

  .home-sub {
    margin-top: 20px;
    font-size: 14px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.6;
    max-width: 280px;
  }

  .home-moto {
    position: relative; z-index: 1;
    font-size: 120px;
    text-align: center;
    line-height: 1;
    filter: drop-shadow(0 0 60px rgba(255,92,26,0.15));
    animation: float 4s ease-in-out infinite;
    padding: 20px 0;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .home-bottom {
    position: relative; z-index: 1;
    padding: 0 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }

  .stat-val { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; font-weight: 300; }

  .btn-primary {
    width: 100%;
    padding: 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 24px rgba(255,92,26,0.35);
  }

  .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 12px rgba(255,92,26,0.25); }

  .btn-secondary {
    width: 100%;
    padding: 16px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-secondary:active { transform: scale(0.97); }

  /* ── CATEGORY SCREEN ── */
  #categories {
    padding: 56px 24px 40px;
  }

  .screen-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 32px;
  }

  .back-btn {
    width: 40px; height: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px;
    flex-shrink: 0;
  }

  .screen-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .cat-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .cat-card:active { transform: scale(0.98); background: var(--surface2); }

  .cat-card::after {
    content: '›';
    position: absolute; right: 18px;
    font-size: 20px; color: var(--muted);
  }

  .cat-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .cat-info { flex: 1; }
  .cat-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .cat-count { font-size: 12px; color: var(--muted); font-weight: 300; }

  .cat-all { background: rgba(255,92,26,0.08); border-color: rgba(255,92,26,0.2); }
  .cat-all .cat-icon { background: rgba(255,92,26,0.15); }

  /* ── QUIZ SCREEN ── */
  #quiz {
    display: flex; flex-direction: column;
  }

  .quiz-header {
    padding: 52px 24px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .quiz-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }

  .quiz-category {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
  }

  .quiz-counter {
    font-size: 13px; color: var(--muted); font-weight: 300;
  }

  .progress-bar {
    width: 100%; height: 3px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .quiz-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 120px;
    -webkit-overflow-scrolling: touch;
  }

  .question-text {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.5;
    margin-bottom: 28px;
    color: var(--text);
  }

  .answers {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .answer-btn {
    width: 100%;
    padding: 16px 20px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.45;
    display: flex; align-items: flex-start; gap: 12px;
  }

  .answer-btn:active:not(:disabled) { transform: scale(0.98); }

  .answer-letter {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--surface2);
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    color: var(--muted);
    transition: all 0.2s;
  }

  .answer-btn.correct {
    border-color: var(--success);
    background: rgba(45,212,160,0.08);
  }

  .answer-btn.correct .answer-letter {
    background: var(--success);
    color: #000;
  }

  .answer-btn.wrong {
    border-color: var(--error);
    background: rgba(255,68,102,0.08);
  }

  .answer-btn.wrong .answer-letter {
    background: var(--error);
    color: #fff;
  }

  .answer-btn.dimmed {
    opacity: 0.35;
  }

  .answer-btn:disabled { cursor: default; }

  .explanation {
    margin-top: 18px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    display: none;
  }

  .explanation.show { display: block; }

  .explanation strong {
    color: var(--text);
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .quiz-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 16px 24px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 80%, transparent);
  }

  #next-btn {
    display: none;
  }

  /* ── RESULT SCREEN ── */
  #result {
    justify-content: center;
    align-items: center;
    padding: 40px 24px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 30%, #1a0a00 0%, var(--bg) 65%);
  }

  .result-icon { font-size: 80px; margin-bottom: 16px; animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1); }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 96px;
    line-height: 1;
    color: var(--accent);
  }

  .result-label {
    font-size: 13px; color: var(--muted); margin-bottom: 8px;
    letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
  }

  .result-verdict {
    font-size: 22px; font-weight: 500; margin-bottom: 8px;
  }

  .result-sub { font-size: 14px; color: var(--muted); margin-bottom: 40px; font-weight: 300; }

  .pass-bar {
    width: 100%; max-width: 280px;
    height: 6px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
    margin: 0 auto 32px;
    position: relative;
  }

  .pass-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 1s cubic-bezier(0.4,0,0.2,1);
  }

  .pass-threshold {
    position: absolute;
    top: -14px; 
    font-size: 9px; color: var(--muted);
    transform: translateX(-50%);
  }

  .result-actions {
    display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px;
  }

  /* ── REVIEW SCREEN ── */
  #review {
    padding: 52px 24px 40px;
  }

  .review-list {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 16px;
  }

  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  .review-item.wrong-item { border-color: rgba(255,68,102,0.25); }
  .review-item.right-item { border-color: rgba(45,212,160,0.2); }

  .review-q { font-size: 14px; line-height: 1.5; margin-bottom: 10px; }

  .review-a {
    font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px;
    font-weight: 400;
  }

  .review-a.correct-a { background: rgba(45,212,160,0.1); color: var(--success); }
  .review-a.wrong-a { background: rgba(255,68,102,0.1); color: var(--error); }

  .review-exp {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border);
    line-height: 1.6;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 100px; margin-bottom: 8px;
  }

  .chip-pass { background: rgba(45,212,160,0.1); color: var(--success); }
  .chip-fail { background: rgba(255,68,102,0.1); color: var(--error); }
</style>
</head>
<body>

<!-- ── HOME ── -->
<div id="home" class="screen active">
  <div class="home-noise"></div>
  <div class="home-header">
    <div class="badge">🇸🇪 Swedish MC Theory</div>
    <h1 class="home-title">THEORY<span>TEST</span></h1>
    <p class="home-sub">Practice questions for the Swedish motorcycle licence (A1 / A2 / A).</p>
  </div>
  <div class="home-moto">🏍️</div>
  <div class="home-bottom">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="stat-total">100</div>
        <div class="stat-label">Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-sessions">0</div>
        <div class="stat-label">Sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-best">—</div>
        <div class="stat-label">Best score</div>
      </div>
    </div>
    <button class="btn-primary" onclick="showCategories()">Start quiz</button>
    <button class="btn-secondary" onclick="showReviewAll()">Browse all questions</button>
  </div>
</div>

<!-- ── CATEGORIES ── -->
<div id="categories" class="screen">
  <div class="screen-header">
    <div class="back-btn" onclick="showHome()">←</div>
    <h2 class="screen-title">Choose topic</h2>
  </div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<!-- ── QUIZ ── -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <div class="quiz-meta">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="back-btn" onclick="confirmQuit()" title="Quit quiz">✕</div>
        <div class="quiz-category" id="q-category"></div>
      </div>
      <div class="quiz-counter" id="q-counter"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="q-progress"></div></div>
  </div>
  <div class="quiz-body">
    <p class="question-text" id="q-text"></p>
    <div class="answers" id="q-answers"></div>
    <div class="explanation" id="q-explanation">
      <strong>💡 Explanation</strong>
      <span id="q-exp-text"></span>
    </div>
  </div>
  <div class="quiz-footer">
    <button class="btn-primary" id="next-btn" onclick="nextQuestion()">Next question →</button>
  </div>
</div>

<!-- Quit confirmation overlay -->
<div id="quit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;align-items:center;justify-content:center;padding:24px;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:320px;width:100%;text-align:center;">
    <div style="font-size:36px;margin-bottom:12px;">🏍️</div>
    <h3 style="font-size:18px;font-weight:600;margin-bottom:8px;">Quit this quiz?</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.5;">Your progress will be lost. You've answered <span id="quit-progress"></span> questions so far.</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn-primary" style="background:var(--error);box-shadow:none;" onclick="doQuit()">Yes, quit</button>
      <button class="btn-secondary" onclick="cancelQuit()">Keep riding →</button>
    </div>
  </div>
</div>

<!-- ── RESULT ── -->
<div id="result" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-label">Your score</div>
  <div class="result-score" id="result-score"></div>
  <div class="result-verdict" id="result-verdict"></div>
  <div class="result-sub" id="result-sub"></div>
  <div class="pass-bar">
    <div class="pass-fill" id="pass-fill"></div>
  </div>
  <div class="result-actions">
    <button class="btn-primary" onclick="retryQuiz()">Try again ↺</button>
    <button class="btn-secondary" onclick="reviewWrong()">Review wrong answers</button>
    <button class="btn-secondary" onclick="showHome()">← Home</button>
  </div>
</div>

<!-- ── REVIEW ── -->
<div id="review" class="screen">
  <div class="screen-header">
    <div class="back-btn" id="review-back">←</div>
    <h2 class="screen-title" id="review-title">Review</h2>
  </div>
  <div class="review-list" id="review-list"></div>
</div>

<script>
// ═══════════════════════════════════════
//  QUESTION BANK
// ═══════════════════════════════════════
const QUESTIONS = [
  // ── TRAFFIC RULES ──
  {cat:"Trafikregler", q:"What is the speed limit for motorcycles on Swedish motorways (motorväg)?",
   a:["90 km/h","110 km/h","120 km/h","130 km/h"], correct:1,
   exp:"The standard speed limit on Swedish motorways is 110 km/h (Trafikförordningen 9 kap. 1§). 120 km/h only applies on certain high-standard stretches where it is specifically signed. 130 km/h does not exist as a limit in Sweden."},
  {cat:"Trafikregler", q:"You approach an uncontrolled intersection. A car comes from your right. Who has priority?",
   a:["You do, since you are on a motorcycle","The car from the right has priority","The vehicle arriving first has priority","Whoever flashes their lights first"], correct:1,
   exp:"Sweden uses the right-hand rule: at uncontrolled intersections, traffic from the right has priority."},
  {cat:"Trafikregler", q:"What is the minimum following distance you should maintain at 90 km/h?",
   a:["25 metres","50 metres","At least 3 seconds of gap","1 car length per 10 km/h"], correct:2,
   exp:"A safe following distance is expressed as a time gap — at least 3 seconds. This adjusts automatically with speed."},
  {cat:"Trafikregler", q:"When are you allowed to overtake on the right side in Sweden?",
   a:["Never","Only on motorways","When the vehicle ahead is turning left, OR on multi-lane roads at ≤70 km/h, OR in queuing traffic — but NOT freely on single-lane roads above 70 km/h","Only when a police officer signals you to"], correct:2,
   exp:"Overtaking on the right (höger sida) is only permitted in these specific cases: (1) the vehicle ahead is turning left, (2) on roads with two or more lanes per direction AND at speeds ≤70 km/h, or (3) in queuing traffic on multi-lane roads above 70 km/h. Above 70 km/h on a single-lane road, you may NOT overtake on the right — only when queuing. (Trafikförordningen 3 kap. 15§)rked lanes."},
  {cat:"Trafikregler", q:"A flashing yellow light at an intersection means:",
   a:["Stop and give way","Prepare to stop","Drive with caution","You have priority"], correct:2,
   exp:"A flashing yellow light is a warning signal — proceed with caution and be prepared for hazards."},
  {cat:"Trafikregler", q:"What does a solid yellow centre line mean on a Swedish road?",
   a:["Overtaking is allowed in good conditions","No overtaking permitted from either side","Overtaking allowed for motorcycles only","Temporary road works ahead"], correct:1,
   exp:"A solid yellow centre line means overtaking is prohibited. You must not cross it."},
  {cat:"Trafikregler", q:"You want to make a U-turn. When is this allowed?",
   a:["Whenever it is physically possible","Only in residential zones","When it can be done safely without hindering other traffic and no sign prohibits it","Only at marked U-turn zones"], correct:2,
   exp:"U-turns are allowed when safe and not prohibited by signs, but you must ensure you do not endanger or obstruct other road users."},
  {cat:"Trafikregler", q:"What is the speed limit in a Swedish built-up area (tättbebyggt område) unless otherwise signed?",
   a:["30 km/h","50 km/h","60 km/h","70 km/h"], correct:1,
   exp:"The default speed limit in built-up areas is 50 km/h. Lower limits (30 km/h, 40 km/h) may apply on specific roads."},
  {cat:"Trafikregler", q:"When must you use dipped headlights (low beam) on a motorcycle in Sweden?",
   a:["Only at night","Only in tunnels and poor visibility","At all times when riding, day and night","Only outside built-up areas"], correct:2,
   exp:"In Sweden, motorcycles must have headlights on at all times — day and night. This is required by law and is compulsory for all motor vehicles."},
  {cat:"Trafikregler", q:"A pedestrian has stepped onto a zebra crossing ahead of you. What must you do?",
   a:["Sound your horn to warn them","Flash your headlights and continue","Give way and stop if necessary","Slow down but maintain speed if the pedestrian is far away"], correct:2,
   exp:"You must give way to pedestrians already on a zebra crossing, or who are clearly about to step onto one."},

  // ── ROAD SIGNS ──
  {cat:"Vägmärken", q:"A round blue sign with a white motorcycle symbol means:",
   a:["Motorcycles prohibited","Motorcycles only allowed","Recommended route for motorcycles","Motorcycle lane begins"], correct:1,
   exp:"Blue circular signs with white symbols indicate mandatory rules. A white motorcycle means this road or lane is for motorcycles only."},
  {cat:"Vägmärken", q:"A triangular red-bordered sign with a motorcycle means:",
   a:["Priority road for motorcycles","Warning: motorcycles commonly present","No motorcycles allowed","Motorcycle checkpoint ahead"], correct:1,
   exp:"Triangular warning signs alert you to potential hazards. This sign warns that motorcycles are frequently encountered on this road."},
  {cat:"Vägmärken", q:"What does a blue square sign with a white arrow pointing right indicate?",
   a:["Recommended direction for large vehicles","Mandatory direction — you must turn right","Parking on the right","Tourist attraction to the right"], correct:1,
   exp:"Blue square signs with white arrows are compulsory direction signs. You must follow the indicated direction."},
  {cat:"Vägmärken", q:"A sign shows a white car and motorcycle on a blue background. What does it mean?",
   a:["Warning for mixed traffic","Road for both cars and motorcycles only (no heavy vehicles)","Passing place ahead","Insurance check point"], correct:1,
   exp:"This sign indicates a road or lane designated for light motor vehicles (cars and motorcycles), excluding heavy vehicles."},
  {cat:"Vägmärken", q:"A red circle with a diagonal line over a motorcycle means:",
   a:["No overtaking by motorcycles","Motorcycles not allowed on this road","Reduce speed for motorcycles","End of motorcycle zone"], correct:1,
   exp:"A red circle with a crossed-out symbol means that type of vehicle is prohibited. Motorcycles are not permitted on this road."},
  {cat:"Vägmärken", q:"What shape are warning signs in Sweden?",
   a:["Round with red border","Square with blue background","Triangle with red border","Diamond with yellow background"], correct:2,
   exp:"Swedish warning signs (and most European warning signs) are white triangles with a red border, containing a black symbol of the hazard."},
  {cat:"Vägmärken", q:"A sign reads '30' inside a red circle. What does it mean?",
   a:["Minimum speed 30 km/h","Advisory speed 30 km/h","Maximum speed limit 30 km/h","Distance 30 metres to next sign"], correct:2,
   exp:"A number inside a red circle is a maximum speed limit sign. You may not exceed 30 km/h."},
  {cat:"Vägmärken", q:"What does the 'End of all local prohibitions' sign look like?",
   a:["A white circle with a black diagonal stripe","A green circle","A white square with a black X","A blue circle with a white arrow"], correct:0,
   exp:"The end of all local prohibitions sign is a white circle crossed by a diagonal black stripe. It cancels all previously shown restrictions."},

  // ── MOTORCYCLE SAFETY ──
  {cat:"MC-Säkerhet", q:"Which is the most effective braking technique on a motorcycle in an emergency?",
   a:["Apply rear brake only to avoid front wheel lockup","Apply front brake only as it provides most stopping power","Apply both brakes progressively, favouring the front brake","Downshift and engine-brake only"], correct:2,
   exp:"Both brakes should be applied simultaneously. The front brake provides up to 70-80% of stopping power. Using both progressively minimises stopping distance without locking wheels."},
  {cat:"MC-Säkerhet", q:"Why is it particularly important to check your mirrors before braking on a motorcycle?",
   a:["To check if emergency vehicles are approaching","Because motorcycles decelerate much faster than cars — a following driver may not react in time","It is not particularly important on a motorcycle","To ensure you signal correctly"], correct:1,
   exp:"Motorcycles can decelerate very quickly. Checking mirrors before braking helps you assess if a following vehicle is too close, allowing you to signal earlier or brake more gently."},
  {cat:"MC-Säkerhet", q:"What is 'target fixation' in motorcycle riding?",
   a:["Using your headlight to focus at night","The tendency to steer toward whatever you are looking at","A technique for navigating tight corners","The way your eyes adjust to oncoming headlights"], correct:1,
   exp:"Target fixation is a dangerous phenomenon where riders steer toward hazards they are focused on. Look where you want to go, not at the hazard."},
  {cat:"MC-Säkerhet", q:"When riding in a group, what formation is recommended?",
   a:["Ride side by side for visibility","Single file with a staggered (quincunx) formation","Single file directly behind each other","Pairs with one rider slightly ahead"], correct:1,
   exp:"A staggered formation maintains adequate spacing between riders while keeping the group compact. The lead rider rides on the left side of the lane, the next on the right, etc."},
  {cat:"MC-Säkerhet", q:"What is 'lane splitting' or 'filtering' and what is its legal status in Sweden?",
   a:["Riding between lanes of slow or stopped traffic — legal in Sweden","Riding between lanes — illegal in Sweden","A technique for navigating roundabouts","Overtaking on the right — permitted in certain conditions"], correct:1,
   exp:"Filtering/lane splitting (riding between lanes of slow or stopped traffic) is NOT legal in Sweden. You must stay within your lane."},
  {cat:"MC-Säkerhet", q:"What protective equipment is mandatory by law when riding a motorcycle in Sweden?",
   a:["Helmet only","Helmet and gloves","Helmet, protective clothing, gloves, sturdy boots, back protector, and goggles or visor","Only a helmet and high-visibility vest"], correct:0,
   exp:"For the practical driving test and by regulation, By Swedish law, only an approved helmet (ECE 22.05/22.06) is mandatory. Protective clothing, gloves, and boots are strongly recommended but are NOT legal requirements in Sweden. or equivalent), gloves, sturdy boots, back protector, and protective goggles or equivalent."},
  {cat:"MC-Säkerhet", q:"How does a motorcycle's stopping distance compare to a car's in dry conditions?",
   a:["Shorter, because motorcycles are lighter","Similar to a car of equal speed","Longer, because motorcycles have only two contact points","It depends entirely on tyre brand"], correct:0,
   exp:"Modern motorcycles with good tyres can stop faster than many cars in dry conditions, due to weight-to-braking-force ratios. However, rider skill and road conditions are critical variables."},
  {cat:"MC-Säkerhet", q:"What is the 'vanishing point' technique when cornering?",
   a:["Closing your eyes in corners to reduce anxiety","Looking to where the road appears to end ahead — if it moves away, you have space; if it closes, adjust speed","Using your mirrors only in corners","Braking at the apex of the corner"], correct:1,
   exp:"The vanishing point is where the two sides of the road appear to meet. If it moves away as you corner, you're safe. If it rushes toward you, slow down — the corner is tightening."},
  {cat:"MC-Säkerhet", q:"Countersteering is a technique used at speeds above approximately 20 km/h. What does it involve?",
   a:["Leaning the body while keeping the handlebars straight","Pushing forward on the handlebar on the side you want to turn toward","Braking with the rear brake to initiate a turn","Using the throttle to steer through corners"], correct:1,
   exp:"To turn right, push forward on the right handlebar. This causes the bike to lean into the turn. It is the primary steering mechanism at speed and is essential to understand and practise."},
  {cat:"MC-Säkerhet", q:"What effect does alcohol have on motorcycle riding ability?",
   a:["It improves reaction time in low-traffic situations","It has minimal effect on experienced riders","It impairs balance, coordination, reaction time and risk judgment","It only affects vision, not physical control"], correct:2,
   exp:"Alcohol impairs multiple critical functions for motorcycle riders: balance, coordination, reaction time, depth perception, and judgment. Even small amounts significantly increase crash risk."},

  // ── VEHICLE KNOWLEDGE ──
  {cat:"Fordonskännedom", q:"What tyre pressure should you use on a motorcycle?",
   a:["Always 2.5 bar front and rear","Whatever pressure makes the tyre feel comfortable","The pressure specified by the motorcycle manufacturer in the owner's manual","Standard car tyre pressure of 2.2 bar"], correct:2,
   exp:"Always follow the manufacturer's specified pressures. These vary between models, tyre sizes, and load conditions. Incorrect pressure affects handling, braking, and tyre wear."},
  {cat:"Fordonskännedom", q:"How often should you check your motorcycle's tyre pressure?",
   a:["Once a month","Once a week or before longer rides — always when tyres are cold","Only when tyres look flat","Every 10,000 km at service intervals"], correct:1,
   exp:"Check tyre pressure weekly and before longer trips, always when the tyres are cold. Warm tyres give falsely high readings."},
  {cat:"Fordonskännedom", q:"What is the legal minimum tyre tread depth for a motorcycle in Sweden?",
   a:["0.8 mm","1.0 mm","1.6 mm","2.0 mm"], correct:2,
   exp:"The legal minimum tread depth for motorcycle tyres in Sweden (and the EU) is 1.6 mm. Many experts recommend changing tyres well before this minimum."},
  {cat:"Fordonskännedom", q:"What does the ABS (Anti-lock Braking System) on a motorcycle do?",
   a:["Automatically applies brakes when it detects a hazard","Prevents the wheels from locking during hard braking, maintaining steering control","Makes the motorcycle brake faster than without ABS","Reduces engine braking when downshifting"], correct:1,
   exp:"ABS prevents wheel lock-up by rapidly modulating brake pressure during hard braking. This allows the rider to maintain steering control and can significantly reduce stopping distances on slippery surfaces."},
  {cat:"Fordonskännedom", q:"What should you check during a pre-ride safety inspection?",
   a:["Only the fuel level and tyre condition","Tyres, brakes, lights, mirrors, chain/belt, fluid levels, and controls","Only legally required items: lights and brakes","Just tyre pressure and oil level"], correct:1,
   exp:"A thorough pre-ride check (T-CLOCK or similar) covers: Tyres, Controls, Lights, Oil & fluids, Chain/belt, Kickstand, and frame. Catching issues before riding prevents breakdowns and accidents."},
  {cat:"Fordonskännedom", q:"A motorcycle chain should be lubricated:",
   a:["Every 1000 km or as specified by the manufacturer","Only when you hear it squeaking","Only at annual service","Every 5000 km"], correct:0,
   exp:"Chain lubrication intervals vary by manufacturer and riding conditions, but typically every 500-1000 km. Lubricate after riding (when warm) for best penetration. A dry or stiff chain is a safety risk."},
  {cat:"Fordonskännedom", q:"What does a flashing neutral light (green 'N') combined with difficulty selecting gears indicate?",
   a:["Normal behaviour in cold weather","Possible clutch or gearbox issue requiring inspection","The engine needs to warm up more","Low fuel level affecting transmission"], correct:1,
   exp:"Difficulty selecting gears combined with a persistently flashing neutral indicator may suggest a clutch adjustment issue, gearbox problem, or low transmission oil. Have it inspected."},
  {cat:"Fordonskännedom", q:"What is the effect of a worn rear tyre on motorcycle handling?",
   a:["Only affects braking, not cornering","Reduces grip in cornering and braking, increases risk of skidding","Makes the steering lighter and more responsive","No significant effect until tread is completely gone"], correct:1,
   exp:"Worn tyres dramatically reduce grip. A squared-off rear tyre (common from highway riding) makes the motorcycle unstable in corners and increases wet-weather braking distances significantly."},
  {cat:"Fordonskännedom", q:"When should motorcycle brake fluid be replaced?",
   a:["Only when the brake lever feels spongy","Every 2 years or as specified — brake fluid absorbs moisture over time","Never, it is a sealed system","Only at major service intervals of 20,000 km"], correct:1,
   exp:"Brake fluid is hygroscopic — it absorbs moisture from the air. Moisture lowers its boiling point, which can cause brake fade. Replace every 2 years or per manufacturer schedule."},
  {cat:"Fordonskännedom", q:"What does the category 'A2' motorcycle licence allow you to ride?",
   a:["Any motorcycle up to 125 cc","Any motorcycle with a maximum power of 35 kW (47 hp) and power-to-weight ratio ≤ 0.2 kW/kg","Any motorcycle up to 500 cc","Only three-wheeled motorcycles"], correct:1,
   exp:"An A2 licence (from age 18) allows motorcycles up to 35 kW (47 hp), with a power-to-weight ratio not exceeding 0.2 kW/kg. The bike must not have been uprated from more than 70 kW."},

  // ── ENVIRONMENT & ECO ──
  {cat:"Miljö", q:"What riding style reduces fuel consumption and emissions most effectively?",
   a:["Riding at maximum speed to spend less time on the road","Smooth acceleration, early upshifting, and engine braking","Hard acceleration followed by strong braking","Keeping engine revs in the red zone for better efficiency"], correct:1,
   exp:"Smooth throttle inputs, shifting up early (keeping revs moderate), and using engine braking rather than the brake lever all reduce fuel use and emissions significantly."},
  {cat:"Miljö", q:"Which of these reduces a motorcycle's environmental impact?",
   a:["Riding with over-inflated tyres","Regular maintenance including clean air filter, correct tyre pressure, and valve adjustment","Avoiding highway speeds entirely","Running the engine for 10 minutes to warm up before riding"], correct:1,
   exp:"A well-maintained engine burns fuel more cleanly and efficiently. Correct tyre pressure reduces rolling resistance. A dirty air filter or misaligned valves cause poor combustion."},
  {cat:"Miljö", q:"What should you do with used engine oil from your motorcycle?",
   a:["Pour it down a drain since it is biodegradable","Burn it off with a torch","Take it to an approved recycling centre or waste collection point","Mix it with new oil to dilute it"], correct:2,
   exp:"Used engine oil is toxic and must be disposed of at an approved collection or recycling point. Pouring it down drains or into the ground is illegal and environmentally harmful."},

  // ── PERSONAL CONDITIONS ──
  {cat:"Personliga förhållanden", q:"You have taken an antihistamine for allergies. How might it affect your riding?",
   a:["No effect — antihistamines are non-drowsy","It may cause drowsiness, slowing reaction time","It will improve concentration by reducing allergy symptoms","Only affects car drivers, not motorcyclists"], correct:1,
   exp:"Many antihistamines (especially older 'first generation' types) cause drowsiness, which impairs reaction time and concentration. Always read medication warnings and avoid riding if drowsy."},
  {cat:"Personliga förhållanden", q:"You slept only 4 hours last night. You have a 200 km motorway ride ahead. What should you do?",
   a:["Drink strong coffee and start riding — caffeine compensates for sleep loss","Only ride if the weather is good","Postpone or take an alternative — fatigue severely impairs riding ability as much as alcohol","Ride slowly below 80 km/h to compensate"], correct:2,
   exp:"Sleep deprivation causes impairment equivalent to being over the drink-drive limit. On a motorcycle, the consequences of impaired reactions are severe. Do not ride when fatigued."},
  {cat:"Personliga förhållanden", q:"What is the blood alcohol limit for motorcycle riders in Sweden?",
   a:["0.5 promille (‰)","0.2 promille (‰)","0.0 promille (‰) — zero tolerance","1.0 promille (‰)"], correct:1,
   exp:"The legal blood alcohol limit in Sweden is 0.2 ‰ (per mille). This is stricter than many countries. Any impairment is unacceptable, and even below 0.2 ‰ your riding ability is degraded."},
  {cat:"Personliga förhållanden", q:"How does riding in heavy rain affect your visibility and stopping distance?",
   a:["Only stopping distance is affected, visibility is unchanged","Both visibility and stopping distance are significantly worsened","Only visibility is affected","Neither is significantly affected on modern motorcycles with ABS"], correct:2,
   exp:"Rain reduces visibility (spray, fogging visor, raindrops on visor) and substantially increases stopping distances due to reduced tyre-to-road friction. Adjust speed and following distance accordingly."},
  {cat:"Personliga förhållanden", q:"You are feeling angry and stressed after an argument before your ride. How does this affect safety?",
   a:["Adrenaline improves reaction times","Emotions have minimal effect on experienced riders","Emotional stress impairs judgment, risk assessment, and leads to aggressive or distracted riding","It only affects beginners"], correct:2,
   exp:"Emotional states significantly affect riding. Stress, anger, or distraction narrow attention, increase risk-taking, and slow hazard recognition. If emotionally agitated, wait before riding."},

  // ── RISK AWARENESS ──
  {cat:"Riskbedömning", q:"You approach a blind bend. Where should you position yourself in the lane?",
   a:["On the left side for maximum vision around the bend","In the centre of the lane","Away from the centre line to maximise vision while keeping space to react to hazards","As far right as possible"], correct:2,
   exp:"On a right-hand bend: move to the left side to see further around the bend. On a left-hand bend: move right. Stay within your lane and position to maximise sight distance while giving yourself escape room."},
  {cat:"Riskbedömning", q:"Which road surface is most slippery for a motorcycle?",
   a:["Dry tarmac","Wet cobblestones or painted road markings","Freshly laid tarmac","Gravel roads in summer"], correct:1,
   exp:"Painted road markings, manhole covers, tram lines, and wet cobblestones have extremely low grip when wet. Approach these surfaces upright, at reduced speed, with gentle brake and throttle inputs."},
  {cat:"Riskbedömning", q:"A car door opens suddenly into your path. What is the best defensive response?",
   a:["Brake hard and hope to stop in time","Sound your horn continuously","Ride at sufficient distance from parked cars to allow reaction time — the 'door zone' should be avoided","Always ride on the left side of the lane near parked cars"], correct:2,
   exp:"'Dooring' is a major hazard for motorcyclists. Ride 1-1.5 metres from parked cars when possible, check for occupants in parked vehicles, and reduce speed in areas with many parked cars."},
  {cat:"Riskbedömning", q:"What makes an intersection particularly dangerous for motorcyclists?",
   a:["Traffic lights that are difficult to see","Drivers in other vehicles often fail to see motorcycles, especially when turning","Speed bumps at intersections","Road surface always worse at intersections"], correct:1,
   exp:"Most motorcycle accidents occur at intersections, often caused by a car driver turning left across the motorcycle's path ('SMIDSY — Sorry Mate I Didn't See You'). Approach intersections at reduced speed, cover the brakes, and watch for turning vehicles."},
  {cat:"Riskbedömning", q:"You are riding in a vehicle's blind spot. What should you do?",
   a:["Sound your horn so the driver is aware","Flash your headlights","Move out of the blind spot as quickly as safely possible","Stay there — modern cars have blind spot monitoring"], correct:2,
   exp:"Never linger in another vehicle's blind spot. Pass quickly and cleanly, or drop back. Assume the driver cannot see you. Motorcycle headlights help, but do not guarantee visibility."},
  {cat:"Riskbedömning", q:"What is 'SMIDSY' and why is it important for motorcyclists to understand?",
   a:["A Swedish road sign category","'Sorry Mate I Didn't See You' — describes accidents where drivers fail to perceive motorcycles","A braking technique","A type of road junction design"], correct:1,
   exp:"SMIDSY describes one of the most common motorcycle accident scenarios: a driver looks but fails to 'see' or register the motorcycle. Motorcyclists should always ride assuming they are invisible, especially at junctions."},

  // ── SWEDISH LAW & ADMINISTRATION ──
  {cat:"Svensk trafiklag", q:"At what minimum age can you obtain a full Category A motorcycle licence in Sweden?",
   a:["18 years","20 years","20 years with 2 years A2 experience, or 24 years directly","25 years"], correct:2,
   exp:"Category A (unrestricted) licence in Sweden: you can get it at age 20 after holding A2 for at least 2 years (A2 earliest at 18, so minimum 20 years old), or directly at age 24 with no prior MC licence requirement."},
  {cat:"Svensk trafiklag", q:"What is the penalty for riding a motorcycle without a valid licence in Sweden?",
   a:["A warning for first offence","A fine","Criminal conviction, substantial fine, and potential imprisonment","Only insurance consequences, not criminal"], correct:2,
   exp:"Riding without a valid licence (olovlig körning) in Sweden is a criminal offence. Penalties include fines calculated on income (dagsböter) and can include imprisonment for aggravated cases."},
  {cat:"Svensk trafiklag", q:"What does the Swedish road traffic law (Trafikförordningen) require regarding the use of mobile phones while riding?",
   a:["Hands-free is permitted while riding","Handheld mobile phone use is prohibited while riding. Hands-free devices (e.g. Bluetooth in helmet) are permitted","Only texting is prohibited — calls are allowed hands-free","Bluetooth headsets are specifically exempted"], correct:1,
   exp:"Swedish law prohibits any use of a handheld mobile device while driving. Using a handheld mobile device while riding is illegal. A hands-free device (Bluetooth headset, helmet speaker) is technically permitted but must not distract from riding. The phone must be mounted in a holder if used for GPS.ted but strongly discouraged as it remains a distraction. Any phone use that impairs driving is illegal."},
  {cat:"Svensk trafiklag", q:"A motorcycle must pass a roadworthiness inspection (besiktning) in Sweden. What is the typical interval for a motorcycle less than 10 years old?",
   a:["Every year","Every 2 years","Every 3 years","Only when ownership changes"], correct:1,
   exp:"In Sweden, motorcycles are subject to mandatory periodic roadworthiness testing. The typical interval is every 2 years. The exact schedule depends on the vehicle's age and category."},
  {cat:"Svensk trafiklag", q:"In Sweden, what is required regarding motorcycle insurance?",
   a:["Third-party liability insurance (trafikförsäkring) is mandatory","Full comprehensive insurance is required by law","No insurance is legally required","Insurance is only required for motorcycles over 250 cc"], correct:0,
   exp:"Third-party liability insurance (trafikförsäkring) is mandatory for all motor vehicles including motorcycles in Sweden. Without it, you cannot legally ride on public roads."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

   a:["Speed limit 60 km/h","Minimum speed 60 km/h","Recommended speed 60 km/h","Advisory speed limit 60 km/h on this curve"], correct:1,
   exp:"A blue circle with a number is a minimum speed sign. You must travel at least 60 km/h unless conditions make it unsafe to do so (e.g. heavy traffic, poor weather)."},

  <rect x="88" y="0" width="24" height="50" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
