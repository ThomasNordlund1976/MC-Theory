<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Swedish Motorcycle Theory Practice RC</title>
<style>
:root{--bg:#0b0d10;--panel:#141820;--panel2:#1d232d;--text:#f4f7fb;--muted:#9aa4b2;--accent:#ff5a1f;--good:#22c55e;--bad:#ef4444;--border:#2d3542;}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 20% 0%,#21110a,transparent 35%),var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
.app{display:grid;grid-template-columns:270px 1fr 310px;gap:16px;max-width:1500px;margin:0 auto;padding:16px;min-height:100vh}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sidebar{padding:20px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.03em;font-size:20px}.brand span{color:var(--accent)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;text-align:left}.navbtn.active,.navbtn:hover{background:rgba(255,90,31,.12);border-color:rgba(255,90,31,.25);color:var(--text)}
.stat{margin-top:auto;display:grid;gap:8px}.stat div{display:flex;justify-content:space-between;color:var(--muted);padding:10px 12px;border:1px solid var(--border);border-radius:12px}
.main{overflow:hidden}.top{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;justify-content:space-between}.cat{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px}.counter{color:var(--muted)}
.progress{height:6px;background:#222936;border-radius:999px;overflow:hidden;margin:0 24px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff9b63);transition:.25s}
.content{padding:30px 24px 24px}h1{font-size:28px;line-height:1.25;margin:0 0 20px}.media{display:flex;justify-content:center;margin:10px 0 22px;min-height:0}.media svg{max-width:260px;width:min(55vw,260px);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.35))}.media:empty{display:none}
.answers{display:grid;gap:10px}.answer{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:14px;padding:16px;text-align:left;color:var(--text);cursor:pointer;font-size:16px;line-height:1.35}.answer:hover{border-color:#485365}.answer:disabled{cursor:default}.letter{background:#29313d;color:#c7d0dc;border-radius:9px;width:30px;height:30px;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.answer.correct{border-color:rgba(34,197,94,.7);background:rgba(34,197,94,.13)}.answer.wrong{border-color:rgba(239,68,68,.8);background:rgba(239,68,68,.13)}.answer.dim{opacity:.45}
.explain{display:none;margin-top:18px;border:1px solid var(--border);border-radius:14px;padding:18px;background:rgba(255,255,255,.04);color:#d2d9e3;line-height:1.55}.explain.show{display:block}.explain b{color:#fff}.source{margin-top:10px;color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button.primary{background:linear-gradient(135deg,var(--accent),#ff7a3d);color:white;border:0;border-radius:13px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer}button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:13px;padding:14px 18px;font-weight:700;cursor:pointer}button.primary:disabled{opacity:.5;cursor:not-allowed}
.right{padding:20px}.scorecircle{width:150px;height:150px;border:14px solid #2a303a;border-radius:50%;display:grid;place-items:center;margin:22px auto;font-size:34px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qnav{height:42px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}.qnav.current{background:var(--accent);border-color:var(--accent)}.qnav.ok{border-color:var(--good);color:var(--good)}.qnav.bad{border-color:var(--bad);color:var(--bad)}
.drawer{margin-top:20px;border-top:1px solid var(--border);padding-top:15px;color:var(--muted);font-size:13px;line-height:1.5}.drawer a{color:#ffb18f} select{width:100%;padding:12px;border-radius:12px;background:#121820;color:var(--text);border:1px solid var(--border)}
.reviewitem{border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;background:rgba(255,255,255,.03)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#253040;color:#b8c2d0;font-size:12px;margin-bottom:8px}
@media(max-width:1050px){.actions button{flex:1 1 150px}.app{grid-template-columns:1fr;padding:8px}.sidebar,.right{display:none}.content{padding:20px 14px}h1{font-size:22px}.top{padding:16px}.progress{margin:0 16px}.answer{font-size:15px;padding:14px}.media svg{width:min(65vw,230px)}}
</style>
</head><body>
<div class="app">
<aside class="panel sidebar"><div class="brand">🏍️ <div>SWEDISH MC<br><span>THEORY</span></div></div><button class="navbtn active" data-mode="quiz">▶ Practice</button><button class="navbtn" data-mode="all">☰ All questions</button><button class="navbtn" data-mode="sources">ⓘ Sources</button><button class="navbtn" id="shuffleBtn" type="button">🔀 New shuffled practice</button><button class="navbtn" id="resetBtn" type="button">↺ Reset all answers</button><label style="color:var(--muted)">Category filter<select id="filter"><option value="all">All categories</option></select></label><div class="stat"><div><span>Correct</span><b id="sOk">0</b></div><div><span>Incorrect</span><b id="sBad">0</b></div><div><span>Questions</span><b id="sTotal">0</b></div></div></aside>
<main class="panel main"><div class="top"><div><button class="secondary" id="backBtn">←</button> <span class="cat" id="cat"></span></div><div class="counter" id="counter"></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="content" id="content"></div></main>
<aside class="panel right"><h3>Your progress</h3><div class="scorecircle" id="pct">0%</div><p style="text-align:center;color:var(--muted)" id="scoreText">0 / 0 correct</p><h3>Question navigation</h3><div class="grid" id="nav"></div><div class="drawer"><b>Preview build</b><br>Release candidate. Use “Reset all answers” to start over, or “New shuffled practice” for a fresh run.</div></aside>
</div>
<script>
const QUESTIONS = [{"cat": "Road signs", "q": "What does an upside-down triangle with a red border and yellow centre mean?", "a": ["Stop completely", "Give way to traffic on the intersecting road", "Priority road begins", "Warning for road narrowing"], "correct": 1, "exp": "The Swedish give-way sign is an inverted triangle. It means you must give way to traffic on the crossing road or route.", "source": "Transportstyrelsen: B1 Väjningsplikt", "img": "<svg viewBox=\"0 0 140 125\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"70,112 130,12 10,12\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What does the red octagonal STOP sign require?", "a": ["Slow down and continue if clear", "Stop only if traffic is coming", "Stop completely and give way before continuing", "Stop only at night"], "correct": 2, "exp": "At a stop sign you must make a complete stop and give way before proceeding.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"48,8 92,8 132,48 132,92 92,132 48,132 8,92 8,48\" fill=\"#d40000\" stroke=\"white\" stroke-width=\"6\"/><text x=\"70\" y=\"82\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"34\" font-weight=\"800\" fill=\"white\">STOP</text></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What does the yellow diamond with a white border indicate?", "a": ["A priority road", "A warning for a dangerous junction", "A pedestrian zone", "A recommended speed road"], "correct": 0, "exp": "The yellow diamond indicates a priority road (huvudled). Side-road traffic normally has give-way duties.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"28\" y=\"28\" width=\"84\" height=\"84\" transform=\"rotate(45 70 70)\" fill=\"#ffd200\" stroke=\"white\" stroke-width=\"8\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What does the yellow diamond crossed by a black diagonal line mean?", "a": ["Priority road begins", "Priority road ends", "No overtaking ends", "End of motorway"], "correct": 1, "exp": "The crossed priority-road sign indicates the end of the priority road.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"28\" y=\"28\" width=\"84\" height=\"84\" transform=\"rotate(45 70 70)\" fill=\"#ffd200\" stroke=\"white\" stroke-width=\"8\"/><line x1=\"25\" y1=\"115\" x2=\"115\" y2=\"25\" stroke=\"#111\" stroke-width=\"8\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A round sign with red border and the number 70 means:", "a": ["Recommended speed 70 km/h", "Minimum speed 70 km/h", "Maximum speed limit 70 km/h", "End of 70 km/h limit"], "correct": 2, "exp": "A number in a red-bordered circular sign is a maximum speed limit.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"58\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"12\"/><text x=\"70\" y=\"88\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"48\" font-weight=\"800\" fill=\"#111\">70</text></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A blue circular sign with the number 60 means:", "a": ["Maximum speed 60 km/h", "Recommended speed 60 km/h", "Minimum speed 60 km/h unless conditions make it unsafe", "Motorway speed 60 km/h"], "correct": 2, "exp": "Blue circular number signs indicate minimum speed, subject to safety and conditions.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"60\" fill=\"#006aa7\"/><text x=\"70\" y=\"88\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"48\" font-weight=\"800\" fill=\"white\">60</text></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A red circular sign with a yellow horizontal bar means:", "a": ["No entry from this direction", "No parking", "Give way", "Road closed to pedestrians"], "correct": 0, "exp": "The no-entry sign prohibits vehicles from entering from that direction.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"58\" fill=\"#d40000\"/><rect x=\"28\" y=\"58\" width=\"84\" height=\"24\" rx=\"4\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A red-bordered sign with a motorcycle symbol crossed out means:", "a": ["Motorcycles have priority", "Motorcycles prohibited", "Motorcycle parking only", "End of motorcycle lane"], "correct": 1, "exp": "The sign prohibits motorcycles from using the road or area.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"58\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"12\"/><g stroke=\"#111\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"48\" cy=\"85\" r=\"14\"/><circle cx=\"94\" cy=\"85\" r=\"14\"/><path d=\"M48 72h24l10-22h13\"/><path d=\"M71 72l24 13\"/><path d=\"M62 72l-10 13\"/><circle cx=\"83\" cy=\"45\" r=\"8\"/></g><line x1=\"25\" y1=\"115\" x2=\"115\" y2=\"25\" stroke=\"#d40000\" stroke-width=\"10\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A blue circular sign with a white motorcycle symbol means:", "a": ["Motorcycles prohibited", "Route or lane reserved/required for motorcycles", "Warning for motorcycles", "Motorcycle repairs ahead"], "correct": 1, "exp": "Blue circular signs are mandatory signs; the symbol indicates the road/lane is for that traffic type.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"60\" fill=\"#006aa7\"/><g stroke=\"#fff\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"48\" cy=\"85\" r=\"14\"/><circle cx=\"94\" cy=\"85\" r=\"14\"/><path d=\"M48 72h24l10-22h13\"/><path d=\"M71 72l24 13\"/><path d=\"M62 72l-10 13\"/><circle cx=\"83\" cy=\"45\" r=\"8\"/></g></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A triangular warning sign with a yellow centre and exclamation mark means:", "a": ["General warning/danger ahead", "End of all restrictions", "No entry", "Emergency stop only"], "correct": 0, "exp": "Swedish warning signs are triangular with red border and yellow centre. An exclamation mark is a general warning.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"44\" x2=\"80\" y2=\"86\" stroke=\"#111\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "This warning sign shows two black lines converging. What does it mean?", "a": ["Road narrows", "Dual carriageway begins", "Two-way traffic", "Road bends sharply"], "correct": 0, "exp": "The sign warns that the carriageway narrows. Reduce speed and be prepared for less lateral space.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><path d=\"M58 42c0 24 0 39-8 58\" stroke=\"#111\" stroke-width=\"10\" fill=\"none\"/><path d=\"M102 42c0 24 0 39 8 58\" stroke=\"#111\" stroke-width=\"10\" fill=\"none\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A warning triangle with a skidding car symbol means:", "a": ["Slippery road", "ABS test area", "End of paved road", "Compulsory snow chains"], "correct": 0, "exp": "It warns that the road may be slippery. For motorcyclists, reduce speed and avoid sudden inputs.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><rect x=\"50\" y=\"58\" width=\"60\" height=\"26\" rx=\"4\" fill=\"#111\"/><rect x=\"58\" y=\"44\" width=\"38\" height=\"18\" rx=\"4\" fill=\"#111\"/><path d=\"M50 94c-18 10 12 10-6 20\" stroke=\"#111\" stroke-width=\"4\" fill=\"none\"/><path d=\"M100 94c18 10-12 10 6 20\" stroke=\"#111\" stroke-width=\"4\" fill=\"none\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A warning triangle with a pedestrian symbol means:", "a": ["Footpath only", "Pedestrians may be on or near the road", "Pedestrians have priority everywhere", "Pedestrian zone ends"], "correct": 1, "exp": "It warns of pedestrians on or near the road; it is not itself a zebra-crossing give-way sign.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><circle cx=\"80\" cy=\"47\" r=\"8\" fill=\"#111\"/><path d=\"M80 56v30M80 67l-18 15M80 67l18 15M80 86l-18 28M80 86l18 28\" stroke=\"#111\" stroke-width=\"7\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A wildlife warning sign in Sweden means you should:", "a": ["Accelerate through the area", "Sound the horn continuously", "Reduce speed and be prepared for animals, especially at dawn and dusk", "Stop at the sign"], "correct": 2, "exp": "Wildlife such as moose and deer can appear suddenly. On a motorcycle the consequence is especially severe.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><path d=\"M45 88c10-27 31-24 45-8 11 12 7 27-13 30-17 3-42 1-32-22z\" fill=\"#111\"/><path d=\"M69 58c7-17 19-21 26-5\" stroke=\"#111\" stroke-width=\"7\" fill=\"none\"/><path d=\"M63 68l-18-24M78 66l16-26\" stroke=\"#111\" stroke-width=\"5\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A railway level crossing warning sign tells you to:", "a": ["Ignore it if barriers are up", "Prepare for a railway/spårväg crossing and be ready to stop", "Stop only if another vehicle stops", "Increase speed to clear the area"], "correct": 1, "exp": "Level crossings require special caution. Stop when signals, barriers or approaching trains require it.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><path d=\"M52 102h56M60 40l-22 62M100 40l22 62M52 63h56M45 82h70\" stroke=\"#111\" stroke-width=\"6\"/><rect x=\"54\" y=\"28\" width=\"52\" height=\"26\" rx=\"4\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A white circular sign with grey/black diagonal stripe means:", "a": ["End of all local prohibitions", "End of priority road", "No parking zone begins", "Recommended route ends"], "correct": 0, "exp": "This sign marks the end of all local prohibitions shown previously.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"58\" fill=\"#ffd200\" stroke=\"#777\" stroke-width=\"6\"/><line x1=\"35\" y1=\"105\" x2=\"105\" y2=\"35\" stroke=\"#111\" stroke-width=\"8\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "A blue square sign with a white arrow to the right usually indicates:", "a": ["A warning curve", "One-way/required direction information", "No right turn", "Parking to the right"], "correct": 1, "exp": "Blue rectangular/square direction signs indicate direction or lane information, such as one-way traffic.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"10\" y=\"10\" width=\"120\" height=\"120\" rx=\"10\" fill=\"#006aa7\"/><path d=\"M35 70h55\" stroke=\"white\" stroke-width=\"14\" stroke-linecap=\"round\"/><path d=\"M82 45l30 25-30 25z\" fill=\"white\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "At an uncontrolled intersection in Sweden, a vehicle approaches from your right. What is the basic rule?", "a": ["You have priority if you are on a motorcycle", "The vehicle from the right normally has priority", "The fastest road user has priority", "Whoever enters first has priority"], "correct": 1, "exp": "The right-hand rule applies where no signs, signals or other rules say otherwise.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "You are on a priority road and a car approaches from the right on a side road. Who normally has priority?", "a": ["The car from the right", "You, because you are on a priority road", "The vehicle with higher speed", "Neither; both must stop"], "correct": 1, "exp": "On a priority road, side-road traffic must give way; the right-hand rule does not override the priority road.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"28\" y=\"28\" width=\"84\" height=\"84\" transform=\"rotate(45 70 70)\" fill=\"#ffd200\" stroke=\"white\" stroke-width=\"8\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When entering a roundabout in Sweden, you must normally:", "a": ["Give way to traffic already in the roundabout", "Always stop", "Enter before circulating traffic", "Use the left lane only"], "correct": 0, "exp": "Traffic entering a roundabout normally gives way to vehicles already circulating.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 180 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"140\" rx=\"10\" fill=\"#233123\"/><circle cx=\"90\" cy=\"70\" r=\"48\" fill=\"#454b55\"/><circle cx=\"90\" cy=\"70\" r=\"26\" fill=\"#233123\"/><path d=\"M88 28a42 42 0 0 1 40 38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M123 58l13 16-20-2z\" fill=\"#ffd200\"/><path d=\"M92 112a42 42 0 0 1-40-38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M57 82L44 66l20 2z\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "A pedestrian is on a zebra crossing ahead. What must you do?", "a": ["Continue because motorcycles are narrow", "Give way and stop if necessary", "Only stop if there is a sign with flashing lights", "Sound the horn and continue"], "correct": 1, "exp": "Drivers must give way to pedestrians on or about to enter an uncontrolled pedestrian crossing.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#2b2f3a\"/><rect x=\"0\" y=\"40\" width=\"180\" height=\"42\" fill=\"#4b5360\"/><g fill=\"white\"><rect x=\"55\" y=\"40\" width=\"9\" height=\"42\"/><rect x=\"72\" y=\"40\" width=\"9\" height=\"42\"/><rect x=\"89\" y=\"40\" width=\"9\" height=\"42\"/><rect x=\"106\" y=\"40\" width=\"9\" height=\"42\"/></g><circle cx=\"90\" cy=\"50\" r=\"7\" fill=\"white\"/><path d=\"M90 58v18M90 66l-12 8M90 66l12 8M90 76l-10 14M90 76l10 14\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the default speed limit in a Swedish built-up area unless signs say otherwise?", "a": ["30 km/h", "40 km/h", "50 km/h", "70 km/h"], "correct": 2, "exp": "The general default in built-up areas is 50 km/h unless a posted limit says otherwise.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"58\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"12\"/><text x=\"70\" y=\"88\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"48\" font-weight=\"800\" fill=\"#111\">70</text></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the safest way to think about speed limits on Swedish motorways?", "a": ["All motorways are 120 km/h", "All motorways are 110 km/h", "Follow the posted speed limit; 120 km/h exists only where signed", "Motorcycles may ride 10 km/h faster"], "correct": 2, "exp": "Swedish speed limits are posted. Some motorway sections allow 120 km/h, but only when signed.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When may you overtake on the right in Sweden?", "a": ["Whenever traffic is slow", "Only in specific situations such as vehicle ahead turning left, marked multi-lane roads, or queue situations", "Never under any condition", "Only motorcycles may do it"], "correct": 1, "exp": "Right-side overtaking is restricted to specific cases and is not a general permission to pass on the right.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When may you use the horn?", "a": ["To greet friends", "To express irritation", "Only to warn of danger", "Whenever another driver is slow"], "correct": 2, "exp": "The horn should be used to warn of danger, not as a greeting or expression of frustration.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "A flashing yellow traffic signal at an intersection means:", "a": ["You have priority", "Stop and wait for green", "Proceed with special caution", "The road is closed"], "correct": 2, "exp": "Flashing yellow is a warning signal. Proceed only with caution and be ready to give way or stop.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "At a railway level crossing, when must you stop?", "a": ["Only if barriers are fully down", "If barriers/lights/sound indicate, or if a train is visible or audible", "Only if there is a stop sign", "Only after dark"], "correct": 1, "exp": "You must stop when signals, barriers or an approaching train indicate danger. Never cross if uncertain.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><path d=\"M52 102h56M60 40l-22 62M100 40l22 62M52 63h56M45 82h70\" stroke=\"#111\" stroke-width=\"6\"/><rect x=\"54\" y=\"28\" width=\"52\" height=\"26\" rx=\"4\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What following-distance rule is suitable in good conditions?", "a": ["At least a 2–3 second gap", "One metre per 10 km/h", "Half a car length", "Exactly 50 metres"], "correct": 0, "exp": "A time gap adapts to speed. Increase it in rain, darkness, poor visibility or heavy traffic.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "Parking before a pedestrian crossing in Sweden is prohibited within approximately:", "a": ["1 metre", "5 metres", "10 metres", "25 metres"], "correct": 2, "exp": "Parking too close before a crossing hides pedestrians and is prohibited within 10 metres before the crossing.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": "<svg viewBox=\"0 0 180 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"180\" height=\"120\" rx=\"10\" fill=\"#2b2f3a\"/><rect x=\"0\" y=\"40\" width=\"180\" height=\"42\" fill=\"#4b5360\"/><g fill=\"white\"><rect x=\"55\" y=\"40\" width=\"9\" height=\"42\"/><rect x=\"72\" y=\"40\" width=\"9\" height=\"42\"/><rect x=\"89\" y=\"40\" width=\"9\" height=\"42\"/><rect x=\"106\" y=\"40\" width=\"9\" height=\"42\"/></g><circle cx=\"90\" cy=\"50\" r=\"7\" fill=\"white\"/><path d=\"M90 58v18M90 66l-12 8M90 66l12 8M90 76l-10 14M90 76l10 14\" stroke=\"white\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the rule for using a handheld mobile phone while riding?", "a": ["Allowed below 30 km/h", "Allowed if the call is short", "Not allowed to use mobile/communication equipment held in the hand while driving a motor vehicle", "Allowed for navigation only"], "correct": 2, "exp": "Swedish rules prohibit using a phone or other communication equipment while holding it in your hand when driving.", "source": "Transportstyrelsen: Mobilanvändning och kommunikationsutrustning", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"140\" height=\"140\" rx=\"16\" fill=\"#111827\"/><rect x=\"50\" y=\"20\" width=\"40\" height=\"86\" rx=\"8\" fill=\"none\" stroke=\"#e5e7eb\" stroke-width=\"6\"/><circle cx=\"70\" cy=\"95\" r=\"3\" fill=\"#e5e7eb\"/><line x1=\"32\" y1=\"112\" x2=\"112\" y2=\"32\" stroke=\"#ef4444\" stroke-width=\"10\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "Can a motorcycle use a bus lane by default?", "a": ["Yes, always", "Only if signs/road markings specifically permit motorcycles", "Only outside rush hour", "Never, even if signed"], "correct": 1, "exp": "Bus lanes are for permitted traffic only. Motorcycles need explicit permission by sign/local rule.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When passing a cyclist, what is the key requirement?", "a": ["Pass as close as possible to stay in lane", "Give a safe lateral distance adapted to speed and conditions", "Sound horn first and pass close", "Only pass in another lane"], "correct": 1, "exp": "The law requires care and sufficient space to vulnerable road users; the safe distance depends on the situation.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Which licence categories are used for motorcycles in Sweden?", "a": ["B1, B2, B3", "A1, A2 and A", "M, M2 and M3", "C1, C2 and C"], "correct": 1, "exp": "Motorcycle licences are A1, A2 and A.", "source": "Transportstyrelsen + Trafikverket: Motorcycle licence A1/A2/A", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What does an A2 licence allow for a two-wheeled motorcycle?", "a": ["Up to 125 cc only", "Maximum 35 kW and power-to-weight ratio not over 0.2 kW/kg, with restriction rules", "Any motorcycle below 500 cc", "Only automatic motorcycles"], "correct": 1, "exp": "A2 is limited by power and power-to-weight ratio, and the motorcycle may not be restricted from an original output above 70 kW.", "source": "Transportstyrelsen + Trafikverket: Motorcycle licence A1/A2/A", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What is the normal minimum age for direct access to category A without two years of A2?", "a": ["18", "20", "21", "24"], "correct": 3, "exp": "Unrestricted category A can be taken directly at 24, or at 20 after holding A2 for at least two years.", "source": "Transportstyrelsen + Trafikverket: Motorcycle licence A1/A2/A", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What must you normally pass for a first Swedish motorcycle licence?", "a": ["Only a driving test", "Only a theory test", "Risk training, theory test and driving test, plus required permit/training steps", "Only a medical exam"], "correct": 2, "exp": "For a first motorcycle licence you need the required permit/training and approved tests, including risk training.", "source": "Transportstyrelsen + Trafikverket: Motorcycle licence A1/A2/A", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "Does car risk training count as motorcycle risk training?", "a": ["Yes, always", "Only if taken recently", "No, motorcycle risk training is separate", "Only for A1"], "correct": 2, "exp": "Transportstyrelsen states that risk training for passenger car does not apply to motorcycle.", "source": "Transportstyrelsen: Riskutbildning motorcykel", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What protective equipment is required for motorcycle risk training/practical test?", "a": ["Helmet only", "Protective clothing, eye protection/equivalent, sturdy boots, gloves, back protector and undamaged helmet/equipment", "High-vis vest only", "Any ordinary jacket and shoes"], "correct": 1, "exp": "Risk training requires proper motorcycle protective equipment; this is stricter than the basic helmet law.", "source": "Transportstyrelsen: Riskutbildning motorcykel", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><path d=\"M42 70c0-30 20-50 50-50 27 0 45 17 45 42v15H96c-14 0-25-2-38-7z\" fill=\"#e5e7eb\"/><path d=\"M82 52h48\" stroke=\"#111827\" stroke-width=\"8\"/><text x=\"80\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">E-marked helmet</text></svg>", "difficulty": "standard"}, {"cat": "Licence & law", "q": "What is the Swedish blood alcohol limit for rattfylleri?", "a": ["0.0 promille", "0.2 promille", "0.5 promille", "1.0 promille"], "correct": 1, "exp": "Rattfylleri begins at at least 0.2 promille in blood. Severe/grovt rattfylleri begins at at least 1.0 promille.", "source": "Transportstyrelsen: Körkort och alkohol", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "At what blood alcohol level does grovt rattfylleri normally begin?", "a": ["0.2 promille", "0.5 promille", "0.8 promille", "1.0 promille"], "correct": 3, "exp": "Transportstyrelsen lists grovt rattfylleri from at least 1.0 promille in blood.", "source": "Transportstyrelsen: Körkort och alkohol", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What insurance is legally mandatory for a motorcycle used in traffic?", "a": ["Comprehensive/full insurance", "Third-party traffic insurance (trafikförsäkring)", "Theft insurance only", "No insurance for motorcycles under 125 cc"], "correct": 1, "exp": "Trafikförsäkring is the mandatory traffic insurance for motor vehicles used in traffic.", "source": "Transportstyrelsen: MC rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "When is a motorcycle first due for control inspection after first being taken into traffic?", "a": ["12 months", "24 months", "36 months", "48 months"], "correct": 3, "exp": "Transportstyrelsen says first inspection is no later than 48 months after the month the motorcycle was first taken into traffic.", "source": "Transportstyrelsen: Kontrollbesiktning av motorcykel", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "After the first inspection, how often is a motorcycle normally inspected?", "a": ["Every 12 months", "No later than 24 months after the previous full inspection", "Every 36 months", "Only at change of ownership"], "correct": 1, "exp": "After the first inspection, the next is no later than 24 months after the previous full inspection.", "source": "Transportstyrelsen: Kontrollbesiktning av motorcykel", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What is the minimum tread depth for motorcycle tyres according to Transportstyrelsen's MC rules?", "a": ["0.8 mm", "1.0 mm", "1.6 mm", "3.0 mm"], "correct": 1, "exp": "Transportstyrelsen's MC page states a minimum tread depth of 1 millimetre for motorcycle tyres.", "source": "Transportstyrelsen: MC rules", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><rect x=\"30\" y=\"20\" width=\"100\" height=\"56\" rx=\"8\" fill=\"#374151\"/><g fill=\"#111827\"><rect x=\"42\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"62\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"82\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"102\" y=\"20\" width=\"8\" height=\"56\"/></g><line x1=\"30\" y1=\"64\" x2=\"130\" y2=\"64\" stroke=\"#ef4444\" stroke-width=\"3\"/><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">MC min tread 1.0 mm</text></svg>", "difficulty": "standard"}, {"cat": "Licence & law", "q": "Are special winter tyres mandatory for motorcycles in winter road conditions?", "a": ["Yes, always from 1 December", "Yes, only for A2 motorcycles", "No, Transportstyrelsen states motorcycles do not need special winter tyres in winter road conditions", "Only if the motorcycle has ABS"], "correct": 2, "exp": "Transportstyrelsen's MC rules state that motorcycles do not need special winter tyres at winter road conditions.", "source": "Transportstyrelsen: MC rules", "img": null, "difficulty": "standard"}, {"cat": "Licence & law", "q": "What helmet rule applies to Swedish motorcycle riding?", "a": ["Helmet is optional for adults", "An E-marked/approved protective helmet is required", "Only passengers need helmet", "Helmet only required above 50 km/h"], "correct": 1, "exp": "MC helmets must be approved/E-marked according to helmet requirements.", "source": "Transportstyrelsen: MC rules", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><path d=\"M42 70c0-30 20-50 50-50 27 0 45 17 45 42v15H96c-14 0-25-2-38-7z\" fill=\"#e5e7eb\"/><path d=\"M82 52h48\" stroke=\"#111827\" stroke-width=\"8\"/><text x=\"80\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">E-marked helmet</text></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is the safest emergency braking technique on a modern motorcycle?", "a": ["Rear brake only", "Front brake only", "Use both brakes progressively, with most braking from the front as weight transfers", "Turn off the engine"], "correct": 2, "exp": "Using both brakes progressively gives maximum controlled braking. The front brake normally provides most stopping power as weight transfers forward.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"140\" height=\"140\" rx=\"16\" fill=\"#111827\"/><circle cx=\"70\" cy=\"65\" r=\"43\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"8\"/><text x=\"70\" y=\"78\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"34\" font-weight=\"800\" fill=\"#fbbf24\">ABS</text></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What does ABS help prevent?", "a": ["Engine stalling", "Wheel lock during braking", "Too much lean angle", "Low tyre pressure"], "correct": 1, "exp": "ABS modulates brake pressure to reduce wheel lock and preserve steering ability.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"140\" height=\"140\" rx=\"16\" fill=\"#111827\"/><circle cx=\"70\" cy=\"65\" r=\"43\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"8\"/><text x=\"70\" y=\"78\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"34\" font-weight=\"800\" fill=\"#fbbf24\">ABS</text></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Can ABS overcome the grip limit in a corner?", "a": ["Yes, it always prevents crashes", "No, ABS helps against wheel lock but cannot create more tyre grip", "Only on dry roads", "Only below 50 km/h"], "correct": 1, "exp": "ABS is a major safety aid, but traction is still shared between braking and cornering.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"140\" height=\"140\" rx=\"16\" fill=\"#111827\"/><circle cx=\"70\" cy=\"65\" r=\"43\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"8\"/><text x=\"70\" y=\"78\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"34\" font-weight=\"800\" fill=\"#fbbf24\">ABS</text></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is target fixation?", "a": ["Looking through a bend", "The tendency to ride toward what you stare at", "A method of adjusting mirrors", "A braking technique"], "correct": 1, "exp": "Motorcycles tend to go where the rider looks. Look toward the escape path, not at the hazard.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why are intersections especially dangerous for motorcyclists?", "a": ["Roads are always slippery there", "Other drivers may look but fail to notice the motorcycle", "Motorcycles have no priority at intersections", "Traffic lights do not detect motorcycles"], "correct": 1, "exp": "A common MC crash pattern is another driver failing to perceive the motorcycle, especially when turning or pulling out.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "When riding near parked cars, what should you avoid?", "a": ["The door zone", "Using low beam", "Scanning mirrors", "Keeping distance from the vehicle ahead"], "correct": 0, "exp": "Keep distance from parked cars so an opening door does not hit you.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should you do if your rear tyre begins to slide while cornering?", "a": ["Close the throttle abruptly", "Brake hard with the front brake", "Stay smooth and avoid sudden inputs; reduce throttle gradually if needed", "Stand up on the pegs and steer sharply"], "correct": 2, "exp": "Abrupt inputs can worsen a slide. Smooth control helps tyres regain grip progressively.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is countersteering at road speeds?", "a": ["Pushing the handlebar on the side you want to turn toward", "Turning the bars the same way as a bicycle at all speeds", "Leaning without handlebar input", "Using the rear brake to steer"], "correct": 0, "exp": "Above low speed, pushing the inside bar initiates lean and turns the motorcycle.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why is the first rain after a dry period dangerous?", "a": ["Tyres become too cold immediately", "Oil, rubber and dirt lift from the road before washing away", "ABS stops working", "Headlights become illegal"], "correct": 1, "exp": "The road surface can become very slippery when rain first mixes with road deposits.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What surfaces are especially slippery for motorcycles when wet?", "a": ["Fresh dry asphalt only", "Painted markings, tram rails, metal covers and cobblestones", "Dry gravel only", "Concrete bridges only"], "correct": 1, "exp": "Smooth or painted surfaces can offer very little grip when wet.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "How should you cross tram or railway tracks on a motorcycle?", "a": ["As parallel as possible", "At a safe angle, upright and without harsh braking/acceleration", "With hard acceleration", "With maximum lean"], "correct": 1, "exp": "Cross rails as upright as possible and at a safer angle to reduce the risk of the tyre following the rail.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why should you check mirrors before braking hard?", "a": ["To decide which gear to use", "A following vehicle may be too close and not react in time", "It is legally required before every brake use", "To check tyre pressure"], "correct": 1, "exp": "Mirror checks help you anticipate rear-end risk and brake more progressively if possible.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is the best general lane position?", "a": ["Always far right", "Always centre", "Flexible: choose a position that improves visibility, space and grip", "Always far left"], "correct": 2, "exp": "Motorcyclists should use lane position actively to manage visibility, space and hazards.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why is a lorry dangerous to overtake?", "a": ["Lorries are never allowed to turn", "Blind spots, slipstream and hidden vehicles/side roads", "They are always faster than motorcycles", "They make signs unreadable"], "correct": 1, "exp": "Large vehicles hide hazards and have major blind spots. Overtake only with clear view and margin.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "In strong crosswind, what should a motorcyclist do?", "a": ["Relax grip, reduce speed if needed and be prepared for gusts, especially near gaps and lorries", "Accelerate hard", "Ride beside lorries for shelter", "Turn off headlights"], "correct": 0, "exp": "Crosswinds can push a motorcycle suddenly. Stay relaxed and create safety margins.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "When riding in fog, what is the key rule?", "a": ["Use high beam and ride normally", "Ride so you can stop within the distance you can see, using low beam", "Follow another vehicle closely", "Use hazard lights instead of headlight"], "correct": 1, "exp": "High beam can reflect back in fog. Reduce speed so stopping distance fits visible distance.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is the vanishing point technique?", "a": ["Watching where the road edges appear to meet to judge corner severity", "Watching your mirror in corners", "Looking at the front wheel", "Closing one eye at night"], "correct": 0, "exp": "If the vanishing point comes toward you, the bend is tightening; adjust speed.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "When carrying a passenger, how does the motorcycle change?", "a": ["It becomes lighter to steer", "Longer braking distance and altered handling/suspension balance", "It can use bus lanes", "ABS is disabled"], "correct": 1, "exp": "Extra weight affects braking, acceleration and handling; adjust riding and tyre/suspension settings as required.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should luggage on a motorcycle be?", "a": ["High and loose for visibility", "Secure, balanced and not interfering with controls, lights or suspension", "Only carried on handlebars", "Hung from mirrors"], "correct": 1, "exp": "Loose or unbalanced luggage can destabilize the motorcycle or interfere with control.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What does ATGATT mean?", "a": ["All The Gear, All The Time", "Automatic Throttle Grip And Traction Test", "Approved Tyres Guarantee All Traffic Tests", "Always Take Gears And Tools"], "correct": 0, "exp": "It is a safety principle: wear full protective gear every ride, not just when legally/test-required.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "A car waits at a side road on your right. You have priority. What is safest?", "a": ["Maintain speed because you have priority", "Cover brakes, reduce risk and be prepared that the driver has not seen you", "Ride in the gutter", "Flash headlights and accelerate"], "correct": 1, "exp": "Priority does not protect you physically. Assume you may not be seen and prepare an escape/braking plan.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "You approach a blind crest on a rural road. What should you expect?", "a": ["The road is always clear", "Oncoming traffic, stopped vehicles, animals or debris may be hidden", "Only cyclists are allowed there", "You may overtake if fast enough"], "correct": 1, "exp": "Never overtake or ride at a speed that prevents stopping for hidden hazards over a crest.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "A patch of gravel lies in a bend. What is safest?", "a": ["Brake hard while leaning", "Stand the bike up as much as possible, reduce inputs and cross smoothly", "Accelerate to lighten the front wheel", "Look directly at the gravel"], "correct": 1, "exp": "Reduce lean and avoid sudden braking/throttle on loose material.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What is the main danger of riding tired?", "a": ["Only reduced comfort", "Reaction time, judgment and attention are impaired similarly to alcohol impairment", "It only affects car drivers", "It improves cautiousness"], "correct": 1, "exp": "Fatigue seriously impairs riding ability and hazard recognition.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "You feel angry after an argument before riding. What should you do?", "a": ["Ride aggressively to release stress", "Wait until calm or choose another transport option", "Ride faster but more focused", "Only avoid motorways"], "correct": 1, "exp": "Emotional stress increases risk-taking and reduces attention.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "Which is safest when an animal suddenly appears?", "a": ["Focus on braking in a straight line if possible, avoid panic swerving", "Swerve sharply at high lean", "Accelerate past it", "Close eyes and brace"], "correct": 0, "exp": "For motorcycles, panic swerves can cause loss of control. Brake firmly while upright where possible.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "Why should you avoid riding beside another vehicle for long?", "a": ["It uses more fuel", "You may be in its blind spot and have no escape space", "It is illegal in all cases", "It damages tyres"], "correct": 1, "exp": "Avoid lingering in blind spots. Either pass or drop back.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "How often should tyre pressure be checked?", "a": ["Only at service", "Regularly, ideally weekly and before longer rides, when tyres are cold", "Only if the tyre looks flat", "After the ride when tyres are hot"], "correct": 1, "exp": "Correct cold tyre pressure is essential for grip, braking and tyre wear.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><rect x=\"30\" y=\"20\" width=\"100\" height=\"56\" rx=\"8\" fill=\"#374151\"/><g fill=\"#111827\"><rect x=\"42\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"62\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"82\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"102\" y=\"20\" width=\"8\" height=\"56\"/></g><line x1=\"30\" y1=\"64\" x2=\"130\" y2=\"64\" stroke=\"#ef4444\" stroke-width=\"3\"/><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">MC min tread 1.0 mm</text></svg>", "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What pressure should you use?", "a": ["Always 2.5 bar", "The motorcycle manufacturer's specification adjusted for load", "Whatever feels comfortable", "Car tyre pressure"], "correct": 1, "exp": "Use manufacturer specifications for model, tyre and loading.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><rect x=\"30\" y=\"20\" width=\"100\" height=\"56\" rx=\"8\" fill=\"#374151\"/><g fill=\"#111827\"><rect x=\"42\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"62\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"82\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"102\" y=\"20\" width=\"8\" height=\"56\"/></g><line x1=\"30\" y1=\"64\" x2=\"130\" y2=\"64\" stroke=\"#ef4444\" stroke-width=\"3\"/><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">MC min tread 1.0 mm</text></svg>", "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What does a spongy brake lever suggest?", "a": ["Normal brake pad bedding", "Air/moisture or a brake-system fault that needs checking", "Too much fuel", "Low tyre tread"], "correct": 1, "exp": "A spongy lever can indicate air or fluid problems and should be inspected before riding.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "Why is brake fluid replaced periodically?", "a": ["It evaporates quickly", "It absorbs moisture, lowering boiling point and reducing braking performance", "It lubricates the chain", "It changes tyre pressure"], "correct": 1, "exp": "Brake fluid is hygroscopic and maintenance schedules must be followed.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "A chain with tight spots usually means:", "a": ["It is unevenly worn/stiff and may need replacement", "It is perfectly adjusted", "The rear tyre is over-inflated", "ABS is faulty"], "correct": 0, "exp": "Tight spots indicate uneven wear or stiff links and can create unsafe tension changes.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What must lights and indicators do before riding?", "a": ["Only work at night", "Work correctly; check them as part of a pre-ride inspection", "Only rear light is required", "Only brake light matters"], "correct": 1, "exp": "Lights and indicators are part of basic roadworthiness and visibility.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What should you check before a ride?", "a": ["Tyres, brakes, lights, controls, chain/belt and fluid levels", "Only fuel", "Only mirrors", "Only engine sound"], "correct": 0, "exp": "A simple pre-ride check can catch safety-critical faults.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "Which riding style reduces fuel use and emissions?", "a": ["Smooth acceleration, early upshifting and anticipation", "Hard acceleration and hard braking", "Long idling warm-up", "Riding in low gear at high rpm"], "correct": 0, "exp": "Eco-riding uses anticipation, smooth throttle and suitable gears.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "What should you do with used engine oil?", "a": ["Pour it down a drain", "Take it to an approved collection/recycling point", "Burn it", "Mix it with household waste"], "correct": 1, "exp": "Used oil is hazardous waste and must be handled through approved collection.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "What tyre condition helps reduce fuel consumption?", "a": ["Under-inflated tyres", "Correct tyre pressure", "Very worn tyres", "Mismatched tyres"], "correct": 1, "exp": "Correct pressure reduces rolling resistance and preserves handling.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><rect x=\"30\" y=\"20\" width=\"100\" height=\"56\" rx=\"8\" fill=\"#374151\"/><g fill=\"#111827\"><rect x=\"42\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"62\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"82\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"102\" y=\"20\" width=\"8\" height=\"56\"/></g><line x1=\"30\" y1=\"64\" x2=\"130\" y2=\"64\" stroke=\"#ef4444\" stroke-width=\"3\"/><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">MC min tread 1.0 mm</text></svg>", "difficulty": "standard"}, {"cat": "Personal conditions", "q": "Medication says 'may cause drowsiness'. What should you do?", "a": ["Ride if the trip is short", "Do not ride until you know it is safe; consult doctor/pharmacist if unsure", "Drink coffee and ride", "Only avoid passengers"], "correct": 1, "exp": "Drowsiness warnings matter for riding; motorcycles require balance, reaction and judgment.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "Why is alcohol especially dangerous for motorcycle riders?", "a": ["It only affects vision", "It impairs balance, coordination, reaction time and risk judgment", "It improves confidence safely", "It has less effect on experienced riders"], "correct": 1, "exp": "Riding needs balance and coordination as well as judgment; alcohol impairs all of these.", "source": "Transportstyrelsen: Körkort och alkohol", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "You slept four hours and plan a long ride. What is safest?", "a": ["Ride slower and continue", "Postpone, rest or choose another transport option", "Use high beam in daylight", "Drink one coffee and ignore fatigue"], "correct": 1, "exp": "Fatigue is a serious impairment; do not rely on speed reduction or caffeine alone.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You approach an intersection with no signs or signals. A cyclist comes from your right. What applies?", "a": ["Right-hand rule: you normally give way", "Motorcycles always have priority over cycles", "The cyclist must always stop", "Whoever is fastest has priority"], "correct": 0, "exp": "The right-hand rule applies to vehicles in uncontrolled intersections unless other rules/signs apply.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You are entering a road marked by shark-teeth/give-way markings. What must you do?", "a": ["Stop for at least three seconds", "Give way to traffic on the road you are entering; stop only if needed", "Ignore if you are turning right", "Accelerate to merge first"], "correct": 1, "exp": "Give-way markings/signs require you to yield; a complete stop is not required if it is clearly safe.", "source": "Transportstyrelsen: B1 Väjningsplikt", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You ride behind a van that blocks your view. What is safest?", "a": ["Follow closely to overtake sooner", "Increase distance so you can see and react", "Ride in the van's blind spot", "Use high beam"], "correct": 1, "exp": "A larger following distance improves view, reaction time and escape options.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "A driver signals left but slows near a side road. What should you expect?", "a": ["They will always turn exactly as signalled", "They may change plan or turn across your path; prepare to slow/stop", "Pass on either side immediately", "Ignore because signals are legally binding"], "correct": 1, "exp": "Signals are useful but not guarantees. Read vehicle behaviour and preserve margins.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You are on a wet road with painted arrows ahead. What is safest?", "a": ["Brake hard on the paint", "Avoid hard braking/leaning on painted markings", "Accelerate on the markings", "Use rear brake only at maximum force"], "correct": 1, "exp": "Wet paint can be very slippery for motorcycle tyres.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You need to turn left across oncoming traffic. What is most important?", "a": ["Assume oncoming vehicles will stop", "Wait until the path is clear and do not obstruct oncoming traffic", "Start turning early to signal intent", "Only check mirrors"], "correct": 1, "exp": "Turning across traffic requires you to ensure it is clear and safe.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "A bus stops at a bus stop and pedestrians may cross in front. What should you do?", "a": ["Maintain speed", "Slow and prepare for hidden pedestrians", "Overtake as close as possible", "Sound horn continuously"], "correct": 1, "exp": "Stopped buses hide pedestrians. A motorcyclist should expect someone to appear suddenly.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "At night, when should you dip from high beam?", "a": ["When you may dazzle oncoming traffic or vehicles ahead", "Only in towns", "Never on a motorcycle", "Only if there are streetlights"], "correct": 0, "exp": "Do not dazzle other road users. Use low beam when high beam would blind oncoming/followed vehicles.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You pass roadworks with loose gravel and temporary markings. What should you do?", "a": ["Hold speed to stabilize", "Reduce speed and avoid sudden braking/steering", "Ride on the shoulder", "Ignore temporary signs"], "correct": 1, "exp": "Roadworks can create loose surfaces, changed lanes and temporary rules. Motorcycles are vulnerable to surface changes.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You approach a curve and cannot see the exit. What should you do?", "a": ["Enter faster to improve stability", "Choose a speed that lets you stop within visible distance", "Use the centre line as a guide and cut across", "Brake hard at maximum lean"], "correct": 1, "exp": "Never ride faster than you can safely stop within the distance you can see to be clear.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "A car is tailgating you. What is safest?", "a": ["Brake-check the car", "Increase your forward safety margin and allow them to pass when safe", "Accelerate far above the limit", "Ride in the gutter"], "correct": 1, "exp": "You cannot control the tailgater, but you can create more space ahead and avoid abrupt braking.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You plan to overtake on a two-lane rural road. What must you have?", "a": ["Enough power only", "Clear view and enough distance to complete safely without forcing others to brake or swerve", "A flashing headlight", "A motorcycle over 35 kW"], "correct": 1, "exp": "Safe overtaking requires clear sight, legal conditions and enough margin.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "Why should you be careful at petrol stations and roundabouts?", "a": ["They are legally no-brake zones", "Fuel/diesel spills can make the surface slippery", "ABS is turned off there", "They always have gravel"], "correct": 1, "exp": "Diesel/fuel spills are particularly dangerous for motorcycles.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic situations", "q": "What is the safest approach to a narrowing road?", "a": ["Move to the centre blindly", "Adapt speed and position early; be ready for oncoming traffic and reduced space", "Accelerate to pass first", "Ride on the edge line"], "correct": 1, "exp": "Road narrowing reduces space and may create priority conflicts. Slow and position for visibility and safety.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><path d=\"M58 42c0 24 0 39-8 58\" stroke=\"#111\" stroke-width=\"10\" fill=\"none\"/><path d=\"M102 42c0 24 0 39 8 58\" stroke=\"#111\" stroke-width=\"10\" fill=\"none\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic situations", "q": "You see a child near the road. What should you expect?", "a": ["Predictable adult behaviour", "Sudden movement into the road; reduce speed and prepare to stop", "They always hear motorcycles", "Only react if they step onto a crossing"], "correct": 1, "exp": "Children are unpredictable and require extra caution.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Road signs", "q": "Which colour is used inside Swedish warning triangles?", "a": ["White", "Yellow", "Blue", "Green"], "correct": 1, "exp": "Swedish warning signs use a yellow centre with red border and black symbol.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 160 140\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><polygon points=\"80,8 152,132 8,132\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"44\" x2=\"80\" y2=\"86\" stroke=\"#111\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#111\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "Which colour is used inside the Swedish give-way sign?", "a": ["White", "Yellow", "Blue", "Black"], "correct": 1, "exp": "The Swedish yield/give-way sign is yellow inside with a red border.", "source": "Transportstyrelsen: B1 Väjningsplikt", "img": "<svg viewBox=\"0 0 140 125\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"70,112 130,12 10,12\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"10\" stroke-linejoin=\"round\"/></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What sign group do stop and give-way signs belong to?", "a": ["Warning signs", "Priority/give-way obligation signs", "Direction signs", "Service signs"], "correct": 1, "exp": "Stop and give-way signs regulate priority/give-way duties.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"48,8 92,8 132,48 132,92 92,132 48,132 8,92 8,48\" fill=\"#d40000\" stroke=\"white\" stroke-width=\"6\"/><text x=\"70\" y=\"82\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"34\" font-weight=\"800\" fill=\"white\">STOP</text></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What does a blue circular sign generally indicate?", "a": ["A prohibition", "A warning", "A mandatory instruction", "A tourist destination"], "correct": 2, "exp": "Blue circular signs are mandatory signs.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"60\" fill=\"#006aa7\"/><g stroke=\"#fff\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"48\" cy=\"85\" r=\"14\"/><circle cx=\"94\" cy=\"85\" r=\"14\"/><path d=\"M48 72h24l10-22h13\"/><path d=\"M71 72l24 13\"/><path d=\"M62 72l-10 13\"/><circle cx=\"83\" cy=\"45\" r=\"8\"/></g></svg>", "difficulty": "standard"}, {"cat": "Road signs", "q": "What does a red-bordered circular sign generally indicate?", "a": ["A prohibition or restriction", "A mandatory instruction", "A service area", "A motorway"], "correct": 0, "exp": "Red-bordered circular signs generally prohibit or restrict something.", "source": "Transportstyrelsen: Vägmärken / Swedish road signs", "img": "<svg viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"70\" cy=\"70\" r=\"58\" fill=\"#ffd200\" stroke=\"#d40000\" stroke-width=\"12\"/><g stroke=\"#111\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"48\" cy=\"85\" r=\"14\"/><circle cx=\"94\" cy=\"85\" r=\"14\"/><path d=\"M48 72h24l10-22h13\"/><path d=\"M71 72l24 13\"/><path d=\"M62 72l-10 13\"/><circle cx=\"83\" cy=\"45\" r=\"8\"/></g><line x1=\"25\" y1=\"115\" x2=\"115\" y2=\"25\" stroke=\"#d40000\" stroke-width=\"10\"/></svg>", "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why is lane splitting/filtering between lanes risky legally in Sweden?", "a": ["It is a general legal right for motorcycles", "It is not a general permission; you must follow lane/overtaking rules and avoid unsafe passing", "It is required in queues", "It is allowed only at night"], "correct": 1, "exp": "Swedish rules do not provide a blanket permission to ride between lanes; passing/overtaking and lane rules still apply.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why are motorcycles harder for drivers to judge?", "a": ["They are always silent", "Small profile makes speed and distance harder to estimate", "They always ride faster", "They have no lights"], "correct": 1, "exp": "A motorcycle's small visual profile makes it easy to misjudge distance and speed.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What is an escape route?", "a": ["The nearest petrol station", "A planned path to avoid a developing hazard", "A parking permit", "A GPS route"], "correct": 1, "exp": "Good riders constantly look for space to brake or steer if another road user makes a mistake.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "Why avoid riding over manhole covers while leaning?", "a": ["They damage helmets", "Metal covers can be slippery, especially wet", "They are illegal for motorcycles", "They increase fuel use"], "correct": 1, "exp": "Metal covers offer less grip than asphalt, especially when wet.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Motorcycle safety", "q": "What should you do before carrying a passenger?", "a": ["No preparation is needed", "Explain how to sit/lean, check equipment and adjust riding for extra weight", "Remove mirrors", "Use lower tyre pressure"], "correct": 1, "exp": "Passenger weight changes handling; the passenger must know how to sit and avoid sudden movements.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What does low tyre pressure cause?", "a": ["Better fuel economy", "Poor handling, heat build-up and tyre wear", "Brighter lights", "Shorter stopping distance in all cases"], "correct": 1, "exp": "Under-inflation harms handling and safety.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><rect x=\"30\" y=\"20\" width=\"100\" height=\"56\" rx=\"8\" fill=\"#374151\"/><g fill=\"#111827\"><rect x=\"42\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"62\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"82\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"102\" y=\"20\" width=\"8\" height=\"56\"/></g><line x1=\"30\" y1=\"64\" x2=\"130\" y2=\"64\" stroke=\"#ef4444\" stroke-width=\"3\"/><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">MC min tread 1.0 mm</text></svg>", "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What does over-inflated tyre pressure risk?", "a": ["More contact patch and grip", "Reduced grip/comfort and abnormal wear", "Legal exemption from tread rules", "No effect"], "correct": 1, "exp": "Too much pressure changes the contact patch and can reduce grip and comfort.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": "<svg viewBox=\"0 0 160 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"160\" height=\"120\" rx=\"12\" fill=\"#111827\"/><rect x=\"30\" y=\"20\" width=\"100\" height=\"56\" rx=\"8\" fill=\"#374151\"/><g fill=\"#111827\"><rect x=\"42\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"62\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"82\" y=\"20\" width=\"8\" height=\"56\"/><rect x=\"102\" y=\"20\" width=\"8\" height=\"56\"/></g><line x1=\"30\" y1=\"64\" x2=\"130\" y2=\"64\" stroke=\"#ef4444\" stroke-width=\"3\"/><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-family=\"Arial\" font-size=\"15\" fill=\"#f3f4f6\">MC min tread 1.0 mm</text></svg>", "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "What is the purpose of mirrors?", "a": ["Only reversing", "Continuous awareness behind and beside you", "Decoration", "Only for the test"], "correct": 1, "exp": "Mirrors are part of continuous traffic awareness, especially before changing speed or direction.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Vehicle knowledge", "q": "A headlight failure on a motorcycle is serious because:", "a": ["It only affects night riding", "Motorcycles rely on lights for daytime conspicuity as well as night vision", "It improves fuel economy", "It makes ABS stronger"], "correct": 1, "exp": "Visibility is critical for motorcycles; a failed light reduces conspicuity.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "Why avoid unnecessary idling?", "a": ["It charges tyres", "It wastes fuel and creates emissions without transport benefit", "It improves cold braking", "It is required by law"], "correct": 1, "exp": "Unnecessary idling wastes fuel and increases emissions.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Environment", "q": "Why does anticipation reduce emissions?", "a": ["It lets you brake later", "It reduces unnecessary acceleration and braking", "It increases engine rpm", "It shortens legal stopping distance"], "correct": 1, "exp": "Smoother riding uses less fuel.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "What does stress often do to riding?", "a": ["Improves judgment", "Narrows attention and increases risk-taking", "Makes ABS unnecessary", "Only affects passengers"], "correct": 1, "exp": "Stress and anger impair decision-making and attention.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Personal conditions", "q": "If your visor fogs in rain/cold, what is safest?", "a": ["Continue without visibility", "Slow/stop safely and restore visibility", "Ride with eyes half closed", "Use high beam"], "correct": 1, "exp": "You must be able to see clearly; reduce risk and fix the problem safely.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What should you do when emergency vehicles approach with blue lights/sirens?", "a": ["Race ahead", "Facilitate passage safely without creating new danger", "Stop immediately in any lane", "Ignore them if you have priority"], "correct": 1, "exp": "Make way in a controlled way; do not create additional hazards.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What does 'adapt speed to conditions' mean?", "a": ["Always drive at the posted limit", "Choose a speed safe for visibility, road surface, traffic, weather and vehicle condition", "Drive slowly in all conditions", "Only applies to cars"], "correct": 1, "exp": "The posted speed limit is a maximum, not a guarantee that the speed is safe.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "When changing lanes, what is required?", "a": ["Signal and check mirrors/blind spots, and change only if it can be done safely", "Signal only", "Check speedometer only", "Motorcycles may change lanes without signaling"], "correct": 0, "exp": "Safe lane changes require observation, signalling and not endangering others.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is the main purpose of indicators?", "a": ["To claim priority", "To inform others of your intention; they do not give you priority", "To thank other drivers", "To show speed"], "correct": 1, "exp": "Signals communicate intention but do not create a right to move.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Traffic rules", "
