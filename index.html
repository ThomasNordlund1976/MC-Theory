 58l13 16-20-2z\" fill=\"#ffd200\"/><path d=\"M92 112a42 42 0 0 1-40-38\" stroke=\"#ffd200\" stroke-width=\"6\" fill=\"none\"/><path d=\"M57 82L44 66l20 2z\" fill=\"#ffd200\"/></svg>", "difficulty": "standard"}, {"cat": "Traffic rules", "q": "What is safest near schools or bus stops?", "a": ["Maintain speed if no crossing is marked", "Reduce speed and expect children/pedestrians", "Use horn as warning continuously", "Ride close to parked cars"], "correct": 1, "exp": "Vulnerable road users can appear suddenly around schools and bus stops.", "source": "Transportstyrelsen: Trafikregler / General traffic rules", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What is the friction-circle idea?", "a": ["Tyre grip is limited and shared between braking, cornering and acceleration", "A roundabout rule", "A tyre brand mark", "A fuel economy diagram"], "correct": 0, "exp": "Asking for too much braking/turning/acceleration at once can exceed available grip.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}, {"cat": "Risk awareness", "q": "What should you do after riding through deep water?", "a": ["Ride fast to dry clothes", "Gently test/apply brakes at low speed to dry them, when safe", "Ignore brakes until needed", "Stop and open the engine"], "correct": 1, "exp": "Wet brakes can have reduced effect; dry/test them safely after water.", "source": "Trafikverket: Motorcycle knowledge and road safety", "img": null, "difficulty": "standard"}];
const SOURCE_LINKS = [["Transportstyrelsen – Vägmärken", "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/vagmarken/"], ["Transportstyrelsen – Trafikregler", "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/trafikregler/"], ["Transportstyrelsen – Motorcykel licence", "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/ta-korkort/valj-behorighet/motorcykel/"], ["Transportstyrelsen – MC rules", "https://www.transportstyrelsen.se/mc"], ["Transportstyrelsen – Kontrollbesiktning motorcykel", "https://www.transportstyrelsen.se/sv/vagtrafik/fordon/aga-kopa-eller-salja-fordon/fordonsbesiktning/besiktningsregler/motorcykel/"], ["Transportstyrelsen – Körkort och alkohol", "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/har-korkort/villkor-och-medicinska-krav/korkort-och-alkohol/"], ["Transportstyrelsen – Mobile phone rules", "https://www.transportstyrelsen.se/sv/vagtrafik/trafikregler-och-vagmarken/trafikregler/i-fordonet/regler-for-mobilanvandning-och-kommunikationsutrustning/"], ["Transportstyrelsen – Riskutbildning MC", "https://www.transportstyrelsen.se/sv/vagtrafik/korkort/ta-korkort/riskutbildning/riskutbildning-motorcykel/"], ["Trafikverket – Motorcycle tests", "https://www.trafikverket.se/korkort/ta-korkort/motorcykel/"]];
let order = QUESTIONS.map((_,i)=>i); let current=0; let answers = JSON.parse(localStorage.getItem('mc_answers_preview')||'{}'); let mode='quiz';
function $(id){return document.getElementById(id)}
function save(){localStorage.setItem('mc_answers_preview',JSON.stringify(answers))}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function setFilter(){const cats=[...new Set(QUESTIONS.map(q=>q.cat))]; $('filter').innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
function rebuildOrder(){const f=$('filter').value; order=QUESTIONS.map((q,i)=>[q,i]).filter(([q])=>f==='all'||q.cat===f).map(x=>x[1]); current=0; render()}
function stats(){let ok=0,bad=0,total=Object.keys(answers).length; for(const [k,v] of Object.entries(answers)){if(QUESTIONS[k].correct===v)ok++; else bad++;} $('sOk').textContent=ok; $('sBad').textContent=bad; $('pct').textContent=total?Math.round(ok/total*100)+'%':'0%'; $('scoreText').textContent=`${ok} / ${total} correct`;}
function renderNav(){const nav=$('nav'); nav.innerHTML=''; order.forEach((idx,pos)=>{let b=document.createElement('button'); b.textContent=pos+1; b.className='qnav'+(pos===current?' current':'')+(answers[idx]!==undefined?(answers[idx]===QUESTIONS[idx].correct?' ok':' bad'):''); b.onclick=()=>{current=pos; render()}; nav.appendChild(b)})}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode)); stats(); renderNav(); if(mode==='all')return renderAll(); if(mode==='sources')return renderSources(); renderQuiz()}
function renderQuiz(){const idx=order[current]; const q=QUESTIONS[idx]; $('cat').textContent=q.cat; $('counter').textContent=`${current+1} / ${order.length}`; $('bar').style.width=((current+1)/order.length*100)+'%'; const chosen=answers[idx]; const media=q.img?`<div class="media">${q.img}</div>`:''; $('content').innerHTML=`<h1>${q.q}</h1>${media}<div class="answers">${q.a.map((a,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}</div><div class="explain" id="exp"><b>Explanation</b><br>${q.exp}<div class="source">Source: ${q.source}</div></div><div class="actions"><button class="secondary" onclick="prevQ()">Previous</button><button class="primary" id="next" onclick="nextQ()">Next question →</button></div>`; document.querySelectorAll('.answer').forEach(btn=>{btn.onclick=()=>choose(idx,Number(btn.dataset.i));}); if(chosen!==undefined) reveal(idx, chosen);}
function choose(idx,i){if(answers[idx]!==undefined)return; answers[idx]=i; save(); reveal(idx,i); stats(); renderNav();}
function reveal(idx,chosen){const q=QUESTIONS[idx]; document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true; if(j===q.correct)b.classList.add('correct'); else if(j===chosen)b.classList.add('wrong'); else b.classList.add('dim');}); const exp=$('exp'); if(exp)exp.classList.add('show');}
function nextQ(){if(current<order.length-1)current++; else current=0; render()} function prevQ(){if(current>0)current--; else current=order.length-1; render()}
$('backBtn').onclick=prevQ; $('filter').onchange=rebuildOrder; document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{mode=b.dataset.mode; render()});
function renderAll(){$('cat').textContent='All questions'; $('counter').textContent=`${QUESTIONS.length} total`; $('bar').style.width='100%'; $('content').innerHTML='<h1>All questions</h1>'+QUESTIONS.map((q,i)=>`<div class="reviewitem"><span class="pill">${q.cat}</span><h3>${i+1}. ${q.q}</h3><p><b>Answer:</b> ${q.a[q.correct]}</p><p style="color:var(--muted)">${q.exp}</p><p class="source">${q.source}</p></div>`).join('')}
function renderSources(){$('cat').textContent='Official sources'; $('counter').textContent=''; $('bar').style.width='100%'; $('content').innerHTML='<h1>Official sources used</h1><p style="color:var(--muted);line-height:1.6">This preview is based on official Swedish sources and conservative, exam-relevant wording. It does not claim to replace official study material or a driving school.</p>'+SOURCE_LINKS.map(([name,url])=>`<div class="reviewitem"><b>${name}</b><br><a href="${url}" target="_blank" rel="noopener" style="color:#ffb18f">${url}</a></div>`).join('')}
setFilter(); render();
</script>
</body></html>
