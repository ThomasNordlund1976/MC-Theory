  <rect x="0" y="88" width="50" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <rect x="150" y="88" width="50" height="24" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <!-- Motorcycle approaching from bottom -->
  <text x="100" y="185" font-size="18" text-anchor="middle">🏍️</text>
  <text x="100" y="135" font-size="11" fill="#333" text-anchor="middle" font-family="Arial">Give way?</text>
</svg>`, imgCaption:"Approaching a roundabout",
   q:"You are approaching a roundabout. Who has priority — you or vehicles already inside the roundabout?",
   a:["You have priority as you are entering from a main road","Vehicles already circulating inside the roundabout have priority","You have priority if you arrived first","Largest vehicle has priority"], correct:1,
   exp:"In Sweden, vehicles already inside a roundabout have priority. You must give way when entering. This rule applies unless signs indicate otherwise (some older roundabouts have different priority)."},

  {cat:"Trafikregler", img:`<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Road with centre line -->
  <rect x="0" y="0" width="200" height="160" fill="#c8c8c8"/>
  <rect x="30" y="0" width="140" height="160" fill="#555"/>
  <line x1="100" y1="0" x2="100" y2="160" stroke="white" stroke-width="3" stroke-dasharray="15,10"/>
  <!-- Motorcycle going straight, car turning left across path -->
  <text x="60" y="130" font-size="22" text-anchor="middle">🏍️</text>
  <text x="130" y="90" font-size="20" text-anchor="middle">🚗</text>
  <path d="M130,95 Q130,60 80,50" fill="none" stroke="yellow" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="yellow"/></marker></defs>
  <text x="100" y="20" font-size="11" fill="white" text-anchor="middle" font-family="Arial">Intersection ahead</text>
</svg>`, imgCaption:"Car turning left across your path",
   q:"You are riding straight through an intersection. A car ahead is turning left across your path. What should you do?",
   a:["Flash your headlights and maintain speed — you have right of way","Sound your horn and brake if needed — you have priority but must be prepared to stop","Accelerate to pass before the car completes its turn","Turn right to avoid the conflict"], correct:1,
   exp:"You have priority going straight, but you must always be prepared to brake. The turning car driver may not have seen you. Cover the brakes, reduce speed approaching the intersection, and never assume the other driver will yield."},

  {cat:"Trafikregler",
   q:"What is the rule for using hazard warning lights (all four indicators simultaneously) on a motorcycle?",
   a:["Use them whenever you slow down suddenly","Use them when parked on the road or to warn of a sudden queue or danger ahead","Use them in fog instead of riding lights","Motorcycles are not required to have hazard lights"], correct:1,
   exp:"Hazard lights signal a stationary or slow vehicle blocking traffic, or an emergency stop. On a motorcycle, activating them when stopping unexpectedly on a road warns following traffic. They should not be used as a routine slowing signal."},

  {cat:"Trafikregler",
   q:"You are overtaking a cyclist on a rural road. What minimum side clearance should you give?",
   a:["0.5 metres","At least 1 metre, more if possible","1.5 metres is required by law","There is no legal minimum, just pass safely"], correct:1,
   exp:"Swedish traffic law requires you to give cyclists and other vulnerable road users sufficient space when passing. In practice, at least 1-1.5 metres is recommended. At higher speeds, a larger margin is required."},

  {cat:"Trafikregler",
   q:"When may you use the horn on your motorcycle in Sweden?",
   a:["To warn someone of your presence to avoid an accident, or as a greeting","Only to warn of danger — not as a greeting or in residential areas at night","Anytime you feel it is helpful","Only in areas marked with a horn symbol sign"], correct:1,
   exp:"The horn should only be used to warn of danger. Using it as a greeting or out of frustration is prohibited. In built-up areas, particularly at night, unnecessary horn use is not permitted."},

  {cat:"Trafikregler",
   q:"What does a yellow diamond-shaped sign with a white border indicate on a Swedish road?",
   a:["Warning: narrow road","You are on a priority road (huvudled)","School zone begins","Parking allowed"], correct:1,
   exp:"The yellow diamond (priority road sign / huvudled) means you are on a priority road and have right of way over vehicles entering from side roads. This continues until a white diamond with a diagonal bar cancels it."},

  {cat:"Trafikregler",
   q:"On a priority road (huvudled), you approach a junction. A vehicle comes from the right on a minor road. Who has priority?",
   a:["The vehicle from the right always has priority","You have priority — you are on the hauptled/priority road","Whoever is going faster","You must give way only if the other vehicle is larger"], correct:1,
   exp:"On a priority road, you have right of way over all side-road traffic regardless of direction. The right-hand priority rule does NOT apply when you are on a designated priority road."},

  {cat:"Trafikregler",
   q:"What does a dashed white line across a road at an intersection mean?",
   a:["Stop completely before proceeding","Give way — yield to traffic on the intersecting road","Road ends","Pedestrian crossing"], correct:1,
   exp:"A dashed white line (väjningslinje / shark's teeth / give way line) means you must give way to traffic on the road you are entering. You do not need to stop if the way is clear, but you must yield."},

  {cat:"Trafikregler",
   q:"You want to park your motorcycle in Sweden. How close to a pedestrian crossing may you park?",
   a:["1 metre","5 metres","10 metres","25 metres"], correct:2,
   exp:"Parking within 10 metres before a pedestrian crossing is prohibited in Sweden. This keeps sightlines clear for both pedestrians and drivers."},

  {cat:"Trafikregler",
   q:"On a road with a speed limit of 100 km/h, what is the minimum following distance you should maintain in dry conditions?",
   a:["50 metres","At least 3 seconds of time gap (approximately 80 metres at 100 km/h)","30 metres","100 metres"], correct:1,
   exp:"The 3-second rule gives approximately 83 metres at 100 km/h. In wet or poor conditions, double this to at least 6 seconds. Motorcycles need this space because they can stop quickly — but following traffic may not."},

  {cat:"Trafikregler",
   q:"When must you stop at a level crossing (järnvägsövergång) in Sweden?",
   a:["Only when barriers are down","When barriers are down, warning lights are flashing, or a train is audible or visible","Only when a train is visible","Only when a specific sign requires a stop"], correct:1,
   exp:"You must stop at a level crossing whenever: barriers are down or lowering, warning lights flash, an audible signal sounds, or a train is approaching. Never attempt to cross if in any doubt."},

  {cat:"Trafikregler",
   q:"What is the rule for riding a motorcycle in a bus lane in Sweden?",
   a:["Motorcycles are always allowed in bus lanes","Motorcycles may use bus lanes only if a specific sign permits it","Motorcycles are never allowed in bus lanes","Motorcycles can use bus lanes outside peak hours"], correct:1,
   exp:"Motorcycles may only use bus lanes if a sign explicitly includes them (shown by a motorcycle symbol on the bus lane sign). Without such a sign, bus lanes are restricted to buses (and taxis where permitted)."},

  // ══════════════════════════════════════════════
  //  BATCH 2 — MC Safety (deeper topics)
  // ══════════════════════════════════════════════

  {cat:"MC-Säkerhet", img:`<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Road from above showing lane position -->
  <rect x="0" y="0" width="200" height="140" fill="#c0c0c0"/>
  <rect x="20" y="0" width="160" height="140" fill="#444"/>
  <line x1="100" y1="0" x2="100" y2="140" stroke="white" stroke-width="3" stroke-dasharray="15,10"/>
  <!-- Left side of lane, position markers -->
  <circle cx="45" cy="70" r="8" fill="#ff5c1a" opacity="0.8"/>
  <text x="45" y="74" font-size="9" fill="white" text-anchor="middle" font-family="Arial">A</text>
  <circle cx="75" cy="70" r="8" fill="#2dd4a0" opacity="0.8"/>
  <text x="75" y="74" font-size="9" fill="white" text-anchor="middle" font-family="Arial">B</text>
  <circle cx="100" cy="70" r="8" fill="#aaa" opacity="0.8"/>
  <text x="100" y="74" font-size="8" fill="white" text-anchor="middle" font-family="Arial">C</text>
  <!-- Parked car right side -->
  <rect x="155" y="30" width="25" height="80" rx="3" fill="#4488ff"/>
  <text x="165" y="75" font-size="8" fill="white" text-anchor="middle" font-family="Arial">CAR</text>
  <text x="100" y="120" font-size="10" fill="white" text-anchor="middle" font-family="Arial">Parked cars on right →</text>
</svg>`, imgCaption:"Lane position when passing parked cars — A=far left, B=centre-left, C=centre",
   q:"When passing a row of parked cars, which lane position (see image) is safest for a motorcycle?",
   a:["A — as far left as possible to maximise distance from doors","B — slightly left of centre, giving clearance from doors while staying visible","C — centre of lane","It doesn't matter as long as you maintain speed"], correct:1,
   exp:"Position B gives you clearance from opening car doors (the 'door zone' extends ~1 metre) while keeping you visible in traffic. Position A risks placing you too close to oncoming traffic or the road edge."},

  {cat:"MC-Säkerhet",
   q:"When should you use your headlight on high beam while riding at night?",
   a:["Always on rural roads at night","When there is no oncoming traffic and road lighting is poor or absent","Only on motorways","Only when the road ahead is completely clear for 500 metres"], correct:1,
   exp:"Use high beam when no oncoming vehicle or vehicle ahead could be dazzled, and when you need extra visibility. Switch to low beam when another vehicle approaches to avoid blinding the driver."},

  {cat:"MC-Säkerhet",
   q:"What is the purpose of 'pressing through' the pegs (pushing down on footpegs) when cornering?",
   a:["It has no effect — foot position doesn't matter","It stabilises the motorcycle, improves lean angle control, and reduces rider fatigue through active body weighting","It helps apply the rear brake progressively","It prevents the feet from slipping off in sharp corners"], correct:1,
   exp:"Weighting the outside peg in a corner improves stability and traction feel. It's part of correct motorcycle body positioning and is particularly important at speed or on slippery surfaces."},

  {cat:"MC-Säkerhet",
   q:"You are riding at 90 km/h and encounter sudden thick fog reducing visibility to 30 metres. What should you do?",
   a:["Maintain speed but turn on hazard lights","Reduce speed immediately to be able to stop within your visibility distance, use low beam (not high beam in fog)","Stop on the road shoulder immediately","Increase speed to get through the fog faster"], correct:1,
   exp:"In fog, always ride within your stopping distance. High beam worsens fog visibility (it bounces back). Use low beam or fog lights if fitted. If visibility is too low, find a safe place to stop off the road."},

  {cat:"MC-Säkerhet",
   q:"Why is the first 10-15 minutes of rainfall particularly dangerous for motorcyclists?",
   a:["Rain reduces tyre temperature too quickly","Rain mixes with oils and rubber deposits on the road surface, creating extremely slippery conditions before washing them away","New rain tyres take 15 minutes to reach optimal temperature","Visors fog up in the first minutes of rain"], correct:1,
   exp:"When rain first hits a dry road, it lifts accumulated oil, rubber dust, and diesel residue, creating a very slippery layer. After sustained rain, this washes away. The first minutes of rain require extreme caution."},

  {cat:"MC-Säkerhet",
   q:"What is the recommended technique for emergency braking on a curve?",
   a:["Brake hard immediately — braking distance is what matters","Try to straighten the motorcycle first if possible, then brake hard; if you must brake in the curve, do so gently and progressively","Always use rear brake only in a curve","Brake and simultaneously increase throttle to maintain balance"], correct:1,
   exp:"Braking hard in a corner risks losing traction. If possible, straighten the bike first, then brake. If you must brake while leaning, do so very progressively. ABS helps prevent lockup but cannot override the physics of traction limits."},

  {cat:"MC-Säkerhet",
   q:"What is the 'vanishing point' and how does it help you judge safe speed in a corner?",
   a:["The furthest point visible ahead determines your maximum safe speed — if it appears to move away you have room, if it rushes toward you, slow down","It is the point where your mirrors' visibility ends","The point where headlights stop illuminating the road","The apex of the corner"], correct:0,
   exp:"Track the vanishing point — where the road edges appear to meet. If it recedes (moves away) as you ride, the corner opens up and your speed is safe. If it approaches quickly, the corner is tightening and you must slow down."},

  {cat:"MC-Säkerhet",
   q:"After riding through deep water or a flooded section, what should you do?",
   a:["Continue normally — modern brakes are waterproof","Gently apply the brakes repeatedly while riding slowly to dry out and restore braking performance","Stop immediately and inspect the engine","Rev the engine to high RPM to dry internal components"], correct:1,
   exp:"Water in the brake discs and pads dramatically reduces braking power. After riding through water, gently apply brakes several times at low speed to generate heat and restore effectiveness before you need them in an emergency."},

  {cat:"MC-Säkerhet",
   q:"You feel your rear tyre losing grip and beginning to slide in a corner. What is the correct response?",
   a:["Apply front brake immediately to shift weight forward","Close the throttle abruptly to stabilise","Smoothly and gradually reduce throttle, and try not to make any sudden movements — let the bike settle","Steer sharply in the opposite direction of the slide"], correct:2,
   exp:"A sudden throttle close on a sliding rear tyre can snap the bike upright violently or cause a highside crash. Smooth, gradual throttle reduction lets the tyre regain grip progressively. Stay relaxed and let the bike find its own balance."},

  {cat:"MC-Säkerhet",
   q:"What does 'ATGATT' stand for and why is it relevant to motorcycle safety?",
   a:["Advanced Technique Guide And Throttle Training","All The Gear, All The Time — the principle of always wearing full protective gear regardless of trip length or weather","Automatic Traction and Grip Assessment Technology","A type of motorcycle insurance coverage"], correct:1,
   exp:"ATGATT stands for 'All The Gear, All The Time'. Statistics show that most serious motorcycle injuries occur on short, familiar trips. Wearing full gear every time — helmet, jacket, gloves, trousers, boots — is the most effective safety measure a rider can take."},

  {cat:"MC-Säkerhet",
   q:"How should you position your hands on the motorcycle handlebars to maintain best control?",
   a:["Grip tightly with all fingers at all times for maximum control","Maintain a relaxed but firm grip, with wrists low and arms slightly bent — avoid death-gripping","Hold with three fingers, keeping index finger always on brake lever","Grip varies — tighter in corners, looser on straights"], correct:1,
   exp:"Tense, tight gripping ('death grip') transmits vibrations to your body, causes fatigue, and interferes with smooth steering inputs. A relaxed grip with slightly bent elbows allows the bike to move naturally and lets you feel the road through the bars."},

  // ══════════════════════════════════════════════
  //  BATCH 2 — Vehicle Knowledge (expanded)
  // ══════════════════════════════════════════════

  {cat:"Fordonskännedom",
   q:"What is the purpose of the motorcycle's steering damper (styrdämpare)?",
   a:["It prevents speed wobble (tankslapper) by dampening oscillations in the steering","It automatically centres the handlebar when you let go","It prevents the front wheel from turning too sharply in a fall","It reduces effort needed to steer at low speeds"], correct:0,
   exp:"A steering damper resists rapid oscillations in the steering that can cause 'speed wobble' — a dangerous high-frequency wobble of the front end, especially at speed. It is particularly common on sport bikes and bikes with long forks."},

  {cat:"Fordonskännedom",
   q:"What does it mean if your motorcycle's chain has a 'tight spot' (a section that is noticeably tighter than the rest)?",
   a:["The chain just needs more lubrication","The chain is worn unevenly and should be replaced — a tight spot indicates a bent link or worn pin","You should tighten the chain tension to match the tightest point","The sprocket is slightly oversized for the chain"], correct:1,
   exp:"A chain with tight spots has worn or stiff links. Adjusting tension to the tightest spot will leave the rest too loose; to the loosest spot will over-stress the tight section. An unevenly worn chain should be replaced along with the sprockets."},

  {cat:"Fordonskännedom",
   q:"What is 'fork dive' and when does it occur?",
   a:["The front forks compress rapidly under hard braking, shifting weight forward and potentially affecting steering","The front forks rust and seize over winter","The suspension bottoms out when hitting a large bump","Fork oil leaking during cornering"], correct:0,
   exp:"Fork dive is the rapid compression of the front suspension under hard braking. It shifts weight heavily to the front tyre, which improves front grip but reduces rear grip. Extreme fork dive can cause the forks to bottom out, momentarily locking out suspension travel."},

  {cat:"Fordonskännedom",
   q:"What does a motorcycle's 'preload' adjustment on the suspension control?",
   a:["The amount of damping (resistance to movement)","The initial compression of the spring, affecting ride height and sag — adjusted for rider weight and load","Engine braking force when downshifting","Throttle response sensitivity"], correct:1,
   exp:"Preload sets how much the spring is pre-compressed before any load is applied. More preload = firmer ride height, less sag. It should be adjusted for your weight plus any pillion or luggage. Incorrect preload affects handling significantly."},

  {cat:"Fordonskännedom",
   q:"What is the recommended method to check brake pad wear on a motorcycle?",
   a:["Check the brake pedal travel — if it goes to the floor, pads are worn","Visually inspect pad thickness through the caliper — most pads have a wear indicator groove or minimum thickness marking","Measure braking distance monthly","Brake fluid level drops indicate pad wear"], correct:1,
   exp:"Brake pads have a minimum thickness groove or mark. Visually inspect the pad through the caliper. Replace pads before they reach the minimum. Note: brake fluid level drops as pads wear, so low fluid can also signal worn pads (but check both)."},

  {cat:"Fordonskännedom",
   q:"What does 'coolant temperature warning light' (often a thermometer icon) on the dashboard indicate?",
   a:["Coolant level is low — top up immediately while riding","Engine is overheating — stop safely as soon as possible to prevent engine damage","Normal operating temperature has been reached","Coolant replacement service is due"], correct:1,
   exp:"An overheating warning requires you to stop riding as soon as safely possible. Do not open the coolant cap while hot. Let the engine cool before investigating. Riding with an overheating engine can cause severe and expensive damage."},

  {cat:"Fordonskännedom",
   q:"What is the significance of a tyre's load index and speed rating markings (e.g. 73W)?",
   a:["73 is the tyre width in cm; W means wet-weather approved","73 is the load index (maximum weight capacity); W is the speed rating (up to 270 km/h) — both must meet or exceed manufacturer specs","73 is the aspect ratio; W means winter tyre","Internal tyre reference number only, not relevant to riders"], correct:1,
   exp:"Never fit a tyre with a lower load index or speed rating than specified by the manufacturer. The load index (73 = 365 kg) and speed symbol (W = 270 km/h) define the tyre's limits. Exceeding these is unsafe and illegal."},

  {cat:"Fordonskännedom",
   q:"What does the orange KTM-style fuel warning light (fuel pump icon) typically indicate?",
   a:["Fuel pump failure — stop immediately","Fuel level is low — reserve level reached, find fuel soon","Water in fuel — drain and refill","Fuel filter needs replacement at next service"], correct:1,
   exp:"A fuel warning light means your tank is approaching empty (often 2-4 litres remain depending on the model). Find a fuel station soon. Running completely dry can damage fuel-injected engines and leave you stranded."},

  {cat:"Fordonskännedom",
   q:"What is 'countersteering' and at what speed does it become the primary steering method?",
   a:["Leaning body weight while keeping bars fixed — effective above 40 km/h","Pushing the handlebar forward on the side you want to turn — dominant above approximately 20-25 km/h","Turning the handlebars in the opposite direction temporarily before a corner — used below 20 km/h","Braking with front brake to initiate a turn — effective at all speeds"], correct:1,
   exp:"Above approximately 20-25 km/h, you steer a motorcycle primarily by countersteering: pushing the right bar turns the bike right (and vice versa). This is caused by gyroscopic forces. Below this speed, direct steering (turning bars) dominates."},

  // ══════════════════════════════════════════════
  //  BATCH 2 — Environment (expanded)
  // ══════════════════════════════════════════════

  {cat:"Miljö",
   q:"How does riding at 90 km/h instead of 110 km/h affect fuel consumption?",
   a:["Negligible difference — fuel consumption is mainly affected by engine size","Significant reduction — aerodynamic drag increases with the square of speed, so 110 km/h uses considerably more fuel","10% more fuel at 90 km/h due to more time on the road","Only relevant for larger displacement motorcycles"], correct:1,
   exp:"Aerodynamic drag increases with the square of speed. At 110 vs 90 km/h, drag is roughly 50% higher. This directly increases fuel consumption and CO₂ emissions significantly. Riding at 90 km/h is substantially more fuel-efficient."},

  {cat:"Miljö",
   q:"What is 'eco-riding' (snålkörning) and which technique has the biggest single impact?",
   a:["Always using the highest gear possible","Smooth riding with early upshifting, maintaining steady throttle, anticipating traffic to avoid unnecessary braking — upshifting early has the largest single impact","Riding at exactly the speed limit at all times","Warming up the engine for 10 minutes before each ride"], correct:1,
   exp:"Eco-riding means anticipating traffic and lights, accelerating smoothly, upshifting early to keep revs moderate, and maintaining speed rather than repeatedly braking and accelerating. Early upshifting (keeping RPM low) is the single biggest fuel-saver."},

  {cat:"Miljö",
   q:"Motorcycle tyres marked with 'R' (radial) vs 'B' (bias/cross-ply) — what environmental consideration applies?",
   a:["Radial tyres are made from recycled materials","Radial tyres typically have lower rolling resistance, meaning slightly lower fuel consumption and CO₂ emissions","Bias tyres last longer and therefore have a smaller environmental footprint","Tyre construction has no environmental impact"], correct:1,
   exp:"Radial tyres generally offer lower rolling resistance than bias-ply tyres of equivalent size, contributing to marginally better fuel economy. The manufacturer's recommended tyre type should always be used regardless."},

  // ══════════════════════════════════════════════
  //  BATCH 2 — Risk Awareness (expanded)
  // ══════════════════════════════════════════════

  {cat:"Riskbedömning", img:`<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <!-- T-junction from above -->
  <rect x="0" y="0" width="200" height="160" fill="#c0c0c0"/>
  <!-- Main horizontal road -->
  <rect x="0" y="55" width="200" height="60" fill="#555"/>
  <!-- Side road from top -->
  <rect x="80" y="0" width="40" height="55" fill="#555"/>
  <!-- Lane markings -->
  <line x1="0" y1="85" x2="78" y2="85" stroke="white" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="122" y1="85" x2="200" y2="85" stroke="white" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- Motorcycle on main road -->
  <text x="40" y="90" font-size="20" text-anchor="middle">🏍️</text>
  <!-- Car emerging from side -->
  <text x="100" y="40" font-size="18" text-anchor="middle">🚗</text>
  <path d="M100,50 L100,70" stroke="#ffcc00" stroke-width="3" marker-end="url(#arw)"/>
  <defs><marker id="arw" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto"><polygon points="0,0 5,2.5 0,5" fill="#ffcc00"/></marker></defs>
</svg>`, imgCaption:"Car emerging from side road",
   q:"In this situation, a car is emerging from a side road. You are on the main road. What is the primary risk?",
   a:["The car may not stop — it is on a minor road and must yield to you","The car driver may not have seen your motorcycle and may pull out — you should cover the brakes and be prepared to stop even though you have priority","You should accelerate to pass before the car enters your lane","Flash your headlights to make yourself visible and maintain speed"], correct:1,
   exp:"Even though you have priority, never rely on it. Motorcycle-car collisions at junctions are extremely common because car drivers look but fail to register motorcycles. Slow down, cover brakes, make eye contact if possible, and be ready to stop."},

  {cat:"Riskbedömning",
   q:"What is the '2-second rule' and when should you extend it?",
   a:["Always leave 2 car lengths behind the vehicle ahead","Pick a fixed point when the vehicle ahead passes it — you should pass the same point no sooner than 2 seconds later. Extend to 4+ seconds in wet, poor visibility, or heavy traffic","Count to 2 after braking before accelerating","Maintain 2 metres clearance when overtaking"], correct:1,
   exp:"The 2-second (or 3-second) following distance rule gives you time to react and stop if the vehicle ahead brakes. In wet conditions, stopping distances double or more, so extend the gap accordingly. In heavy traffic or poor visibility, use 4+ seconds."},

  {cat:"Riskbedömning",
   q:"You are about to overtake a lorry on a rural road. What specific hazards should you consider?",
   a:["Lorries are slow — little risk","Slipstream, blind spots, the lorry may turn without warning, and vehicles may be hidden ahead of the lorry — only overtake when you can see the full clear road ahead","Lorries always indicate when turning, so follow their signals","Position on the right side when passing for maximum visibility"], correct:1,
   exp:"Overtaking lorries requires seeing well past them — wait until you can see the road is completely clear ahead. Watch for the slipstream effect when you emerge alongside. Never overtake near junctions or where the lorry might turn. Pass as quickly as safely possible."},

  {cat:"Riskbedömning",
   q:"What is the 'friction circle' concept and why does it matter for motorcycle riders?",
   a:["A technique for riding on gravel circles","A model showing that a tyre has a finite total grip that must be shared between braking, acceleration, and cornering — exceeding the total causes a skid","A type of roundabout training exercise","The circular pattern of tyre wear indicating alignment issues"], correct:1,
   exp:"Each tyre has a maximum total grip (the friction circle). Using 100% for cornering leaves 0% for braking or acceleration. Using 70% for cornering leaves 30% for braking. Understanding this helps riders avoid asking too much of the tyres in combined situations."},

  {cat:"Riskbedömning",
   q:"Wildlife (djur) crossing warning signs are common in Sweden. What should you do when you see one?",
   a:["Sound the horn continuously to scare animals away","Reduce speed and be prepared for animals to appear suddenly — if one appears, focus on braking in a straight line rather than swerving","Accelerate to pass the zone quickly","Only slow down at dawn and dusk when animals are most active"], correct:1,
   exp:"Sweden has significant wildlife on roads (älg/moose, rådjur/deer). An animal collision at speed is often fatal on a motorcycle. Slow down in these zones. If an animal appears, brake firmly in a straight line — swerving risks losing control."},

  {cat:"Riskbedömning",
   q:"What is 'riding tired' most comparable to in terms of impairment?",
   a:["Riding after one beer","Being over the legal alcohol limit — reaction times and judgment are similarly impaired","Having a mild cold — slightly reduced but manageable","Having a minor distraction like music playing"], correct:1,
   exp:"Research shows that 17-19 hours without sleep produces impairment equivalent to a blood alcohol concentration of 0.05%. After 24 hours, impairment equals 0.10% — well above the legal limit. Fatigue is a major cause of motorcycle accidents."},

  // ══════════════════════════════════════════════
  //  BATCH 2 — Personal Conditions (expanded)
  // ══════════════════════════════════════════════

  {cat:"Personliga förhållanden",
   q:"You are prescribed medication with the label 'May cause drowsiness — do not operate machinery'. What should you do?",
   a:["Ride if you feel alert enough","Do not ride — this warning explicitly applies to motorcycles and other vehicles. Consult your doctor about alternatives","Ride only short distances","Take a double coffee and assess how you feel"], correct:1,
   exp:"Any medication with a drowsiness warning is incompatible with riding. 'Operating machinery' includes motorcycles and all vehicles. If in doubt, contact your doctor or pharmacist about whether it is safe to ride while on the medication."},

  {cat:"Personliga förhållanden",
   q:"Which of the following medical conditions requires you by law to inform Transportstyrelsen (Swedish Transport Agency) in Sweden?",
   a:["Hay fever or mild allergies","Epilepsy, insulin-treated diabetes, serious heart conditions, or other conditions that may affect driving ability","Any condition requiring prescription medication","Mild depression treated with SSRIs"], correct:1,
   exp:"Swedish law requires drivers to report medical conditions that may affect driving ability to Transportstyrelsen. These include epilepsy, certain cardiac conditions, severe diabetes, visual impairments, and others. Failure to report can invalidate your licence."},

  {cat:"Personliga förhållanden",
   q:"How does dehydration affect riding performance?",
   a:["Minimal effect — dehydration only becomes dangerous after several days","Even mild dehydration (1-2%) reduces concentration, reaction time, and decision-making — effects are similar to alcohol at 0.08%","Dehydration only affects endurance athletes, not vehicle operators","It only causes cramps, not cognitive impairment"], correct:1,
   exp:"Even mild dehydration impairs cognitive function measurably. On a hot day, riders in full gear can lose significant fluid quickly. Drink regularly, especially on long rides in warm weather. Dehydration is a recognised contributor to fatigue-related accidents."},

  {cat:"Personliga förhållanden",
   q:"You have not slept well for several nights (cumulative sleep debt). You feel relatively alert this morning. Should you ride?",
   a:["Yes — if you feel alert, sleep debt is not a factor","Caution is advised — cumulative sleep debt impairs performance even when you feel alert. Consider postponing long or demanding rides","Only avoid riding at night when sleep debt is a problem","Sleep debt only matters if you feel tired during the ride"], correct:1,
   exp:"Cumulative sleep debt is deceptive — you adapt to feeling less alert and lose the ability to accurately judge your own impairment. Subjective alertness does not reflect actual performance. After several poor nights, postpone demanding rides."},

  // ══════════════════════════════════════════════
  //  BATCH 2 — Swedish Law (expanded)
  // ══════════════════════════════════════════════

  {cat:"Svensk trafiklag",
   q:"What is 'grovt rattfylleri' (aggravated drink-driving) and what is the threshold?",
   a:["Blood alcohol above 0.2 ‰","Blood alcohol of 1.0 ‰ or more, or any amount combined with other impairing factors — carries much heavier penalties","Any alcohol combined with medication","Blood alcohol above 0.5 ‰"], correct:1,
   exp:"Grovt rattfylleri (aggravated DUI) in Sweden applies when BAC is 1.0 ‰ or higher, or at lower levels combined with other impairment. Penalties include imprisonment up to 2 years, licence revocation, and installation of an alcohol interlock device."},

  {cat:"Svensk trafiklag",
   q:"If your motorcycle is involved in an accident causing personal injury or significant property damage, what must you do?",
   a:["Leave details on the other vehicle's windscreen and call police within 24 hours","Stop immediately, assist any injured persons, call emergency services (112) if needed, and remain at the scene — leaving is a criminal offence (smitning)","Report to the nearest police station within 48 hours","Call your insurance company — they handle the rest"], correct:1,
   exp:"Fleeing an accident scene (smitning) is a criminal offence in Sweden. You must stop, assess injuries and call 112 if needed, exchange details with involved parties, and report the accident to police if required. Your insurance must also be notified promptly."},

  {cat:"Svensk trafiklag",
   q:"In Sweden, what is the maximum permitted blood alcohol level for a rider with a probationary period or under age 25?",
   a:["Same as all riders: 0.2 ‰","0.1 ‰","Same as all drivers: 0.2 ‰ — Sweden does not have a separate zero-tolerance threshold for novice riders","0.3 ‰ — slightly more lenient for newer riders"], correct:0,
   exp:"In Sweden, the legal BAC limit is 0.2 ‰ for ALL drivers — there is no separate stricter limit for novice or young riders by law. However, riding with ANY alcohol is strongly discouraged, and being over 0.2 ‰ is a criminal offence regardless of experience.trongly recommend zero tolerance, especially for new riders. Note: some countries have explicit zero-tolerance rules for novices — in Sweden the formal limit is 0.2 ‰ for all."},

  {cat:"Svensk trafiklag",
   q:"What equipment is legally required to be carried on a motorcycle in Sweden?",
   a:["A first-aid kit and fire extinguisher","A warning triangle (varningstriangel) for use in breakdowns or accidents","Reflective vest and phone charger","No specific equipment is legally required to be carried"], correct:1,
   exp:"A warning triangle must be carried in all motor vehicles in Sweden. It must be placed 50-100 metres behind your vehicle if you break down or are involved in an accident on a road. A reflective vest is also strongly recommended."},

  {cat:"Svensk trafiklag",
   q:"You are riding and a police officer signals you to stop. What must you do?",
   a:["You may continue to a safe location before stopping","Stop immediately and safely as directed","Only stop at a designated police checkpoint","You may request the stop in writing before complying"], correct:0,
   exp:"You must comply with police signals to stop, but you may continue a short distance to reach a safe stopping place (e.g. past an intersection, to a wider part of the road). Once stopped, you must provide your driving licence and identity documents."},

  {cat:"Svensk trafiklag",
   q:"What is the minimum age to ride a motorcycle with category A2 licence in Sweden?",
   a:["17 years","18 years","20 years","21 years"], correct:1,
   exp:"Category A2 (max 35 kW) requires a minimum age of 18 in Sweden. Category A1 (max 11 kW) is available from age 16. The full (unrestricted) Category A licence requires age 21 (with 2 years A2) or 24 (direct access)."},

  {cat:"Svensk trafiklag",
   q:"After how many years must a Swedish motorcycle licence be renewed?",
   a:["Every 5 years","Every 10 years","Every 10 years — licences issued after 2013 expire and must be renewed","Every 3 years after age 65"], correct:1,
   exp:"Driving licences (including motorcycle) issued in Sweden after 19 January 2013 are valid for 10 years and must be renewed. This aligns with EU Directive 2006/126/EC. Licences issued before 2013 may have different expiry rules.. Older licences may have different terms. After age 65, eyesight checks may be required depending on licence category. Always check Transportstyrelsen for current rules."},

  // ══════════════════════════════════════════════
  //  BATCH 3 — More Road Signs with SVG
  // ══════════════════════════════════════════════

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

  <line x1="60" y1="60" x2="60" y2="95" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
</svg>`, imgCaption:"Warning: road narrows",
   q:"This warning triangle shows the road narrowing (two lines converging). What does it mean?",
   a:["Road works ahead — prepare to stop","Road narrows — move to the centre and reduce speed","No overtaking zone begins","End of dual carriageway"], correct:1,
   exp:"This sign warns that the road narrows ahead. Reduce speed and be prepared for oncoming traffic with less room. On a motorcycle, be particularly aware of your lane position."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <circle cx="60" cy="60" r="52" fill="white" stroke="#cc0000" stroke-width="7"/>

  <line x1="22" y1="22" x2="98" y2="98" stroke="#cc0000" stroke-width="7"/>
</svg>`, imgCaption:"Weight restriction sign",
   q:"A red circle with '3.5t' and a diagonal line means:",
   a:["Maximum speed 35 km/h","No vehicles over 3500 kg (3.5 tonnes) total weight allowed","Axle weight limit 3.5 tonnes","Bridge load limit — proceed with caution"], correct:1,
   exp:"This is a weight prohibition sign. Vehicles with a total weight exceeding 3.5 tonnes may not pass. As a motorcyclist, this almost never applies to you, but you should recognise it."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="8" width="104" height="104" rx="4" fill="#0047ab"/>

  <rect x="62" y="70" width="42" height="32" rx="3" fill="white"/>
  <text x="83" y="90" font-size="14" fill="#0047ab" text-anchor="middle" font-family="Arial">09-17</text>
</svg>`, imgCaption:"Parking sign with time restriction",
   q:"A blue 'P' sign with times shown (e.g. 09-17) means:",
   a:["Parking is always free but spaces are monitored","Parking is only permitted between the hours shown (or prohibited during those hours, depending on context)","Paid parking at all times","Park and Ride facility nearby"], correct:1,
   exp:"Time restrictions on parking signs indicate when the rule applies. If it's a parking-permitted sign, parking is allowed during the shown hours. If accompanied by a prohibition, it applies during those times. Always read the full sign context carefully."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Priority sign (give way) inverted triangle -->
  <polygon points="60,112 8,12 112,12" fill="white" stroke="#cc0000" stroke-width="7"/>
</svg>`, imgCaption:"What does this inverted triangle mean?",
   q:"An inverted triangle (pointing downward) with red border and white fill means:",
   a:["You are on a priority road","Give way — yield to all crossing traffic","Stop completely and wait","Road ends — turn back"], correct:1,
   exp:"The inverted triangle (väjningsplikt) means you must give way to all traffic on the road you are entering. You do not have to stop if the way is clear, but you must yield. This is the give-way sign (väjningsskylt)."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- STOP sign (octagon) -->
  <polygon points="36,8 84,8 112,36 112,84 84,112 36,112 8,84 8,36" fill="#cc0000"/>
  <text x="60" y="72" font-size="28" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">STOP</text>
</svg>`, imgCaption:"STOP sign",
   q:"At a STOP sign, what must you do?",
   a:["Reduce speed to 10 km/h and proceed if the way is clear","Come to a complete stop, give way to all crossing traffic, then proceed when safe","Yield to traffic from the right only","Stop only if another vehicle is visible"], correct:1,
   exp:"At a STOP sign (åttakantig rödvit skylt / stoppliktskylt) you must make a complete stop regardless of whether traffic is present. After stopping, give way to all crossing traffic, then proceed when safe."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <circle cx="60" cy="60" r="52" fill="white" stroke="#cc0000" stroke-width="7"/>
  <!-- Two motorcycles side by side, crossed out -->
  <text x="42" y="72" font-size="32" text-anchor="middle">🏍</text>
  <text x="78" y="72" font-size="32" text-anchor="middle">🏍</text>
  <line x1="20" y1="20" x2="100" y2="100" stroke="#cc0000" stroke-width="7"/>
</svg>`, imgCaption:"No motorcycles riding side by side",
   q:"A red circle showing two motorcycles side by side means:",
   a:["Motorcycle racing circuit ahead","Motorcycles may not ride side by side (no two-abreast)","Motorcycle lane — two can ride abreast","No motorcycles allowed"], correct:1,
   exp:"This sign prohibits motorcycles from riding two abreast (sida vid sida). In Sweden, you are not allowed to ride two motorcycles side by side in the same lane except in specific authorised situations."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="80" rx="5" fill="#006400"/>

  <polygon points="170,40 185,28 185,52" fill="white"/>
</svg>`, imgCaption:"Green road sign",
   q:"A green rectangular road sign typically indicates:",
   a:["Motorway or national road direction sign","Forest area ahead","Environmental zone begins","Nature reserve — no riding allowed"], correct:0,
   exp:"Green signs in Sweden indicate national roads (riksvägar) or motorway (motorväg) direction information. Blue signs indicate European routes (E-roads). Brown signs indicate tourist/cultural destinations."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <polygon points="60,8 112,104 8,104" fill="white" stroke="#cc0000" stroke-width="7"/>
  <!-- Train/level crossing X -->

  <line x1="85" y1="45" x2="35" y2="85" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
</svg>`, imgCaption:"Warning: level crossing",
   q:"A warning triangle with an X (St Andrew's cross) or railway crossing symbol means:",
   a:["No crossing — road closed","Warning: level crossing ahead — be prepared to stop","Crossroads with equal priority","Railway bridge overhead"], correct:1,
   exp:"This sign warns of a level crossing (plankorsning) ahead. Begin slowing down, watch for signals, and be prepared to stop. Do not attempt to cross if any warning is showing."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="30" width="104" height="60" rx="4" fill="white" stroke="#1a1a1a" stroke-width="4"/>
  <text x="60" y="72" font-size="34" font-weight="bold" fill="#1a1a1a" text-anchor="middle" font-family="Arial">30</text>
  <text x="60" y="22" font-size="11" fill="#1a1a1a" text-anchor="middle" font-family="Arial">ZONE</text>
</svg>`, imgCaption:"Zone 30 sign",
   q:"A white rectangular sign reading 'ZONE 30' (or showing a 30 in a zone-style sign) means:",
   a:["One-off speed limit of 30 km/h at this spot only","A 30 km/h zone begins — the limit applies to all roads within the zone until the end-of-zone sign","Advisory speed of 30 km/h","School crossing — reduce to 30 km/h when children present"], correct:1,
   exp:"A zone sign applies to all roads within the marked area. You must observe 30 km/h throughout the zone until you see the end-of-zone sign (often the same sign with a diagonal line through it). Common in residential areas."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <circle cx="60" cy="60" r="52" fill="white" stroke="#cc0000" stroke-width="7"/>

  <rect x="25" y="45" width="28" height="18" rx="3" fill="#555"/>
  <rect x="67" y="55" width="28" height="18" rx="3" fill="#999"/>
  <path d="M40,45 Q40,30 67,40 L67,55" fill="none" stroke="#555" stroke-width="4" stroke-dasharray="5,3"/>
  <line x1="20" y1="20" x2="100" y2="100" stroke="#cc0000" stroke-width="7"/>
</svg>`, imgCaption:"No overtaking sign",
   q:"What does this sign mean and who does it apply to?",
   a:["No overtaking for lorries only","No overtaking for all vehicles except motorcycles overtaking bicycles","No overtaking for all motor vehicles — you may not pass vehicles travelling in the same direction","No overtaking on the left side only"], correct:2,
   exp:"The standard no-overtaking sign prohibits all motor vehicles from overtaking. It does NOT apply to bicycles overtaking bicycles, but motorcycles are motor vehicles and must comply."},

  //  BATCH 3 — Traffic Rules (situational)
  // ══════════════════════════════════════════════

  <!-- Four-way intersection from above -->

  <line x1="0" y1="100" x2="73" y2="100" stroke="white" stroke-width="2" stroke-dasharray="10,8"/>
  <line x1="127" y1="100" x2="200" y2="100" stroke="white" stroke-width="2" stroke-dasharray="10,8"/>

  <line x1="100" y1="0" x2="100" y2="73" stroke="white" stroke-width="2" stroke-dasharray="10,8"/>
  <line x1="100" y1="127" x2="100" y2="200" stroke="white" stroke-width="2" stroke-dasharray="10,8"/>

  <text x="100" y="165" font-size="10" fill="white" text-anchor="middle" font-family="Arial">No signs — uncontrolled</text>
</svg>`, imgCaption:"Uncontrolled intersection — no signs",
   q:"At this uncontrolled intersection (no signs), you are on the motorcycle coming from the left. The car approaches from above (from the top of the image). Who has priority?",
   a:["The motorcycle — it arrived at the intersection first","The car — it is coming from the right relative to the motorcycle","The motorcycle — it is the smaller vehicle","Both must stop and negotiate"], correct:1,
   exp:"The car is coming from the right relative to the motorcycle. Sweden's right-hand rule gives priority to the vehicle on the right. The motorcycle must give way to the car."},

  {cat:"Trafikregler",
   q:"You are riding on a road with a speed limit of 70 km/h. You pass a sign showing the end of a built-up area (white sign with town silhouette crossed out). What speed limit now applies?",
   a:["The 70 km/h limit continues until a new sign","70 km/h — the rural default since 2008","The national default outside built-up areas: 70 km/h unless otherwise signed","100 km/h motorway speed immediately applies"], correct:1,
   exp:"Outside built-up areas (tättbebyggt område), the default speed limit in Sweden is 70 km/h on rural roads unless a different speed limit sign is displayed. This replaced the old 90 km/h default in 2008."},

  {cat:"Trafikregler",
   q:"When must you activate your motorcycle's rear fog light (bakdimljus) in Sweden?",
   a:["Whenever it is raining","In fog or snow when visibility is less than 100 metres","At all times in poor weather conditions","Only when visibility is less than 50 metres"], correct:1,
   exp:"Rear fog lights must be used when visibility is less than 100 metres due to fog, heavy snow, or similar conditions. They must not be used in normal rain as they dazzle following drivers."},

  {cat:"Trafikregler",
   q:"You see a school bus (skolbuss) stopped with flashing amber lights in Sweden. What must you do?",
   a:["Stop behind the bus and wait until children have safely boarded/alighted","Slow to 30 km/h and pass carefully on the left","Sound your horn to warn children of your approach","The flashing amber has no legal obligation — proceed normally"], correct:0,
   exp:"When a school bus displays flashing amber lights (indicating children boarding or alighting), you must stop and not pass until it is safe to do so. Children may cross the road in front of or behind the bus."},

  {cat:"Trafikregler",
   q:"On a Swedish motorway, in which lane should you normally ride?",
   a:["The right-hand lane — the left lanes are for overtaking only","Any lane, motorcycles have special motorway rules","The centre lane for stability","The left lane for visibility to other drivers"], correct:0,
   exp:"On motorways, you should ride in the right-hand lane unless overtaking. 'Keeping right' is a legal obligation in Sweden on roads with multiple lanes in the same direction. Lingering in the left lane is not permitted."},

  {cat:"Trafikregler",
   q:"What is the minimum age to ride a moped (moped klass I) in Sweden?",
   a:["14 years","15 years","16 years","18 years"], correct:1,
   exp:"In Sweden, you must be at least 15 years old to ride a moped class I (AM licence). Class II mopeds (max 45 km/h) also require 15 years."},

  {cat:"Trafikregler",
   q:"You are approaching an intersection where you intend to turn right. A cyclist is in a designated cycle lane on your right. Who has priority?",
   a:["You do — motor vehicles have priority over cyclists","The cyclist has priority — you must give way when crossing a marked cycle lane to turn","You both have equal priority — slow down and negotiate","Only if the cycle path is marked with a solid white line"], correct:1,
   exp:"When turning across a marked cycle lane, you must give way to cyclists. This is a common accident scenario. Before turning right, always check your right-side mirror and blind spot for cyclists."},

  {cat:"Trafikregler",
   q:"What does it mean to 'ride defensively' (defensivt körsätt)?",
   a:["Riding slowly at all times","Assuming other road users may make mistakes and constantly anticipating hazards, positioning, and adjusting speed to maintain safety margins","Only overtaking when you can see the full clear road","Riding in the left lane to be more visible"], correct:1,
   exp:"Defensive riding means anticipating what could go wrong and adjusting your riding to maintain a safety margin. Assume other drivers may not see you, may brake suddenly, or may make errors. Act on those assumptions by adjusting your speed and position."},

  {cat:"Trafikregler",
   q:"You approach a road with a sign 'Enskild väg' (private road). What does this mean?",
   a:["National road — priority route","Private road — public traffic may be restricted or prohibited","One-way road","Gravel road — reduced speed limit"], correct:1,
   exp:"Enskild väg means private road. The landowner controls access. Public traffic may be prohibited entirely or restricted. On motorcycles, respect private road signs — using a private road without permission may be trespass."},

  {cat:"Trafikregler",
   q:"What is the rule about turning left at traffic lights when there is a dedicated left-turn arrow phase?",
   a:["You may turn left during any green phase","Turn left only during the dedicated left-turn arrow phase if one is displayed — do not turn during the general green if a separate phase is provided","Motorcycles may always turn left during any green","Only turn left during a flashing green arrow"], correct:1,
   exp:"If a junction has a dedicated left-turn phase (separate green arrow for left turns), you must use that phase and not turn during the general green signal. This prevents conflicts with oncoming traffic."},

  // ══════════════════════════════════════════════
  //  BATCH 3 — MC Safety (advanced)
  // ══════════════════════════════════════════════

  {cat:"MC-Säkerhet",
   q:"What is a 'highside' crash and what causes it?",
   a:["A crash caused by the front wheel sliding away","A crash where the rear tyre loses grip, then suddenly regains it, throwing the rider violently over the high side of the bike","A crash caused by excessive speed on a downhill","A side-swipe collision with another vehicle"], correct:1,
   exp:"A highside occurs when the rear wheel loses grip (slides), and then suddenly regains it while the bike is still leaned. The sudden grip can flip the bike violently, throwing the rider. It is often more dangerous than a lowside. Smooth throttle inputs prevent this."},

  {cat:"MC-Säkerhet",
   q:"Why should you inspect the road surface entering and exiting a roundabout?",
   a:["Roundabouts always have speed bumps","The entry and exit of roundabouts accumulate diesel, oil, and rubber from vehicles slowing and turning — particularly slippery when wet","Roundabout markings are harder to see on motorcycles","There are no specific hazards at roundabouts beyond normal riding"], correct:1,
   exp:"Heavy vehicles manoeuvring slowly at roundabout entries and exits deposit significant amounts of diesel and oil. These patches become extremely slippery when wet. Approach roundabouts with extra caution in wet conditions and avoid hard braking or acceleration on these surfaces."},

  {cat:"MC-Säkerhet",
   q:"What should you do to prepare your motorcycle for riding in winter conditions or after a long storage period?",
   a:["Just check the fuel and ride — modern bikes are reliable","Full inspection: tyres (pressure, condition, age), brakes, lights, battery, chain/belt, fluid levels, and test all controls before riding","Only check tyre pressure — other items are unaffected by storage","Warm up the engine for 30 minutes before riding"], correct:1,
   exp:"After storage, tyres may have flat-spotted or degraded, battery may be weak, brake fluid may have absorbed moisture, chain may be dry, and seals may have dried out. A thorough pre-season inspection prevents mechanical failures on the first rides."},

  {cat:"MC-Säkerhet",
   q:"You are approaching a humpback bridge with limited forward visibility. What is the correct approach?",
   a:["Accelerate over the bridge to minimise time spent in the blind zone","Move to the centre of the road for maximum visibility as you crest","Slow down, move to the left side of your lane, and be prepared for oncoming traffic cresting the bridge in the middle of the road","Sound your horn as you approach to warn oncoming traffic"], correct:2,
   exp:"At a humpback bridge (välvd bro), you cannot see over the crest. Reduce speed so you can stop within your visibility distance. Keep to the left — if an oncoming vehicle has drifted to the centre, you need the left margin to avoid a head-on collision."},

  {cat:"MC-Säkerhet",
   q:"What is the benefit of wearing bright or high-visibility clothing when riding a motorcycle?",
   a:["It legally exempts you from certain lighting requirements","Studies show high-visibility gear significantly increases your conspicuity to other road users, reducing the risk of SMIDSY-type accidents","It is legally required in Sweden at all times","It only helps in fog — no benefit in normal daylight"], correct:1,
   exp:"Research consistently shows high-visibility gear (yellow, orange, bright colours, or reflective materials) substantially increases the distance at which other drivers perceive motorcyclists. This is one of the most effective passive safety measures available."},

  {cat:"MC-Säkerhet",
   q:"You are riding in a group and the lead rider indicates a hazard by pointing down with their left hand. What should you do?",
   a:["Stop immediately","Pass the signal to the rider behind you and avoid the indicated area","Speed up to see what the hazard is","Change lane immediately"], correct:1,
   exp:"In group riding, signals are passed back through the group. A hand pointed downward at the road surface indicates a hazard (debris, pothole, oil, gravel). Pass the signal rearward immediately and adjust your line to avoid the hazard."},

  {cat:"MC-Säkerhet",
   q:"What is the effect of a loose or incorrectly adjusted motorcycle chain?",
   a:["Only reduces fuel economy slightly","Can cause loss of power transmission, sprocket damage, and in severe cases can derail and lock the rear wheel or damage the swingarm — potentially catastrophic","Only makes chain noise — safe to ride until next service","Reduces top speed slightly but otherwise harmless"], correct:1,
   exp:"A loose chain can jump the sprocket or snap entirely. A snapped chain can wrap around the rear wheel, locking it instantly — which at speed is very likely to cause a crash. Check and adjust chain tension within manufacturer's specifications regularly."},

  {cat:"MC-Säkerhet",
   q:"How should you manage your throttle when crossing a slippery surface (tram tracks, manhole covers, painted lines)?",
   a:["Apply throttle to maintain balance through the slippery section","Keep the throttle steady — neither accelerate nor decelerate sharply — and cross as upright as possible","Reduce throttle to engine brake gently through the hazard","Brake firmly before the slippery section and coast across"], correct:1,
   exp:"Sudden throttle changes on slippery surfaces risk breaking traction. Keep throttle steady, maintain an upright position to maximise tyre contact, and avoid braking on the surface itself. Cross perpendicular to tram tracks if possible to avoid the wheel dropping in."},

  // ══════════════════════════════════════════════
  //  BATCH 3 — Vehicle Knowledge (continued)
  // ══════════════════════════════════════════════

  {cat:"Fordonskännedom",
   q:"What is the function of a motorcycle's slipper clutch (bakåtkoppling)?",
   a:["Allows clutch engagement at higher RPM without stalling","Reduces rear wheel lockup when engine braking aggressively, especially during rapid downshifting","Automatically adjusts clutch tension for different gear ratios","Prevents the clutch from slipping in wet conditions"], correct:1,
   exp:"A slipper (or back-torque limiting) clutch automatically slips when engine braking forces try to lock the rear wheel during aggressive downshifting. This reduces the risk of a rear-wheel lockup or highside during hard braking/downshifting."},

  {cat:"Fordonskännedom",
   q:"Your front tyre develops a sudden puncture at 80 km/h. What is the safest immediate response?",
   a:["Brake hard with both brakes to stop quickly","Hold the handlebars firmly but without fighting the wobble — DO NOT brake hard. Gradually reduce throttle and let the bike slow naturally before gently applying the rear brake","Apply rear brake only and steer to the shoulder","Quickly pull in the clutch and coast to a stop"], correct:1,
   exp:"A front tyre blowout at speed causes violent wobbling. Fighting the bars or braking hard can cause a crash. Grip firmly but don't resist — let the bike find its balance. Gradually reduce speed using very gentle rear brake. Guide the bike to the shoulder."},

  {cat:"Fordonskännedom",
   q:"What does 'traction control' (TC) on a modern motorcycle do?",
   a:["Prevents the front wheel from losing grip during braking","Detects rear wheel spin and reduces engine power or applies brakes to restore traction — especially useful on wet roads","Automatically adjusts suspension for road conditions","Controls steering input to prevent over-steering"], correct:1,
   exp:"Traction control monitors wheel speed sensors. If the rear wheel spins faster than the front (indicating loss of traction), the system reduces engine output or applies braking to restore grip. It is particularly valuable in wet or slippery conditions."},

  {cat:"Fordonskännedom",
   q:"What is 'fork oil' used for in a motorcycle's front suspension?",
   a:["Lubricating the steering head bearings","Hydraulic damping fluid in the front forks — it controls the rate at which the forks compress and rebound, directly affecting handling","Engine valve lubrication when the fork is vertical","Brake fluid reservoir for the front brake"], correct:1,
   exp:"Fork oil provides hydraulic damping for the front suspension. The oil's viscosity affects how quickly the forks compress and rebound. Worn or low fork oil results in poor suspension performance and can affect handling significantly."},

  {cat:"Fordonskännedom",
   q:"What motorcycle component should you check if the bike feels 'wobbly' or imprecise in steering?",
   a:["Only the tyre pressure","Tyre pressure and condition, steering head bearings, wheel bearings, swingarm pivot bearings, and fork alignment — all can cause vague or wobbly steering","Just the front tyre — rear tyres don't affect steering feel","The chain tension only"], correct:1,
   exp:"Imprecise steering can have many causes: low or uneven tyre pressure, worn steering head bearings (most common), worn wheel bearings, bent forks, or swingarm wear. A systematic check of all these components is needed if steering feels vague."},

  {cat:"Fordonskännedom",
   q:"What is the purpose of the 'idle screw' or idle speed setting on a motorcycle?",
   a:["Sets the maximum RPM the engine can reach","Controls the minimum RPM the engine maintains when the throttle is fully closed — affects idle stability and smoothness","Adjusts the air-fuel mixture at full throttle","Controls the rev limiter"],  correct:1,
   exp:"The idle screw sets the engine's tick-over speed. Too low: the engine stalls at stops. Too high: the bike creeps or is hard to control at low speed. Correct idle speed (typically 1000-1500 RPM depending on model) is important for smooth, safe riding."},

  // ══════════════════════════════════════════════
  //  BATCH 3 — Swedish Law & Administration
  // ══════════════════════════════════════════════

  {cat:"Svensk trafiklag",
   q:"What is 'körkortstillstånd' (driving permit) and why is it needed before motorcycle training in Sweden?",
   a:["A special licence for riding motorcycles under 125 cc","The official permission from Transportstyrelsen to begin training — you must have it before taking lessons or booking tests","An annual roadworthiness permit for older motorcycles","Permission to ride during the night in the first year"], correct:1,
   exp:"Körkortstillstånd is the official permit to begin the process of obtaining a Swedish driving or riding licence. You apply to Transportstyrelsen and must have it approved (including an eye test) before starting formal training or booking any tests."},

  {cat:"Svensk trafiklag",
   q:"You hold a Category B car licence. Which category of motorcycle can you ride without additional tests?",
   a:["AM (moped) only, not any motorcycle","Any motorcycle under 125 cc","None — all motorcycle categories require separate training and testing","Category A1 without test after age 21"], correct:0,
   exp:"A Category B car licence only permits riding mopeds (AM category) without additional testing. To ride any motorcycle (A1, A2, A), you must take separate motorcycle training, risk courses, and pass the theory and practical tests."},

  {cat:"Svensk trafiklag",
   q:"What does the Swedish 'Nollvisionen' (Vision Zero) aim to achieve?",
   a:["Zero traffic offences each year","No deaths or serious injuries in road traffic in the long term — a fundamental principle of Swedish road safety policy","Zero emissions from all vehicles by 2030","Zero tolerance for any speeding — automatic licence revocation for any excess"], correct:1,
   exp:"Vision Zero (Nollvisionen), introduced in Sweden in 1997, is a road safety policy that aims to eliminate all traffic deaths and serious injuries. It was the first such policy in the world and has influenced road design, speed limits, and vehicle safety globally."},

  {cat:"Svensk trafiklag",
   q:"What is 'körförbud' (driving ban) and when can it be imposed?",
   a:["A sign indicating no driving in a zone","A legally imposed suspension of your driving licence — can be imposed for DUI, serious traffic offences, medical unfitness, or accumulation of points/violations","A temporary restriction to driving hours (no night driving)","A ban on driving certain types of vehicles"], correct:1,
   exp:"Körförbud is a legal prohibition on driving, issued by Transportstyrelsen or courts. It can be temporary or permanent, and may apply to all vehicle categories or specific ones. It is imposed for DUI, serious violations, medical conditions, or other grounds."},

  {cat:"Svensk trafiklag",
   q:"Is it legal to ride a motorcycle in Sweden with a provisional licence (körkortstillstånd) without an approved supervisor?",
   a:["Yes, during daytime hours on low-traffic roads","No — motorcycles cannot be ridden on a provisional licence at all. Motorcycles require a learner's permit (övningskörning) with an approved teacher at an accredited school","Yes if the rider has completed Risk 1 training","Yes, in rural areas away from motorways"], correct:1,
   exp:"Unlike cars, motorcycles cannot be learner-ridden privately. All motorcycle training must be conducted with an approved driving instructor at a licensed school (or through certain limited private arrangements). There is no equivalent of 'accompanied driving' for motorcycles."},

  {cat:"Svensk trafiklag",
   q:"What is the purpose of 'Risk 1' (riskettan) in Swedish motorcycle training?",
   a:["A written test on motorcycle mechanics","A mandatory course focusing on attitudes, judgement, and mental aspects of riding — particularly risks relating to alcohol, fatigue, and group dynamics","A practical test of emergency braking and swerving","A first aid course for motorcyclists"], correct:1,
   exp:"Risk 1 (riskettan) is a mandatory group session covering the mental and attitudinal aspects of riding safely: how emotions, peer pressure, tiredness, and alcohol affect judgement. It must be completed before taking the theory test."},

  {cat:"Svensk trafiklag",
   q:"What is 'Risk 2' (risktvåan) in Swedish motorcycle training?",
   a:["A second risk-attitude session similar to Risk 1","A mandatory practical course on a closed track — includes emergency braking, swerving, and riding in slippery/low-friction conditions","A motorway riding session with an instructor","A night riding session to experience reduced visibility"], correct:1,
   exp:"Risk 2 (risktvåan) is the mandatory practical safety course, typically held at a skidpan or driving safety centre. You practise emergency braking, obstacle avoidance, and riding on slippery surfaces in a controlled environment. It must be completed before the driving test."},

  // ══════════════════════════════════════════════
  //  BATCH 3 — Environment & Personal Conditions
  // ══════════════════════════════════════════════

  {cat:"Miljö",
   q:"What is the environmental benefit of proper tyre inflation on a motorcycle?",
   a:["Correct inflation reduces tyre wear only, not emissions","Correct pressure reduces rolling resistance, which directly reduces fuel consumption and CO₂ emissions — underinflated tyres significantly increase fuel use","Overinflated tyres are more efficient than the recommended pressure","Tyre pressure has no measurable effect on fuel consumption for motorcycles"], correct:1,
   exp:"Underinflated tyres increase rolling resistance, meaning the engine must work harder (and burn more fuel) to maintain speed. Even 20% under the recommended pressure can increase fuel consumption by several percent. Correct inflation saves money and reduces emissions."},

  {cat:"Miljö",
   q:"What exhaust emission standard must motorcycles meet to be registered in Sweden today?",
   a:["Euro 3","Euro 4 (implemented in 2017) or Euro 5 (2021 for new type approvals)","Euro 6 (same as cars)","No specific standard — older motorcycles are exempt permanently"], correct:1,
   exp:"Euro 5 for motorcycles was introduced in 2021 for new type approvals. Euro 4 applies to motorcycles approved from 2017. These standards limit HC, NOx, CO, and particulate emissions. Older motorcycles may retain their original registration under their approval date."},

  {cat:"Miljö",
   q:"How does anticipatory riding (förutseende körning) benefit the environment?",
   a:["It doesn't — environmental benefits only come from the vehicle's engine technology","By anticipating traffic flow and maintaining speed rather than repeatedly braking and re-accelerating, fuel consumption and emissions are significantly reduced","Only benefits the rider — no environmental effect","Only relevant at speeds above 90 km/h"], correct:1,
   exp:"Every unnecessary braking event wastes energy (as heat) that then requires fuel to rebuild speed. By reading the road ahead and adjusting speed smoothly, a skilled rider can dramatically reduce fuel consumption compared to a reactive rider."},

  {cat:"Personliga förhållanden",
   q:"You have a common cold with mild symptoms. How might this affect your riding ability?",
   a:["Not at all — a mild cold has no cognitive effects","A cold can impair concentration and reaction time due to congestion, headache, and the sedating effect of many cold remedies — assess carefully before riding","Only affects you if you have a fever over 38°C","Colds only cause physical symptoms, not cognitive impairment"], correct:1,
   exp:"Even a 'mild' cold can cause congestion (affecting balance through the inner ear), headache (distracting), and fatigue. Common cold remedies — especially antihistamines and decongestants — often cause drowsiness. Assess honestly whether you are fit to ride."},

  {cat:"Personliga förhållanden",
   q:"What is the recommended approach to riding during a period of significant life stress (job loss, relationship problems, grief)?",
   a:["Riding is a good distraction — get out on the bike to take your mind off it","Ride only on familiar local roads","Postpone non-essential rides or take extra care — emotional stress significantly narrows attention and impairs hazard perception","Stress only affects new riders — experienced riders handle it well"], correct:2,
   exp:"Psychological stress occupies mental bandwidth needed for riding. Emotional preoccupation narrows attention, reduces peripheral awareness, and slows hazard recognition. If you are dealing with significant stress, reconsider whether riding is appropriate that day."},

  {cat:"Personliga förhållanden",
   q:"You take prescription medication for a chronic condition. Your doctor says you are safe to drive. Should you also check with your pharmacist?",
   a:["No — doctor's clearance is sufficient","Yes — pharmacists can specifically advise on how the medication interacts with riding, including peak effect times, drug interactions, and whether any new side effects might have emerged","Only check if you are taking multiple medications","Only if the medication is newly prescribed"], correct:1,
   exp:"Doctors clear you to drive in general; pharmacists have specialist knowledge of drug interactions, dosing effects, and can advise on timing (e.g. 'take this dose after your ride rather than before'). Both sources of information are valuable for medication management and safe riding."},

  {cat:"Riskbedömning",
   q:"What is meant by 'escape route planning' in defensive riding?",
   a:["Planning your route home in case of mechanical failure","Constantly identifying where you could go if the situation ahead deteriorates — a path away from danger, such as a shoulder or gap in traffic","Memorising emergency phone numbers for your ride route","Checking fuel range vs distance to nearest service station"], correct:1,
   exp:"Good riders constantly think 'if that car pulls out now, where do I go?' — always identifying an available escape path. This might be a road shoulder, a gap in adjacent traffic, or room to swerve. Identifying escapes before you need them is core defensive riding technique."},

  {cat:"Riskbedömning",
   q:"You notice that a car ahead has been braking intermittently with no apparent reason. What should you do?",
   a:["Overtake quickly — the driver is clearly distracted","Increase following distance significantly — the driver may be using a mobile phone, navigating, or otherwise distracted, and could brake suddenly without warning","Sound your horn to alert them","Flash your headlights to signal they are driving erratically"], correct:1,
   exp:"Erratic braking suggests a distracted or impaired driver. Increase your following distance to give maximum reaction time. Avoid riding in their blind spot. If safe to do so, a legal overtake on a clear road removes the risk — but don't do so in a way that creates new hazards."},

  {cat:"Riskbedömning",
   q:"What is the 'System of Motorcycle Control' (or similar structured riding systems)?",
   a:["A government testing standard for motorcycle safety equipment","A structured approach to hazard management: Information, Position, Speed, Gear, Acceleration — applied in sequence to each hazard","A type of traction control software","The Swedish driving test assessment criteria"], correct:1,
   exp:"Systems like IPSGA (Information-Position-Speed-Gear-Acceleration) or similar structured methods give riders a disciplined, repeatable approach to every hazard. By working through a fixed sequence, riders ensure they have covered each factor before committing to an action."},

   q:"A speed limit sign (e.g. '50') with a diagonal line through it means:",
   a:["Maximum speed is now 50 km/h","The 50 km/h limit is cancelled — the next applicable limit or default applies","Minimum speed now 50 km/h","Warning: speed cameras in use at 50 km/h"], correct:1,
   exp:"A speed limit sign crossed by a diagonal line cancels that specific limit. After passing it, the prevailing default speed limit for that road type applies (or the next signed limit). Be aware of what the default is for the road you are on."},

   q:"A blue square sign with a white 'H' indicates:",
   a:["Highway entrance","Hospital nearby","Helicopter landing zone","Handicapped parking only"], correct:1,
   exp:"The blue 'H' sign indicates a hospital. This sign helps drivers navigate to medical facilities. In the vicinity of hospitals, be especially careful of emergency vehicles and pedestrians crossing."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

   q:"A warning triangle with a winding/curved road symbol indicates:",
   a:["Road works with temporary curves","Series of bends or winding road ahead — reduce speed accordingly","Single sharp curve ahead only","Road is under construction — follow temporary signs"], correct:1,
   exp:"This sign warns of a series of curves (serpentinväg/slingrande väg). Reduce speed well in advance. On a motorcycle, position yourself to maximise sight distance through each bend."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 140 60" xmlns="http://www.w3.org/2000/svg">

   q:"A white number on a dark (grey/black) background speed sign in Sweden typically indicates:",
   a:["The maximum speed on a motorway (motorväg) section","A recommended speed (rekommenderad hastighet) — not legally binding but strongly advised","The speed limit in an urban area at night","The minimum speed required on this road"], correct:1,
   exp:"Recommended speed signs (grey/dark background, white numbers) are advisory — they indicate the speed Trafikverket considers appropriate for the road conditions. They are not legally binding limits, but deviating from them without good reason is unwise."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
