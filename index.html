</svg>`, imgCaption:"Gravel visible on the apex of a right-hand bend",
   q:"You are entering a right-hand bend and notice gravel (grus) scattered on the apex. What is the correct response?",
   a:["Accelerate through — gravel only affects braking, not cornering","Brake hard as you approach the gravel","Reduce entry speed so you can take a wider line through the bend, staying away from the apex where the gravel is concentrated","Lean more aggressively to compensate for reduced grip"], correct:2,
   exp:"Gravel on the apex is a severe traction hazard. The correct response: reduce speed BEFORE the bend, take a wider line (positioning away from the apex — toward the outside of the bend at entry, so you naturally 'miss' the apex where gravel has accumulated). Never brake in the corner on a slippery surface."},

  {cat:"Riskbedömning",
   q:"What makes riding behind a large HGV (heavy goods vehicle) on a motorway particularly hazardous at close range?",
   a:["HGVs are louder and more distracting","At close following distances: spray severely limits vision, turbulence destabilises the motorcycle, stopping distances are vastly insufficient, and you cannot see the road ahead at all — if the HGV brakes, you have no time to react","HGVs have faster acceleration than motorcycles, creating a risk of collision","HGVs are poorly lit and hard to see in mirrors"], correct:1,
   exp:"Following an HGV closely (less than 3 seconds) on a motorway is highly dangerous: zero forward visibility, potential destabilisation from turbulence, and stopping distance far exceeds the gap. HGVs can brake from 90 km/h to a standstill in about 60 metres — less distance than many motorcycles need if they had no warning."},

  {cat:"Riskbedömning",
   q:"You notice a driver tailgating you aggressively. What is the safest response?",
   a:["Brake-check them to make them aware","Accelerate to create distance — speed up to pull away","Gradually increase your following distance from the vehicle ahead to create a larger buffer in front of you, and if safe, signal and allow the tailgater to pass","Flash your brake lights repeatedly to warn them"], correct:2,
   exp:"Brake-checking is dangerous and potentially criminal. Speeding up may not help and violates speed limits. Creating space ahead of you gives you more braking room if you need to stop, reducing the risk that the tailgater will hit you. The first priority is to safely let them pass when possible."},

  {cat:"Riskbedömning",
   q:"You are approaching a blind crest (krön) on a rural road. What is the correct lane position and speed?",
   a:["Move to the centre of the road for maximum visibility","Maintain normal speed — the crest is your problem to manage","Slow to a speed where you can stop within your visibility distance, and stay well to the left — vehicles may be in the centre of the road just over the crest","Accelerate to crest the hill quickly and extend your visibility"], correct:2,
   exp:"You cannot see what is over a blind crest. Slow to a speed where you can stop within whatever distance you can see. Stay left — oncoming vehicles may have drifted to the centre, and a motorcycle appearing suddenly over a crest gives oncoming drivers no reaction time. Treat every blind crest as potentially having a vehicle on the wrong side."},

  {cat:"Riskbedömning",
   q:"What is the 'limit point' concept in advanced motorcycle riding?",
   a:["The maximum speed rating of your tyres","The furthest point ahead where your view of the road ends (vanishing point). If it appears to stay at the same distance or move away, your speed is appropriate. If it rushes toward you, you are going too fast for the available visibility","The point at which the brakes lock","The apex of a corner"], correct:1,
   exp:"The limit point (also called vanishing point) is the furthest visible point along the road. It constantly moves as you ride. On a corner, if it recedes, the bend is opening up and your speed is safe. If it stays still or advances rapidly toward you, the bend is tightening and you must slow down. This is a fundamental advanced riding concept."},

  {cat:"Riskbedömning",
   q:"A car with a 'L' learner plate is ahead of you on a rural road. How should you adjust your riding?",
   a:["No adjustment needed — learner drivers have the same rights as experienced drivers","Increase following distance significantly — learner drivers may brake unexpectedly, stall, or make erratic steering inputs. They may also be slower on bends and hills","Flash your headlights to indicate you wish to pass","Overtake at the first opportunity to avoid the hazard"], correct:1,
   exp:"Learner drivers (körelev) are less predictable than experienced drivers. Increase your following distance and be prepared for unexpected braking, slow cornering, or hesitation at junctions. Avoid rushing or pressuring the learner — give them space to make mistakes safely."},

  // ── SWEDISH LAW — Additional verified ─────────

  {cat:"Svensk trafiklag",
   q:"Under Swedish law (Trafikförordningen 3 kap. 17§), what is the default speed limit outside a built-up area (utanför tättbebyggt område)?",
   a:["90 km/h — the old limit before 2008","70 km/h — this became the default in 2008, replacing the previous 70/90 system","80 km/h","100 km/h on roads without a centre barrier"], correct:1,
   exp:"Since 2008, the default speed limit outside built-up areas in Sweden is 70 km/h (Trafikförordningen 3 kap. 17§). This replaced the previous system. Higher limits (80, 90, 100, 110 km/h) are posted where the road standard justifies them. 70 km/h applies where no other limit is signed on rural roads."},

  {cat:"Svensk trafiklag",
   q:"What is the minimum penalty (böter) for riding a motorcycle without a valid vehicle inspection (besiktning) in Sweden?",
   a:["No penalty — inspection is voluntary","Administrative fee only — no fine for the first offence","A fine (kontrollavgift) of 1,400 SEK and a possible prohibition on further use of the vehicle until inspected","Immediate licence suspension"], correct:2,
   exp:"Riding a vehicle that has failed or overdue inspection is illegal. Transportstyrelsen can prohibit the vehicle's use. Penalties include fines (kontrollavgift) and the vehicle may be stopped from use. In practice, insurance may also be affected. The motorcycle must pass inspection before being ridden again."},

  {cat:"Svensk trafiklag",
   q:"In Sweden, what is required before you can book and take the practical motorcycle test (körprov)?",
   a:["Only the theory test needs to be passed","Theory test passed AND both Risk 1 and Risk 2 completed, all within their validity periods","Only Risk 1 needs to be completed before the test","Theory test, Risk 1, Risk 2, and a minimum of 20 documented riding hours"], correct:1,
   exp:"To book and take the körprov (practical motorcycle test), you must have: (1) passed the theory test (valid 4 months), and (2) completed both Risk 1 and Risk 2 within their validity periods. All three must be valid simultaneously on the day of the test. There is no minimum documented hours requirement, but adequate training is expected."},

  {cat:"Svensk trafiklag",
   q:"What is 'grovt oaktsam körning' (grossly negligent driving) and what is an example that could apply to a motorcyclist?",
   a:["Any speeding offence above 30 km/h over the limit","Driving with reckless disregard for others' safety — examples include extremely excessive speeding (50+ km/h over the limit), overtaking on a blind bend causing a head-on collision, or riding under severe intoxication","Any traffic violation resulting in an accident","Only applies to commercial vehicle drivers"], correct:1,
   exp:"Grovt oaktsam körning (grossly negligent driving) is a criminal offence above standard traffic violations. It applies when the driving poses extreme risk. Examples: racing at 200 km/h on a public road, overtaking blind at high speed, severe DUI. Penalties include imprisonment and licence revocation, not just fines."},

  {cat:"Svensk trafiklag",
   q:"A Swedish police officer asks to check your motorcycle during a routine traffic control. What are you legally required to present?",
   a:["Driving licence, registration certificate, and proof of insurance all physically","Driving licence — the officer can verify insurance and registration electronically via Transportstyrelsen's database","Driving licence and insurance certificate only","Only the registration plate — your identity is verified separately"], correct:1,
   exp:"You are legally required to carry and present your driving licence (körkort) when asked. Police can verify vehicle registration and insurance electronically. You are not required to physically carry the registration certificate (registreringsbevis) or insurance papers, though it is good practice. Failure to produce your licence can result in a fine."},

  // ── ENVIRONMENT — Additional ──────────────────

  {cat:"Miljö",
   q:"What is 'körstil' (riding style) most likely to reduce a motorcycle's carbon footprint on a given trip?",
   a:["Riding at maximum legal speed to minimise time on the road","Smooth acceleration, early upshifting (shifting up to the next gear before reaching peak torque), maintaining steady speed, and anticipating stops to coast rather than brake","Short bursts of full-throttle acceleration followed by coasting","Keeping the engine at exactly 3,000 RPM at all times"], correct:1,
   exp:"Anticipatory, smooth riding is the single biggest factor in reducing fuel consumption (and therefore CO₂). Early upshifting keeps RPM and throttle demand low. Coasting to stops recovers time without burning fuel. Reducing unnecessary acceleration and braking events dramatically improves efficiency."},

  {cat:"Miljö",
   q:"Sweden has 'miljözoner' classified into three classes (miljözon 1, 2, 3). Which class is the strictest?",
   a:["Class 1 — allows only Euro 3 and newer","Class 3 — the most restrictive, permitting only zero-emission (electric) vehicles","Class 2 — limits to Euro 5 and newer for motorcycles","All classes have the same restrictions"], correct:1,
   exp:"Sweden's environmental zones are classed 1-3 with 3 being the strictest. Class 1 (the most common) restricts very old, high-emission heavy vehicles. Class 2 restricts older diesel cars. Class 3 (currently not implemented nationwide) would restrict to zero-emission vehicles. As a motorcyclist, check the specific class and rules for each city you plan to ride in."},

  {cat:"Miljö",
   q:"What does 'ECO-mode' on a modern motorcycle do to reduce fuel consumption?",
   a:["Limits top speed to 90 km/h","Adjusts throttle mapping (making throttle response less aggressive/linear), and may modify shift indicator timing to encourage earlier upshifting — reducing fuel consumption and emissions","Disables certain cylinders at low load","Increases tyre pressure automatically"], correct:1,
   exp:"ECO mode typically softens the throttle response curve (same grip position = less throttle opening) to encourage smoother, more efficient riding. Some systems also adjust the shift indicator to recommend earlier upshifts. It does not limit power, but makes accessing power require more deliberate input."},

  // ── PERSONAL CONDITIONS — Additional ──────────

  {cat:"Personliga förhållanden",
   q:"You are prescribed benzodiazepines (e.g. diazepam/Valium) for anxiety. Can you ride your motorcycle?",
   a:["Yes, if the dose is low and you feel normal","No — benzodiazepines cause sedation, impaired coordination, slowed reaction time, and impaired judgement. Driving under the influence of prescription benzodiazepines at impairing doses is illegal in Sweden","Yes, but only for short distances","Yes, if taken the night before rather than the morning of riding"], correct:1,
   exp:"Benzodiazepines are classified as impairing substances for driving in Swedish law. At therapeutic doses, they cause measurable impairment of reaction time, coordination, and judgement — equivalent to or worse than moderate alcohol intoxication. Police can test for these substances, and riding while impaired by them is a criminal offence regardless of prescription."},

  {cat:"Personliga förhållanden",
   q:"How does hypoglycaemia (low blood sugar) in a diabetic rider affect riding safety?",
   a:["Only affects vision — other functions remain normal","Causes confusion, trembling, impaired concentration, and potentially unconsciousness — a hypoglycaemic episode while riding is immediately life-threatening. Diabetic riders must monitor blood sugar and carry fast-acting glucose","Only occurs in insulin-dependent diabetics and is easy to manage while riding","Has no effect on riding if the rider is experienced"], correct:1,
   exp:"Hypoglycaemia can come on rapidly and causes progressive cognitive impairment, confusion, loss of fine motor control, and potentially unconsciousness. A diabetic rider must check blood sugar before riding, never ride if blood sugar is borderline, carry glucose (gel, tablets, or juice), and stop and treat at the first signs. This condition must be reported to Transportstyrelsen."},

  {cat:"Personliga förhållanden",
   q:"After a minor concussion (hjärnskakning), when is it safe to return to riding a motorcycle?",
   a:["After 24 hours of rest","Immediately, if you feel fine","Only after medical clearance from a doctor — concussion affects reaction time, balance, and cognitive function in ways that may not be obvious to the patient. Returning too early significantly risks another impact before recovery","After one week regardless of symptoms"], correct:2,
   exp:"Concussion (commotio cerebri) causes measurable impairment of reaction time, balance, concentration, and judgement — often without the rider being aware of it. Return to riding only with explicit medical clearance. A second impact before recovery ('second impact syndrome') can be catastrophic. Never self-certify fitness to ride after a head injury."},

  // ── MC SAFETY — Winter/Adverse Conditions ─────

  {cat:"MC-Säkerhet",
   q:"Sweden allows year-round motorcycle riding. What are the primary additional hazards in autumn (höst) specifically?",
   a:["Only fog is more common — other conditions are the same","Wet leaves on the road (extremely slippery, worse than ice in some conditions), low sun angle causing glare, frost on bridges and exposed sections in mornings, reduced daylight, and increased wildlife activity at dusk/dawn","Only reduced daylight matters — surface conditions are the same","Autumn is safer than summer due to lower traffic volumes"], correct:1,
   exp:"Autumn is statistically dangerous for motorcyclists in Sweden. Wet leaf accumulation creates extremely low grip surfaces (friction comparable to ice). Morning frost forms first on bridges (luftning undertill / air cooling from below). Sun at low angles causes severe glare. Moose/deer are especially active at dawn/dusk. All require significant speed reduction and heightened awareness."},

  {cat:"MC-Säkerhet",
   q:"What is the 'sight distance' principle and how should it govern your speed?",
   a:["The distance you can see ahead determines the minimum recommended following distance","You should never ride faster than you can stop within the distance you can clearly see ahead — if a hazard appeared at the limit of your vision, you must be able to stop before reaching it","The distance at which other drivers can see your headlight","The minimum gap required before overtaking"], correct:1,
   exp:"Your speed should always be within your 'sight distance stopping distance.' If you cannot stop before reaching any hazard that might appear at the furthest point you can see, you are going too fast. This applies in fog, on bends, over crests, at night — whenever vision is limited. It is a fundamental principle of the Nollvisionen framework."},

  {cat:"MC-Säkerhet",
   q:"You are riding in a group. The leader wants to maintain formation on a wet road with tight bends. What should you do?",
   a:["Keep tight formation — group riding is safer when close together","Maintain your own safe following distance and riding speed regardless of group pressure. It is safer to fall behind or leave the group than to ride beyond your limits to keep up","Ask the leader to slow down via hand signal only","Follow the leader's speed but open up the staggered formation slightly"], correct:1,
   exp:"Group riding pressure is a known risk factor — riders push beyond their limits to maintain formation. Your safety is your own responsibility. Maintain your own safe following distance, never exceed what is safe for conditions, and if the group is going too fast for your comfort, signal and drop back. No social obligation justifies riding beyond the limit of your skills or the conditions."},

  {cat:"MC-Säkerhet",
   q:"What is the function of 'linked brakes' (CBS / Combined Braking System) on some motorcycles?",
   a:["Both brakes apply simultaneously when either lever is used — a full ABS system","When the rear brake is applied, a portion of front braking force is automatically added (and sometimes vice versa), distributing braking force optimally — designed to make braking easier for less experienced riders","CBS prevents the rear wheel from locking only","CBS automatically modulates brake pressure in corners"], correct:1,
   exp:"CBS (Combined Braking System) is common on scooters, commuter bikes, and some adventure bikes. Applying the rear brake (pedal) also activates a proportion of front braking. This distributes the braking load better than rear-only braking. It differs from ABS (which prevents lockup) — some bikes have both systems."},

  // Final batch
  {cat:"Trafikregler",
   q:"What does the Swedish term 'omkörningsförbud' mean and how is it marked?",
   a:["Mandatory stop — marked with a red circle containing a horizontal bar","No overtaking — marked with a red circle containing two cars (one overtaking), and on the road by a solid yellow centre line","One-way road — marked with a blue arrow","No U-turns — marked with a red circle and curved arrow"], correct:1,
   exp:"Omkörningsförbud means no overtaking. It is indicated by the round red sign with two cars (one darker, overtaking) and may also be indicated on the road surface by a solid yellow centre line. The prohibition ends at a matching sign with a diagonal bar or at the end of the road section. You must not overtake any moving motor vehicle during the prohibition."},

  {cat:"Trafikregler",
   q:"What is the rule about riding a motorcycle in a cycle lane in Sweden?",
   a:["Motorcycles with small engines (under 50 cc) may use cycle lanes","Motorcycles are motor vehicles and may not use cycle lanes — cycle lanes are designated for bicycles and sometimes mopeds class II, but not motorcycles","Motorcycles may use cycle lanes when the road is congested","Allowed if the motorcycle travels at cycling pace"], correct:1,
   exp:"Motorcycles (moped klass I and all motorcycles) are not permitted in cycle lanes (cykelbanor). Cycle lanes are for bicycles and in some cases mopeds class II (max 45 km/h, engine under 50 cc). A regular motorcycle is classified as a motor vehicle and must use the carriageway."},

  {cat:"Trafikregler",
   q:"What is Sweden's rule on horn use (signalhorn) in general?",
   a:["Horn may be used freely to communicate with other drivers","Horn may only be used to warn of immediate danger — use as a greeting, expression of frustration, or to alert a driver who doesn't see you at a junction is technically prohibited","Horn may be used at any time outside residential areas","No restrictions — horn use is entirely the driver's discretion"], correct:1,
   exp:"Trafikförordningen 3 kap. 56§ states that signal horns shall only be used when necessary to avoid danger. Using the horn as a greeting or out of frustration is not permitted. At night in residential areas, light signals (headlight flash) are preferred over horn. In practice, brief use to alert an oblivious driver is tolerated, but sustained or aggressive horn use is not."},

  {cat:"Fordonskännedom",
   q:"What does the 'FI' warning light (fuel injection) or engine management light (often a yellow engine symbol) indicate?",
   a:["Full inspection required at next service","The engine management system has detected a fault — stored as an error code. The bike may still run but performance, emissions, or reliability may be affected. Have it read with a diagnostic tool","Fuel injection is temporarily disabled","Low quality fuel detected — switch to premium"], correct:1,
   exp:"The engine management (EFI/MIL) warning light means the ECU has detected an out-of-range sensor reading and stored a Diagnostic Trouble Code (DTC). The bike may run normally or have reduced performance. Connect a compatible OBD/dealer tool to read the code and diagnose the fault. Do not ignore it — it may indicate a developing problem."},

  {cat:"Fordonskännedom",
   q:"How does ambient temperature affect tyre grip on a motorcycle?",
   a:["Cold tyres have better grip due to firmer rubber","Tyre grip reduces significantly in cold temperatures (below 7°C) as the rubber compound hardens and cannot conform to road surface irregularities — warming up tyres gradually before riding aggressively is essential","Temperature has no effect on modern radial tyres","Tyre grip improves linearly with temperature at all ranges"], correct:1,
   exp:"Motorcycle tyres are designed to operate within a temperature range. Below approximately 7°C, most road tyre compounds harden significantly, reducing grip. This is why the '7°C rule' for winter tyre changeover also applies to motorcycle riders. In cold conditions, warm up tyres gradually — avoid hard braking or leaning until the tyres have reached operating temperature."},

  {cat:"Riskbedömning",
   q:"What is meant by 'förväntad uppträdande' (expected behaviour) in risk awareness for motorcyclists?",
   a:["Always doing exactly what traffic signs dictate","Riding in a way that is predictable to other road users — signalling early, maintaining consistent lane position, avoiding sudden speed changes — so other drivers can anticipate your actions and react safely","Expecting other drivers to behave correctly at all times","Riding defensively by always expecting the worst from others"], correct:1,
   exp:"Predictable riding reduces accident risk for you and others. Signal your intentions early, maintain consistent position, avoid surprise lane changes or sudden braking. When other drivers can predict what you will do, they can react appropriately. Unpredictable riders (sudden lane changes, cutting between lanes) create hazards even if they are within their rights."},

  {cat:"Riskbedömning",
   q:"You are about to ride through a flooded section of road where the depth is unknown. What should you do?",
   a:["Ride through at speed to create a bow wave and maintain momentum","Turn around and find an alternative route — unknown flood depth is extremely dangerous. Even 30 cm of water can sweep a motorcycle off its feet, and deeper water can cause engine damage and total loss of control","Walk through first to test the depth, then ride","Ride through slowly in first gear with the clutch slipping"], correct:1,
   exp:"Unknown flood depth is one of the most dangerous situations a motorcyclist faces. Even shallow-looking water can conceal potholes, washed-away road surface, or debris. Water of 30-40 cm moving at speed can knock a motorcycle sideways. If in doubt, turn around. No destination is worth the risk of an unknown flood."},

  {cat:"MC-Säkerhet",
   q:"What protective equipment standard should a motorcycle helmet meet to be legally used in Sweden?",
   a:["Any approved helmet from an EU country — no specific standard required","ECE 22.06 (or the older ECE 22.05) — the United Nations standard adopted in EU regulations. Helmets must bear the ECE approval mark. SNELL and DOT standards alone are not accepted in the EU","Any helmet branded as 'motorcycle helmet' — the standard is voluntary","Swedish standard SS 879048 only"], correct:1,
   exp:"In Sweden and the EU, helmets must meet ECE Regulation 22 (currently ECE 22.06, which superseded 22.05). The ECE approval mark (a circle with 'E' and country number, plus the regulation number) must be present. SNELL-certified helmets may not bear ECE approval and are not automatically legal for road use in Sweden — check for the ECE mark specifically."},

  {cat:"Svensk trafiklag",
   q:"What is 'övningskörning' for motorcycles (MC-övningskörning) and how does it differ from car learner driving?",
   a:["Identical to car learner driving — a licensed adult can supervise","For motorcycles, private övningskörning (with a supervising friend/family member) is NOT permitted. All motorcycle training must be with an approved instructor at a licensed driving school","Övningskörning is allowed on private roads only","Övningskörning requires a minimum of 2 years car licence"], correct:1,
   exp:"Unlike car training where private övningskörning (with an approved private supervisor) is common, motorcycle training in Sweden requires an approved instructor (trafikskollärare) at a licensed school. There is no private motorcycle övningskörning system. All training, including practice rides, must be supervised by a licensed instructor."}
,

  // ══════════════════════════════════════════════

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A1-1.svg",
   imgCaption:"Vad betyder detta varningsmärke?",
   q:"Vad innebär detta varningsmärke (gul triangel med kurva till vänster)?",
   a:["Korsning med cykelväg","Kurva till vänster","Smal bro","Halt — väjningsplikt"], correct:1,
   exp:"A1-1 är varningmärket för kurva till vänster. Gula trianglar med röd kant är svenska varningmärken. Märket varnar för en skarp kurva till vänster och kräver att du anpassar hastigheten. Svenska varningmärken har gul bakgrund, till skillnad från de flesta europeiska länder som använder vit bakgrund."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A2-1.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Vad varnar detta märke (gul triangel med kurva) för?",
   a:["Kurva till höger","Vägkorsning på höger sida","Smalare väg höger","Övergångsställe"], correct:0,
   exp:"A2-1 är varningmärket för kurva till höger. Reducera hastigheten och håll dig till höger i kurvan. Som motorcyklist är det extra viktigt att bromsa in innan kurvan och inte mitt i den, eftersom lutning och bromsning samtidigt kan ge instabilitet."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A8.svg",
   imgCaption:"Vad varnar detta märke för?",
   q:"Varningmärket för ojämn väg innebär att du bör:",
   a:["Stanna och inspektera vägen","Byta fil","Sänka hastigheten — ojämn vägyta kan påverka stabiliteten","Använda dubbdäck"], correct:2,
   exp:"A8 varnar för ojämn vägyta (gropar, gupp, sprickor). För motorcyklister är detta extra kritiskt: ett plötsligt gupp vid hög hastighet kan orsaka att hjulet lyfter eller att du tappar kontrollen. Sänk hastigheten i god tid och håll ett fast grepp om styret."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A11.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Varningmärket för halt väglag i kombination med regn eller minusgrader innebär att du ska:",
   a:["Aktivera ABS och köra normalt","Avsevärt sänka hastigheten och undvika tvära inbromsningar och styrningar","Enbart bromsa med bakhjulet","Stanna tills vägbanan torkat"], correct:1,
   exp:"A11 varnar för halt väglag. Halt underlag minskar friktionen dramatiskt — bromssträckan kan bli 3–5 gånger längre. Undvik tvära manövrar. Bromsa mjukt och tidigt i rät linje. På motorcykel är mjuka rörelser avgörande på halt underlag."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A13.svg",
   imgCaption:"Vad innebär detta varningsmärke?",
   q:"Varningmärket för vägkorsning utan tilläggstavla innebär:",
   a:["Du har förkörsrätt i korsningen","Varning för korsande väg — tillämpa högerregeln om inget annat anges","Stopp obligatoriskt","Cirkulationsplats framför"], correct:1,
   exp:"A13 varnar för en korsning. Utan tilläggstavla gäller högerregeln (fordon från höger har förkörsrätt). Märket ger ingen förkörsrätt — det varnar bara att en korsning finns. Kontrollera alltid om det finns kompletterande prioritetsmärken."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A16.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Vad innebär varningmärket för cirkulationsplats?",
   a:["Cirkulationsplats (rondell) framför — anpassa hastigheten","Korsning med prioriterad väg","Slut på motorväg","Väg med tät trafik"], correct:0,
   exp:"A16 varnar för en cirkulationsplats framför. I Sverige gäller att trafik i rondellen har förkörsrätt framför infart. Sänk hastigheten, ge akt på trafiken till vänster inne i rondellen och välj rätt fil i god tid."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A17.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Varningmärket för gående utanför tättbebyggt område innebär:",
   a:["Obligatorisk gångbana börjar","Varning: gående kan förekomma på eller invid körbanan","Skolområde — max 30 km/h","Parkering för rörelsehindrade"], correct:1,
   exp:"A17 varnar för att gående kan befinna sig på eller nära körbanan. Märket kräver inte att du stannar men innebär att du ska vara extra uppmärksam och beredd att bromsa."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A19-1.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Varningmärket för barn utanför skolor. Vad gäller?",
   a:["Max 30 km/h automatiskt","Märket sänker inte hastigheten automatiskt — du måste anpassa hastigheten och vara extra alert för barn","Barn under 12 år får inte vistas utan vuxen","Skolbuss prioritet"], correct:1,
   exp:"A19-1 varnar för att barn kan finnas i närheten. Märket ger ingen automatisk hastighetsgräns — för det krävs ett separat hastighetsmärke. Barn handlar oförutsägbart och kan springa ut plötsligt."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A29-13.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Varningmärket med älgsilhuett är vanligt i Sverige. Vad bör du göra?",
   a:["Stanna direkt","Sänka hastigheten och vara beredd — kollision med älg är livsfarlig","Tuta för att skrämma djuren","Byta till halvljus omedelbart"], correct:1,
   exp:"Varningmärket för älg varnar för att älgar kan befinna sig på eller invid vägen. En vuxen älg väger 300–600 kg — en kollision är mycket allvarlig. Var extra alert i gryning och skymning."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_A34.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Varningmärket för järnvägskorsning utan bommar innebär:",
   a:["Järnvägen är nedlagd — passera utan att stanna","Obevakad plankorsning — du MÅSTE stanna och försäkra dig om att inget tåg kommer","Tåget har alltid stopp — du har förkörsrätt","Kör sakta men du behöver inte stanna"], correct:1,
   exp:"A34 varnar för en plankorsning utan bommar. Stanna alltid, titta och lyssna åt båda håll innan du passerar. Tåg har extremt lång bromssträcka och kan komma snabbt."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_B1.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Märket B1 (nedåtvänd triangel — väjningsplikt) innebär att du:",
   a:["Kan köra om det inte syns några fordon","Måste alltid stanna helt","Ska väja för all trafik på den korsande vägen","Har förkörsrätt"], correct:2,
   exp:"B1 (väjningsplikttecknet) innebär att du måste lämna företräde till all trafik på den korsande eller anslutande vägen. Du måste stanna om det krävs för att lämna företräde. Skillnaden mot B2 (stopp): B1 tillåter dig att rulla fram om det är fritt, medan B2 alltid kräver ett fullständigt stopp."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_B2.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Märket B2 (STOP) kräver att du:",
   a:["Saktar ner till 10 km/h","Stannar fullständigt vid stopplinjen och lämnar företräde åt all trafik","Väjer men behöver inte stanna om det är fritt","Stannar i 3 sekunder"], correct:1,
   exp:"B2 (stopp) innebär att du alltid måste stanna helt vid stopplinjen, oavsett om det finns trafik eller inte. Det räcker inte att sakta ned. Att köra igenom ett STOP-märke utan att stanna är ett allvarligt trafikbrott."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_B3.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Märket B3 (gul romb — förkörsväg) innebär att du:",
   a:["Alltid kan köra 70 km/h","Har förkörsrätt framför korsande och anslutande trafik","Har förkörsrätt men bara gentemot cyklister","Kan parkera här"], correct:1,
   exp:"B3 (förkörsrätt) ger dig företräde framför trafik från korsande eller anslutande vägar. Märket gäller på den sträcka som är utmärkt och upphör vid B5 (slut på förkörsrätt). Förkörsrätt är inte en frihet att köra hänsynslöst."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_B4.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Märket B4 (blå skylt med röd och vit pil — mötande fordon väjer) innebär:",
   a:["Du måste köra på höger sida av vägen","Mötande fordon ska väja för dig i den smala passagen","Du ska väja för mötande","Vägen är enkelriktad"], correct:1,
   exp:"B4 placeras i en smal passage och innebär att mötande fordon måste väja för dig. Det omvända märket sitter på andra sidan och säger åt de mötande att de ska väja. Kontrollera alltid att passagen är fri innan du kör in."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_C1.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Det röda märket C1 (röd cirkel med vit horisontell balk — förbud mot infart) innebär att:",
   a:["Farlig korsning framför","Inga fordon får köra in i vägen i denna riktning","Motortrafik förbjuden","Vägen är stängd för underhåll"], correct:1,
   exp:"C1 (förbud mot infart) förbjuder alla fordon att köra in på vägen i den riktning märket är uppsatt. Det syns ofta vid utfarter från motorvägar och enkelriktade gator. Att köra förbi ett C1-märke är ett allvarligt brott."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_C35.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Det runda röda märket med siffran 30 innebär:",
   a:["Rekommenderad hastighet 30 km/h","Lägsta tillåtna hastighet 30 km/h","Högsta tillåtna hastighet 30 km/h","Hastighetsgränsen upphör vid 30 meter"], correct:2,
   exp:"C35 är ett förbudsmärke — röd cirkel med siffra anger högsta tillåten hastighet. 30 km/h är vanligt i bostadsområden och skolzoner. Hastighetsgränsen gäller tills ny gräns anges."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_C39.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Märket C39 (slut på lokal hastighetsbegränsning) innebär att:",
   a:["Du kan köra hur fort du vill","Den lokala begränsningen upphör — nu gäller den generella hastighetsgränsen för vägsträckan","Motorväg börjar","Övningskörning förbjuden"], correct:1,
   exp:"C39 upphäver en lokal hastighetsbegränsning. Du återgår till den generella gränsen för vägen (ex. 70 km/h på landsväg, 50 km/h i tättbebyggt område) — inte att det är fritt att köra hur fort som helst."},

  {cat:"Vägmärken",
   imgUrl:"https://commons.wikimedia.org/wiki/Special:FilePath/Sweden_road_sign_D1.svg",
   imgCaption:"Vad innebär detta märke?",
   q:"Det blå runda märket D1 (cirkulationsplats — pil runt en cirkel) innebär att du:",
   a:["Kan köra rakt fram","Måste köra i anvisad riktning runt cirkulationsplatsen (medsols i Sverige)","Har förkörsrätt gentemot trafik i rondellen","Måste stanna vid infarten"], correct:1,
   exp:"D1 är ett påbudsmärke för cirkulationsplats och anger att du ska köra medsols. Trafik inne i rondellen har förkörsrätt. Välj rätt fil i god tid."},

  // ══════════════════════════════════════════════
  //  BATCH 5 — Traffic Rules (provstil)
  // ══════════════════════════════════════════════

  {cat:"Trafikregler",
   q:"Du kör i 90 km/h på en landsväg. Framför dig uppstår ett hinder plötsligt. Vad är den ungefärliga totala bromssträckan (reaktion + bromsning) på torr asfalt?",
   a:["30 meter","55 meter","80 meter","120 meter"], correct:2,
   exp:"Vid 90 km/h: reaktionssträcka ca 25 m (1 s reaktionstid) + bromssträcka ca 55 m = totalt ca 80 m på torr asfalt. På våt eller hal väg kan bromssträckan vara 2–3 gånger längre. Följeavstånd och hastighetanpassning är kritiska för motorcyklister."},

  {cat:"Trafikregler",
   q:"Du ska svänga vänster i en korsning utan trafikljus. En cyklist kommer rakt fram från motsatt håll. Vem har företräde?",
   a:["Du, eftersom du svänger på körbanan","Cyklisten, som kör rakt fram — du måste väja","Det spelar ingen roll","De har lika stor rätt"], correct:1,
   exp:"Fordon som svänger i en korsning ska alltid lämna företräde åt trafik som kör rakt fram — detta gäller även gentemot cyklister. Att svänga vänster kräver extra aktsamhet eftersom du skär tvärs över motriktad trafik."},

  {cat:"Trafikregler",
   q:"På en motorväg märker du att du fått ett däckproblem. Vad ska du göra?",
   a:["Bromsa kraftigt och stanna på körfältet","Kör sakta till närmaste avfart","Kör till vägrenen, slå på varningsblinkers och lämna fordonet bakom skyddsräcket","Stanna mitt i körfältet och ring räddningstjänst"], correct:2,
   exp:"Vid stopp på motorväg: kör till vägrenen (nödstoppsficka om möjligt), sätt på varningsblinkers, sätt ut varningstriangel minst 100 m bakom och lämna fordonet bakom skyddsräcket. Stanna aldrig i körfältet."},

  {cat:"Trafikregler",
   q:"Vad menas med defensiv körning som princip för motorcyklister?",
   a:["Att alltid ligga under hastighetsgränsen","Att förutse och anpassa sig till andras handlingar för att undvika olycka, även om du har rätt","Att undvika omkörningar helt","Att alltid hålla sig i grupp"], correct:1,
   exp:"Defensiv körning innebär att aktivt förutse risker och anpassa körning utifrån vad andra faktiskt gör — inte bara vad de borde göra. Du kan ha rätten på din sida och ändå vara i en olycka. Defensiv körning handlar om att vara redo för oförutsedda händelser."},

  {cat:"Trafikregler",
   q:"I ett övergångsställe väntar en fotgängare som uppenbart tänker gå ut. Vad gäller?",
   a:["Du kan köra om det finns plats att passera framför fotgängaren","Du måste stanna och ge fotgängaren möjlighet att passera","Du har förkörsrätt om du redan är inne i övergångsstället","Fotgängare har bara prioritet om de redan är på övergångsstället"], correct:1,
   exp:"Enligt trafikförordningen ska förare stanna för fotgängare som befinner sig i eller är på väg ut i ett övergångsställe. Det räcker inte att bara hålla uppsikt. En fotgängare som rör sig mot kanten aktiverar din skyldighet att stanna."},

  {cat:"Trafikregler",
   q:"Du kör i en filkö och ska svänga höger. En cyklist på cykelbanan till höger vill fortsätta rakt fram. Vem har företräde?",
   a:["Du, eftersom du befinner dig till vänster om cyklisten","Cyklisten på cykelbanan — du korsar cykelbanan och måste väja","Du delar lika","Det beror på vem som kom till korsningen först"], correct:1,
   exp:"När du svänger höger och korsar en cykelbana måste du lämna företräde åt cyklister som kör rakt fram. Kontrollera alltid i backspegeln och blinda fläcken till höger innan du svänger."},

  {cat:"Trafikregler",
   q:"Vad är SEE-principen som används i MC-utbildning?",
   a:["En bromsteknik","Search-Evaluate-Execute: sök faror, bedöm risk, handla — ett systematiskt sätt att processa trafikmiljön","En teknik för halt väglag","En metod för att balansera bromskraft"], correct:1,
   exp:"SEE (Search, Evaluate, Execute): Sök aktivt efter risker, Bedöm risknivå och alternativ, Utför rätt åtgärd i tid. Denna princip hjälper motorcyklister att alltid ligga steget före trafiken och undvika situationer som kräver panikbromsning."},

  {cat:"Trafikregler",
   q:"Vad innebär linjeval (contour riding) vid kurvor på MC?",
   a:["Att köra längs vägkanten","Att anpassa körlinjen för bästa sikt och säkerhetsmarginal — inte köra geometriskt mitt i filen","En teknik för grusvägar","Att köra tätt bakom lastbil"], correct:1,
   exp:"Linjeval innebär att välja en körlinje som ger bästa sikt och störst marginal. I en högerkurva kan du börja på vänster sida av filen för bättre sikt. En säker linje ger mer tid att reagera på hinder runt kurvan."},

  // ══════════════════════════════════════════════
  //  BATCH 6 — MC Safety
  // ══════════════════════════════════════════════

  {cat:"MC-Säkerhet",
   q:"Du kör på motorväg i 110 km/h. Vilket är det minsta rekommenderade följeavståndet för MC-förare?",
   a:["50 meter","Minst 3 sekunders avstånd — ca 90 meter vid 110 km/h","3 bilslängder (ca 15 m)","Det finns ingen officiell rekommendation"], correct:1,
   exp:"Rekommendationen för motorcyklister är minst 3 sekunders avstånd. Vid 110 km/h motsvarar 3 sekunder ca 92 meter. Öka avståndet ytterligare vid regn, hög vind, dålig sikt eller trötthet."},

  {cat:"MC-Säkerhet",
   q:"Vad menas med target fixation och varför är det farligt?",
   a:["Att låsa blicken på ett hinder vilket gör att hjärnan styr kroppen dit du tittar istället för att undvika det","Att stirra på hastighetsmätaren","Att följa andras linje för noga i kurvor","Att vara för fokuserad på destination"], correct:0,
   exp:"Target fixation: hjärnan omedvetet styr fordonet mot det du fixerar blicken på. Om du fastnar med blicken på ett hinder tenderar motorcykeln att styra mot det. Lösningen: titta alltid dit du vill ÅKA, inte på hindret."},

  {cat:"MC-Säkerhet",
   q:"Du kör i grupp med andra MC. Hur bör ni formera er?",
   a:["Kör parallellt sida vid sida","Kör i förskjuten formation (zipper) — varje MC förskjutet i filen med minst 2 sekunders avstånd till MC framför","Kör exakt efter varandra i samma hjulspår","Den erfarnaste kör sist"], correct:1,
   exp:"Förskjuten formation: MC nr 1 håller sig vänster i filen, nr 2 håller höger, nr 3 vänster osv. Detta ger varje förare full reaktionssträcka och bättre sikt. Minst 2 sekunders avstånd till den direkt framförvarande MC:n."},

  {cat:"MC-Säkerhet",
   q:"Vilken typ av kurva är statistiskt mest olycksdrabbad för motorcyklister på landsväg?",
   a:["Långsamma kurvor i tättbebyggt område","Raka sträckor med hög hastighet","Blinda kurvor till höger där du inte kan se igenom kurvan","Kurvorna i rondeller"], correct:2,
   exp:"Blinda högerkurvor på landsväg är överrepresenterade i MC-olycksstatistiken. Du kan inte se vad som väntar runt kurvan och MC tenderar att gå rakt ut om bromsning sker fel. Grundprincipen: bromsa in FÖRE kurvan, inte i kurvan."},

  {cat:"MC-Säkerhet",
   q:"Vad är skillnaden mellan low-side och high-side fall på MC?",
   a:["Low-side = faller mot insidan (hjulen slirar ut), High-side = MC kastar av föraren uppåt/utåt med hög kraft — oftast farligare","Low-side = framhjul slirar, High-side = bakhjul slirar","De är samma sak","High-side sker bara på cirkelbana"], correct:0,
   exp:"Low-side: hjulen slirar ut och MC faller mot insidan — relativt kontrollerat. High-side: hjulet slirar sedan griper det plötsligt tag igen och kastar föraren med stor kraft — ofta allvarligare. High-side inträffar ofta vid för tidig gaspådrag ur kurva. Mjuk gas i kurvor förebygger detta."},

  {cat:"MC-Säkerhet",
   q:"Du har kört länge och märker att du inte registrerar vad du passerat de senaste minuterna. Vad ska du göra?",
   a:["Öka hastigheten","Dricka energidryck och fortsätta","Stanna omedelbart på en säker plats och ta en paus på minst 15 minuter","Sänka hastigheten och fortsätta"], correct:2,
   exp:"Automatpilot är ett varingstecken för allvarlig trötthet. På MC kan detta vara livsfarligt — trötthet påverkar reaktionstid, balans och beslut. Stanna på närmaste rastplats och vila. Det finns ingen säker lösning som låter dig fortsätta omedelbart."},

  {cat:"MC-Säkerhet",
   q:"Vilken kroppsdel skadas statistiskt mest allvarligt vid MC-olyckor, efter huvud?",
   a:["Händer och handleder","Ben och knän — särskilt underbenet","Ryggen","Magen"], correct:1,

   exp:"Sömnbrist är en underskattad trafikfara. 17–19 timmars vakenhet ger samma nedsättning som 0,5 promille alkohol. Kronisk sömnbrist ackumuleras. På MC är trötthet extra farlig — balans och reaktion kräver konstant aktiv insats. Pausa tidigt och ofta, var 90:e minut."}


];

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let currentQuestions = [];
let currentIndex = 0;
let answers = []; // {q, correct, chosen}
let currentCategory = '';
let reviewMode = 'wrong'; // 'wrong' | 'all'
let sessions = parseInt(localStorage.getItem('mc_sessions') || '0');
let bestScore = localStorage.getItem('mc_best') || null;

const LETTERS = ['A','B','C','D'];
const CATEGORIES = [...new Set(QUESTIONS.map(q => q.cat))];

// ═══════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function confirmQuit() {
  const answered = answers.length;
  document.getElementById('quit-progress').textContent = answered + ' of ' + currentQuestions.length;
  const ov = document.getElementById('quit-overlay');
  ov.style.display = 'flex';
}

function cancelQuit() {
  document.getElementById('quit-overlay').style.display = 'none';
}

function doQuit() {
  document.getElementById('quit-overlay').style.display = 'none';
  showHome();
}

function showHome() {
  updateHomeStats();
  showScreen('home');
}

function showCategories() {
  buildCategoryList();
  showScreen('categories');
}

function showReviewAll() {
  reviewMode = 'all';
  document.getElementById('review-title').textContent = 'All Questions';
  document.getElementById('review-back').onclick = showHome;
  buildReviewList(QUESTIONS.map((q,i) => ({q, chosen: -1, correct: q.correct})));
  showScreen('review');
}

function reviewWrong() {
  reviewMode = 'wrong';
  document.getElementById('review-title').textContent = 'Wrong Answers';
  document.getElementById('review-back').onclick = () => showScreen('result');
  const wrong = answers.filter(a => a.chosen !== a.correct);
  buildReviewList(wrong);
  showScreen('review');
}

// ═══════════════════════════════════════
//  HOME STATS
// ═══════════════════════════════════════
function updateHomeStats() {
  sessions = parseInt(localStorage.getItem('mc_sessions') || '0');
  bestScore = localStorage.getItem('mc_best');
  document.getElementById('stat-total').textContent = QUESTIONS.length;
  document.getElementById('stat-sessions').textContent = sessions;
  document.getElementById('stat-best').textContent = bestScore ? bestScore + '%' : '—';
}

// ═══════════════════════════════════════
//  CATEGORIES
// ═══════════════════════════════════════
function buildCategoryList() {
  const grid = document.getElementById('cat-grid');
  const icons = {
    'Trafikregler':'🚦','Vägmärken':'🪧','MC-Säkerhet':'🛡️',
    'Fordonskännedom':'🔧','Miljö':'🌿',
    'Personliga förhållanden':'🧠','Riskbedömning':'⚠️','Svensk trafiklag':'⚖️'
  };
  const colors = {
    'Trafikregler':'rgba(255,92,26,0.15)','Vägmärken':'rgba(100,160,255,0.15)',
    'MC-Säkerhet':'rgba(255,80,100,0.15)','Fordonskännedom':'rgba(255,200,50,0.15)',
    'Miljö':'rgba(45,212,160,0.15)','Personliga förhållanden':'rgba(200,100,255,0.15)',
    'Riskbedömning':'rgba(255,180,50,0.15)','Svensk trafiklag':'rgba(100,200,255,0.15)'
  };

  let html = `<div class="cat-card cat-all" onclick="startQuiz('All',shuffleArr([...QUESTIONS]))">
    <div class="cat-icon" style="background:rgba(255,92,26,0.15)">🏍️</div>
    <div class="cat-info">
      <div class="cat-name">Full Mix</div>
      <div class="cat-count">${QUESTIONS.length} questions · all topics</div>
    </div>
  </div>`;

  CATEGORIES.forEach(cat => {
    const qs = QUESTIONS.filter(q => q.cat === cat);
    html += `<div class="cat-card" onclick="startQuiz('${cat}', shuffleArr(QUESTIONS.filter(q => q.cat === '${cat}')))">
      <div class="cat-icon" style="background:${colors[cat]||'rgba(255,255,255,0.08)'}">${icons[cat]||'📋'}</div>
      <div class="cat-info">
        <div class="cat-name">${cat}</div>
        <div class="cat-count">${qs.length} questions</div>
      </div>
    </div>`;
  });

  grid.innerHTML = html;
}

// ═══════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════
function shuffleArr(arr) {
  for(let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(catName, questions) {
  currentCategory = catName;
  currentQuestions = questions;
  currentIndex = 0;
  answers = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;
  const pct = (currentIndex / total * 100).toFixed(1);

  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-counter').textContent = `${currentIndex+1} / ${total}`;
  document.getElementById('q-progress').style.width = pct + '%';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-explanation').classList.remove('show');
  document.getElementById('next-btn').style.display = 'none';

  // Show or hide image
  let imgEl = document.getElementById('q-image-wrap');
  if (!imgEl) {
    imgEl = document.createElement('div');
    imgEl.id = 'q-image-wrap';
    imgEl.style.cssText = 'margin-bottom:20px;text-align:center;';
    const qText = document.getElementById('q-text');
    qText.parentNode.insertBefore(imgEl, qText);
  }
  if (q.img || q.imgUrl) {
    const imgContent = q.imgUrl
      ? `<img src="${q.imgUrl}" alt="Road sign" style="width:130px;height:130px;object-fit:contain;display:block;margin:0 auto;" onerror="this.style.display='none'">`
      : q.img;
    imgEl.innerHTML = `<div style="display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:220px;">${imgContent}</div>${(q.imgCaption) ? `<div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic;">${q.imgCaption}</div>` : ''}`;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }

  // Shuffle answers
  const indices = shuffleArr([0,1,2,3]);
  const shuffled = indices.map(i => ({text: q.a[i], origIdx: i}));
  const correctShuffledIdx = shuffled.findIndex(a => a.origIdx === q.correct);

  const answersEl = document.getElementById('q-answers');
  answersEl.innerHTML = '';

  shuffled.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="answer-letter">${LETTERS[i]}</span><span>${ans.text}</span>`;
    btn.onclick = () => selectAnswer(i, correctShuffledIdx, shuffled, q);
    answersEl.appendChild(btn);
  });
}

function selectAnswer(chosen, correctIdx, shuffled, q) {
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if(i === correctIdx) btn.classList.add('correct');
    else if(i === chosen && chosen !== correctIdx) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  answers.push({q, correct: correctIdx, chosen});

  document.getElementById('q-exp-text').textContent = q.exp;
  document.getElementById('q-explanation').classList.add('show');
  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('next-btn').textContent =
    currentIndex + 1 < currentQuestions.length ? 'Next question →' : 'See results →';
}

function nextQuestion() {
  currentIndex++;
  if(currentIndex < currentQuestions.length) {
    renderQuestion();
    document.querySelector('.quiz-body').scrollTop = 0;
  } else {
    showResult();
  }
}

// ═══════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════
function showResult() {
  const total = answers.length;
  const correct = answers.filter(a => a.chosen === a.correct).length;
  const pct = Math.round(correct/total*100);
  const pass = pct >= 80;

  sessions++;
  localStorage.setItem('mc_sessions', sessions);
  const prev = parseInt(localStorage.getItem('mc_best') || '0');
  if(pct > prev) localStorage.setItem('mc_best', pct);

  document.getElementById('result-icon').textContent = pass ? '🏆' : '📚';
  document.getElementById('result-score').textContent = `${pct}%`;
  document.getElementById('result-verdict').textContent = pass ? 'Well done! You passed!' : 'Keep practising!';
  document.getElementById('result-sub').textContent = `${correct} of ${total} correct · Pass threshold: 80%`;

  const fill = document.getElementById('pass-fill');
  fill.style.width = '0%';
  fill.style.background = pass ? 'var(--success)' : 'var(--error)';
  setTimeout(() => { fill.style.width = pct + '%'; }, 100);

  const wrongCount = answers.filter(a => a.chosen !== a.correct).length;
  document.querySelector('#result .result-actions button:nth-child(2)').style.display =
    wrongCount > 0 ? 'block' : 'none';

  showScreen('result');
}

function retryQuiz() {
  startQuiz(currentCategory, currentCategory === 'All'
    ? shuffleArr([...QUESTIONS])
    : shuffleArr(QUESTIONS.filter(q => q.cat === currentCategory)));
}

// ═══════════════════════════════════════
//  REVIEW
// ═══════════════════════════════════════
function buildReviewList(items) {
  const list = document.getElementById('review-list');
  if(!items.length) {
    list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0">Nothing to review here! 🎉</p>';
    return;
  }

  list.innerHTML = items.map(({q, chosen, correct}) => {
    const isWrong = chosen !== correct && chosen !== -1;
    const isAll = chosen === -1;
    return `<div class="review-item ${isAll ? '' : isWrong ? 'wrong-item' : 'right-item'}">
      ${!isAll ? `<div class="chip ${isWrong ? 'chip-fail' : 'chip-pass'}">${isWrong ? '✗ Wrong' : '✓ Correct'}</div>` : ''}
      <div class="review-q">${q.q}</div>
      ${q.a.map((ans, i) => {
        const cls = i === q.correct ? 'correct-a' : (i === (isAll ? -2 : chosen !== -1 ? q.a.indexOf(q.a[chosen]) : -2) ? 'wrong-a' : '');
        return cls ? `<div class="review-a ${cls}">${LETTERS[i]}. ${ans}</div>` : '';
      }).join('')}
      <div class="review-exp">${q.exp}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
updateHomeStats();
</script>
