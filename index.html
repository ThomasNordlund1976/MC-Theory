   q:"A warning triangle containing an animal silhouette (moose/deer) means:",
   a:["Hunting area — drive slowly","Animal crossing zone — high risk of animals on road in this area","Zoo or nature reserve nearby","No animal transport allowed on this road"], correct:1,
   exp:"Sweden has large populations of moose (älg) and deer (rådjur). Collisions with these animals at speed are often fatal for motorcyclists. Slow down in marked zones, especially at dawn, dusk, and night. Look for eye reflections at the roadside."},

  // Traffic Rules
  {cat:"Trafikregler",
   q:"You are riding at night with your headlight on dipped beam. When must you switch to full beam (high beam)?",
   a:["Never — full beam is only for emergency use","Whenever possible on unlit roads with no oncoming traffic, to maximise visibility","Only on motorways where the speed limit exceeds 100 km/h","Only in rural areas, not in towns"], correct:1,
   exp:"Use full beam on dark roads whenever it will not dazzle other road users. Good visibility at night is critical for motorcyclists. Switch to dipped beam when approaching oncoming vehicles or following another vehicle closely."},

  {cat:"Trafikregler",
   q:"What is 'körfältsbyte' (lane changing) and what must you do before changing lanes?",
   a:["Changing lanes is prohibited on all Swedish roads","Check mirrors, signal your intention, check blind spots, and only move when safe — you must give way to vehicles already in the target lane","Signal and move — vehicles behind must give way","Lane changes only require signalling on motorways"], correct:1,
   exp:"Before changing lanes: check mirrors for following traffic, signal early, check your blind spot (motorcycles have significant blind spots), ensure the target lane is clear, then move smoothly. Vehicles already in the target lane have priority."},

  {cat:"Trafikregler",
   q:"In Sweden, where is it prohibited to overtake?",
   a:["Only in tunnels and on bridges","At pedestrian crossings, level crossings, intersections (in most cases), road crests, tight bends, and where no-overtaking signs are displayed","Only where a solid centre line exists","Overtaking is permitted anywhere on a motorcycle if you can see the road is clear"], correct:1,
   exp:"Overtaking is prohibited at pedestrian crossings, level crossings, most intersections, over road crests, on sharp bends, and where signs or road markings prohibit it. On a motorcycle, the same rules apply as for all motor vehicles."},

  {cat:"Trafikregler",
   q:"What does 'företrädesrätt' (right of way/priority) mean in Swedish traffic law?",
   a:["The right to travel at any speed on priority roads","The legal obligation of one road user to yield to another in a given situation — determined by road type, signs, and traffic rules","Priority parking rights for certain vehicles","The right to use bus lanes and cycle lanes"], correct:1,
   exp:"Företrädesrätt defines who must yield in a traffic situation. It is determined by road type (priority road vs minor road), traffic control devices (signs, lights), and rules (right-hand rule, roundabout rules). Understanding who has priority prevents accidents."},

  {cat:"Trafikregler",
   q:"You are on a road with a 70 km/h limit and you want to overtake a slow tractor. The road ahead appears clear for 500 metres. What else must you check before overtaking?",
   a:["Only that no oncoming traffic is visible","That no overtaking is prohibited (no solid centre line, no no-overtaking sign), the road ahead is genuinely clear, no intersections ahead, your own speed and the tractor's speed, and that you can complete the overtake safely before any hazard","That the tractor driver sees you and acknowledges your intention","Only that your mirror shows no one is overtaking you at the same time"], correct:1,
   exp:"A complete pre-overtake check: Is overtaking permitted? Is the road clear far enough ahead? No junctions or pedestrian crossings ahead? Can I complete the overtake before any hazard? Is my own speed appropriate? Only overtake when all checks are positive."},

  {cat:"Trafikregler",
   q:"What must you do if an emergency vehicle (ambulance, fire engine, police) approaches with lights and siren activated?",
   a:["Accelerate to clear the road quickly","Move to the right and slow down or stop to allow the emergency vehicle to pass — do not block its path","Maintain your position — it is the emergency vehicle's job to find a way through","Sound your horn to warn other road users"],  correct:1,
   exp:"You must give way to emergency vehicles using blue lights and sirens. Move to the right edge of the road, reduce speed, and stop if necessary. Do not follow emergency vehicles through red lights or closed roads."},

  {cat:"Trafikregler",
   q:"What is the correct procedure for a motorcycle when approaching a 'Cykelbana korsas' (cycle path crossing) sign?",
   a:["Treat it like a normal road — you have priority","Slow down and give way to cyclists on the crossing","Cyclists must stop for motor vehicles — maintain your speed","Only give way if a cyclist is visible and moving"], correct:1,
   exp:"At a cycle path crossing, motor vehicles must give way to cyclists. This applies even if the cyclist is approaching from the side and the crossing is not marked as a pedestrian crossing. Always expect cyclists at these crossings."},

  // MC Safety
  {cat:"MC-Säkerhet",
   q:"Why is it important to 'look through' corners rather than at the road immediately in front of the wheel?",
   a:["It helps judge speed more accurately","Looking through the corner allows you to see hazards earlier, sets up correct head position for balance, and through target fixation principles, naturally steers the motorcycle where your eyes point","It is a technique only for advanced riders — beginners should look at the road surface","It reduces eye fatigue during long rides"], correct:1,
   exp:"Looking through a corner gives maximum information about what's ahead. Your body and motorcycle naturally follow your line of sight (target fixation). Looking late into a corner also allows late steering inputs for a better line."},

  {cat:"MC-Säkerhet",
   q:"You are following a large vehicle and cannot see past it. How should you position yourself?",
   a:["Stay directly behind for maximum protection from wind and hazards","Move slightly to one side (usually left) of the lane to maximise forward visibility past the vehicle, and increase following distance","Overtake immediately — following a large vehicle is always dangerous","Stay in the centre of the lane and rely on the large vehicle's brake lights"], correct:1,
   exp:"Large vehicles block your view of hazards ahead. Move to the side of your lane that gives the best view past the vehicle. Increase following distance — if the large vehicle brakes suddenly, you need more time to react. Plan to overtake at the first safe opportunity."},

  {cat:"MC-Säkerhet",
   q:"What is 'speed wobble' (tankslapper) and what should you do if it occurs?",
   a:["Normal vibration at highway speeds — accelerate through it","A rapid oscillation of the handlebars caused by aerodynamic instability, wheel imbalance, or tank bag weight — grip firmly but without fighting it, gradually reduce speed","Apply both brakes simultaneously to stop the oscillation","Immediately apply rear brake to transfer weight rearward"], correct:1,
   exp:"Speed wobble is a rapid handlebar oscillation. Gripping tightly and fighting it can worsen it. Hold firmly but relax your arms, gradually roll off the throttle, and let the speed decrease naturally. Do not brake suddenly. Investigate the cause afterward (wheel balance, steering damper, etc.)."},

  {cat:"MC-Säkerhet",
   q:"How does passenger (pillion rider) weight affect motorcycle handling?",
   a:["No significant effect on modern motorcycles","Significantly increases total weight, affects suspension compression, raises the centre of gravity, changes handling characteristics, and increases braking distances — suspension and tyre pressure should be adjusted for two-up riding","Only affects fuel consumption","Only the rear suspension needs adjustment for a pillion rider"], correct:1,
   exp:"A pillion rider changes the motorcycle's dynamics substantially. Adjust rear suspension preload for the extra weight. Tyre pressures may need increasing. Allow for longer braking distances. Accelerate and corner more gently. Brief the pillion on how to sit and hold on before riding."},

  {cat:"MC-Säkerhet",
   q:"What is the safest way to corner on a wet road?",
   a:["Lean further to maintain the same speed as in dry conditions","Reduce speed before the corner, use a more upright body position to maximise tyre contact, avoid sudden throttle or brake inputs, and increase safety margins","Apply rear brake in the corner to control speed","Avoid braking before corners — coast through them instead"], correct:1,
   exp:"In wet conditions, tyre grip is significantly reduced. Enter corners slower than you would in dry conditions. A more upright position maximises tyre footprint. Smooth inputs — no sudden throttle, braking, or steering — prevent traction loss. Always reduce speed before the corner, not in it."},

  {cat:"MC-Säkerhet",
   q:"Why is it important to 'scan' (constantly move your eyes) when riding rather than fixing your gaze?",
   a:["Scanning is a technique only for night riding","Constant eye movement keeps your vision fresh and prevents target fixation. It also allows earlier hazard detection across your full field of view, including peripheral vision","It is not important — focusing on the road ahead is more effective","Only necessary in built-up areas with many junctions"], correct:1,
   exp:"Static gaze causes the eyes to lose sensitivity and misses peripheral hazards. Constant scanning — near to far, side to side, mirrors — keeps the visual system active, detects hazards earlier, and prevents dangerous target fixation on a single point."},

  {cat:"MC-Säkerhet",
   q:"At what point in a corner is braking most dangerous?",
   a:["Before the corner entry","At the midpoint of the corner when lean angle is maximum","During corner exit when accelerating","Immediately after cresting the corner's apex"], correct:1,
   exp:"Maximum lean angle means the tyre's friction circle is most committed to cornering grip. Any additional braking force at this point exceeds the available traction and causes a slide or fall. Braking should be done before corners; if you must brake during a corner, do so very gently while reducing lean angle."},

  {cat:"MC-Säkerhet",
   q:"What is meant by 'two-second plus' rule for motorcyclists vs cars?",
   a:["Motorcycles need exactly twice the following distance of cars","Because motorcycles can stop faster than cars but following drivers may not react in time, a minimum 2-3 second gap is recommended — but also check behind before braking","Motorcycles need less following distance due to better braking","The two-second rule only applies to cars"], correct:1,
   exp:"While motorcycles can brake faster than many cars, a following car driver may not be watching closely enough to react to your emergency stop. This means you should maintain a 2-3 second following gap ahead, AND be aware of what's behind you before emergency braking."},

  // Vehicle Knowledge
  {cat:"Fordonskännedom",
   q:"What is the purpose of the 'choke' (or cold start enricher) on older carburettor motorcycles?",
   a:["It reduces air intake to provide a richer fuel-air mixture for cold starting","It increases air flow for better performance in cold weather","It preheats the fuel before ignition","It controls the idle speed only"], correct:0,
   exp:"On carburettor-equipped bikes, the choke restricts air to create a rich mixture needed for cold starting. Modern fuel-injected bikes manage this automatically. On a carb bike, close choke gradually as the engine warms up — riding with full choke causes fuel waste and carbon buildup."},

  {cat:"Fordonskännedom",
   q:"What does the oil pressure warning light (often red with oil can symbol) indicate when it illuminates while riding?",
   a:["Time for an oil change at next convenience","Critical oil pressure loss — stop the engine immediately to prevent severe damage","Low oil level — add oil when convenient","Normal at low idle speed"], correct:1,
   exp:"An oil pressure warning while riding is a critical emergency. Stop the engine as soon as safely possible. Riding with no oil pressure can destroy an engine in seconds. Do not restart until the cause is found and rectified."},

  {cat:"Fordonskännedom",
   q:"How does the angle of a motorcycle's handlebars (bar height/sweep) affect riding ergonomics and control?",
   a:["Only affects aesthetic appearance","Higher bars shift weight rearward, reducing wrist strain but increasing wind drag; lower bars shift weight forward and improve high-speed aerodynamics but increase wrist/neck strain — affects control input leverage and fatigue","Bar position has no effect on handling, only comfort","Lower bars always provide better control at all speeds"], correct:1,
   exp:"Bar position affects the rider's weight distribution, leverage on the handlebars, and aerodynamics. Sport bikes use low bars for forward weight and aerodynamics; touring and adventure bikes use higher bars for comfort. The correct position for a given motorcycle is part of its design."},

  {cat:"Fordonskännedom",
   q:"What does a seized or binding brake caliper cause?",
   a:["Improved braking — constant light brake application","Brake drag — the pad rubs the disc continuously, causing heat buildup, reduced fuel economy, premature pad and disc wear, and potential brake fade or fire","Only a slight reduction in braking performance","The brake lever becomes harder to pull"], correct:1,
   exp:"A seized caliper that doesn't fully release causes constant brake drag. Symptoms include heat from the brake area, smell of burning, pulling to one side, reduced fuel economy, and eventually brake fade or fire. This is a serious mechanical fault requiring immediate attention."},

  {cat:"Fordonskännedom",
   q:"What is the recommended break-in procedure for a new motorcycle tyre?",
   a:["Full speed immediately — modern tyres require no break-in","Ride gently for approximately 100-200 km, gradually increasing lean angle — new tyres have mould release agent on the surface that reduces grip until worn off","Only the rear tyre needs a break-in period","Ride in the rain first to wash off release agents"], correct:1,
   exp:"New tyres have mould release compounds on their surface that significantly reduce grip. Ride conservatively for the first 100-200 km, avoiding maximum lean angles, hard braking, or aggressive acceleration until the surface has worn to bare rubber. Many crashes involve new tyres."},

  {cat:"Fordonskännedom",
   q:"What is the function of the motorcycle's 'swingarm' (bakbensarm)?",
   a:["The front fork suspension component","The component that holds the rear wheel and allows it to move up and down with the suspension while being driven by the chain/belt/shaft","The rear foot peg mounting bracket","The frame section connecting seat to rear wheel"], correct:1,
   exp:"The swingarm is a pivoting arm that holds the rear wheel and allows vertical wheel movement for suspension travel, while maintaining the wheel's alignment and transmitting drive forces. It is a critical structural component; any play in the swingarm pivot is a serious safety issue."},

  // Swedish Law
  {cat:"Svensk trafiklag",
   q:"What is the Swedish law regarding use of a mobile phone while riding a motorcycle?",
   a:["Hands-free devices are permitted while riding","Any use of a handheld phone while riding is prohibited and subject to fine (800 SEK). This includes talking, texting, browsing — the phone must be mounted in a holder to use GPS legally","Only texting is prohibited — calls are legal","Bluetooth earpieces are prohibited in Sweden"], correct:1,
   exp:"Using a handheld phone while riding is illegal in Sweden (800 SEK fine). A phone used for GPS must be mounted in a holder and not handled while moving. Distraction from a phone is one of the leading causes of accidents. Many riders use Bluetooth headsets for calls — these are legal if they don't impair hearing of traffic sounds."},

  {cat:"Svensk trafiklag",
   q:"What is 'smitning' (hit and run) and what are the consequences in Sweden?",
   a:["A minor violation resulting in a fine only","Leaving the scene of an accident where injury or significant damage has occurred — a serious criminal offence. Penalties include prison up to 2 years, licence revocation, and civil liability","A parking violation","Only applies to accidents with personal injury, not property damage"], correct:1,
   exp:"Smitning (the Swedish term for hit-and-run) is a serious criminal offence. You must stop, assist injured parties, exchange details, and report to police. Leaving the scene — even for 'minor' damage — can result in imprisonment and permanent licence loss. Insurance may also be invalidated."},

  {cat:"Svensk trafiklag",
   q:"Sweden has 'automatisk trafiksäkerhetskontroll' (ATK) — automated speed enforcement. What should you know about this?",
   a:["ATK only photographs the front of vehicles — motorcycles (which show rear plates) are not caught","ATK cameras can be positioned to capture rear or front of vehicles. Motorcycles are subject to the same enforcement as all vehicles. Ignoring ATK fines escalates to criminal prosecution","ATK only applies on motorways","Motorcycle licences are suspended for the first ATK offence"], correct:1,
   exp:"Sweden's speed cameras (ATK) are placed on high-risk roads. They can be configured to capture rear-facing (for motorcycles) or front-facing. Fines are issued by post. Ignoring them escalates. Speed camera locations are intentionally not always marked — ride to the limit everywhere."},

  {cat:"Svensk trafiklag",
   q:"What documentation must you carry when riding a motorcycle in Sweden?",
   a:["Only your driving licence","Driving licence and proof of insurance (trafikförsäkringsbevis) — registration certificate (registeringsbevis) is not required to be carried but police can verify it electronically","Driving licence, registration certificate, and insurance certificate","Driving licence only — all other documentation is digital"], correct:0,
   exp:"You must carry your driving licence. Proof of insurance and vehicle registration can be verified electronically by police. However, it is good practice to carry the insurance certificate. If stopped without your licence, police may issue a fine."},

  {cat:"Svensk trafiklag",
   q:"Under what circumstances may a Swedish driving licence be confiscated immediately at the roadside (omhändertagande av körkort)?",
   a:["For any traffic violation","For DUI (alcohol or drugs), extremely dangerous driving, or when there are strong grounds to believe the licence will be revoked — police can confiscate it immediately","Only by court order","Only for DUI — not for other violations"], correct:1,
   exp:"Swedish police can confiscate a driving licence on the spot (omhänderta körkortet) in cases of DUI, seriously dangerous driving, or where there are clear grounds for revocation. The case is then referred to Transportstyrelsen for a formal decision."},

  // Environment
  {cat:"Miljö",
   q:"What is a 'miljözon' (environmental zone) in Swedish cities and how does it affect motorcyclists?",
   a:["A zone where only electric vehicles are permitted","An area where vehicles meeting certain emission standards may be restricted or have access limited — motorcycles meeting Euro 3 or higher standards are generally unaffected, but older, high-emission bikes may be restricted","A zone with a 30 km/h speed limit only","A car-free zone where motorcycles are always permitted"], correct:1,
   exp:"Environmental zones (miljözoner) in Swedish cities restrict access for high-emission vehicles. The requirements depend on the zone class. Most modern motorcycles (Euro 3+) are unaffected. Very old motorcycles with high emissions may face restrictions. Check the specific zone rules in each city."},

  {cat:"Miljö",
   q:"How does motorcycle engine displacement relate to fuel consumption and CO₂ emissions?",
   a:["Larger displacement always means higher emissions — avoid large bikes","Displacement alone doesn't determine consumption — how the engine is used matters more, but generally larger engines use more fuel and produce more CO₂ when ridden similarly","Small displacement (125 cc) bikes always have lower emissions than larger ones","CO₂ emissions from motorcycles are not regulated"], correct:1,
   exp:"A 1000 cc bike ridden gently may consume less fuel than a 250 cc bike ridden hard. Riding style, gear selection, speed, and load all affect consumption. However, for equivalent riding styles, larger displacement generally correlates with higher fuel use and CO₂."},

  // Personal Conditions
  {cat:"Personliga förhållanden",
   q:"What effect does cannabis (marijuana) have on motorcycle riding ability?",
   a:["Small amounts have no effect on experienced riders","Cannabis impairs reaction time, depth perception, and tracking ability for 3-4 hours after smoking, and potentially longer. It also impairs the ability to judge one's own impairment. Any use before riding is illegal and dangerous","Only heavy users are impaired","It primarily affects new riders — experienced riders compensate effectively"], correct:1,
   exp:"Cannabis impairs the cognitive functions essential for riding: reaction time, tracking, depth perception, and risk assessment. It also causes overconfidence in one's ability. THC can remain detectable in blood for days, but impairment occurs primarily in the hours after use. Riding after cannabis use is illegal under Swedish law."},

  {cat:"Personliga förhållanden",
   q:"You have just passed your theory test and have your first practical lesson. What should your primary focus be?",
   a:["Reaching target speeds as quickly as possible to get the feel of the motorcycle","Basic control: clutch control, balance, smooth braking, and situational awareness at low speeds — build skills methodically before adding complexity","Memorising all traffic rules you just learned for the theory test","Learning to filter through traffic to be efficient"], correct:1,
   exp:"New riders should focus on fundamental control at low speeds: smooth clutch engagement, balancing, gentle braking. All other skills build on these fundamentals. Rushing skill development creates gaps that cause accidents later. The best riders have the most solid fundamentals."},

  {cat:"Personliga förhållanden",
   q:"What is 'inattentional blindness' and how does it affect motorcycle safety?",
   a:["A visual defect common in older drivers","The phenomenon where the brain fails to perceive unexpected objects it is not actively looking for — this explains why drivers 'look but don't see' motorcycles","A type of glare from oncoming headlights","A distraction caused by in-helmet audio systems"], correct:1,
   exp:"Inattentional blindness is a well-documented cognitive phenomenon. A driver scanning for cars may literally not perceive a motorcycle even if they look directly at it. This is the neurological basis of SMIDSY accidents. Motorcyclists must ride assuming they are invisible and take responsibility for making themselves noticed."},

  // Risk Awareness
  {cat:"Riskbedömning",
   q:"What specific risks do tram lines (spårvagnsräls) present to motorcyclists?",
   a:["No specific risk — modern tram lines are flush with the road surface","The metal rails become extremely slippery when wet, and tyres can drop into the groove and deflect suddenly — always cross at an angle as close to perpendicular as possible","Only the electric current is a hazard","Only relevant for older, narrow tyres"], correct:1,
   exp:"Tram rails are very slippery when wet. A tyre dropping into the rail groove can deflect the wheel suddenly. Always cross rails at as perpendicular an angle as possible (close to 90°). Never follow the track — cross it and get away from it. Reduce speed before crossing."},

  {cat:"Riskbedömning",
   q:"You are riding in a group and you notice the rider ahead braking hard for an unseen hazard. What is the correct response?",
   a:["Brake to match the rider ahead's brake light","React immediately to the brake light — apply your brakes and trust your eyes to find the hazard as you slow, rather than waiting to see the hazard yourself","Only brake if you personally see the hazard","Sound your horn to warn riders behind you before braking"], correct:1,
   exp:"In a group, react to brake signals from the rider ahead — they have seen something you haven't yet. Apply brakes immediately. A split-second delay waiting to see the hazard yourself reduces your reaction time by the gap time to that hazard."},

  {cat:"Riskbedömning",
   q:"Why is riding in another vehicle's blind spot particularly dangerous for motorcyclists?",
   a:["You get less shelter from the wind","The driver cannot see you and may change lanes or turn without warning — a standard car lane change into a motorcycle is almost certainly a collision","The engine sounds differently in a blind spot","You are more exposed to road spray from the vehicle"], correct:1,
   exp:"Every vehicle has zones the driver cannot see through mirrors. A driver seeing a clear lane will move into it without knowing you are there. Motorcycles are small enough to be entirely in a blind spot. Never linger in blind spots — pass decisively or drop back to a visible position."},

  {cat:"Riskbedömning",
   q:"What is 'sun glare' (solbländning) and how should you manage it while riding?",
   a:["Only relevant in summer — not a winter hazard","Sun glare can reduce your visibility to near zero temporarily and can prevent other drivers from seeing you. Slow down when riding into direct sun, use a tinted visor or sunglasses, and allow extra time for cars emerging from shaded areas","A minor inconvenience solved by squinting","Only affects the first and last hour of daylight"], correct:1,
   exp:"Sun at low angles (especially in autumn and spring in Sweden) can be blinding. Other drivers may not see you when looking into sun. Reduce speed, increase following distance, and ensure your visor is clean. Consider that vehicles emerging from shadows into sunlit roads may have temporarily impaired vision."},

  {cat:"Riskbedömning",
   q:"A car ahead of you signals left but appears to be slowing for no apparent reason. What should you consider?",
   a:["Sound your horn — the driver may not know their indicator is on","The driver may be turning into a hidden driveway, stopping for a pedestrian, or parking — increase following distance, cover your brakes, and be prepared to stop","Pass on the right immediately — the car is going left","Flash your headlights to indicate you wish to overtake"], correct:1,
   exp:"A slowing vehicle with a left signal has many possible intentions: turning into a driveway, stopping for a pedestrian, parking. Do not overtake until you understand the situation. Increase following distance and be prepared for any of these scenarios."},

  {cat:"Riskbedömning",
   q:"What is the most common cause of single-vehicle motorcycle accidents on rural roads in Sweden?",
   a:["Mechanical failure","Running wide in corners due to excessive entry speed or misjudged corner radius — often combined with fatigue, alcohol, or unfamiliar roads","Gravel on the road","Wildlife collisions"], correct:1,
   exp:"Running wide in corners (not taking the corner correctly and leaving the road) is the most common single-vehicle motorcycle accident. It is usually caused by entering too fast, failing to read the corner's tightening radius, or loss of concentration. Anticipate corner severity and enter at a speed where you have reserve grip."},

  // Vehicle Knowledge
  {cat:"Fordonskännedom",
   q:"What is the purpose of the 'throttle position sensor' (TPS) on a fuel-injected motorcycle?",
   a:["It controls fuel pump pressure","It tells the ECU (engine control unit) how far the throttle is opened, allowing the ECU to calculate the correct fuel injection amount for smooth power delivery","It controls idle speed","It monitors engine temperature and adjusts throttle accordingly"], correct:1,
   exp:"The TPS is a critical sensor for fuel injection systems. It reports throttle position to the ECU, which calculates appropriate fuel and ignition timing. A faulty TPS can cause erratic power delivery, poor idle, or engine management warning lights."},

  {cat:"Fordonskännedom",
   q:"What does TPMS (Tyre Pressure Monitoring System) do on motorcycles equipped with it?",
   a:["Automatically inflates tyres to the correct pressure","Continuously monitors tyre pressure and warns the rider if a tyre falls below a safe threshold — allowing early detection of slow punctures before they cause loss of control","Controls tyre temperature in cold weather","Measures tread depth and warns when tyres need replacement"], correct:1,
   exp:"TPMS sensors in the wheels transmit pressure data to a receiver. The system warns the rider when pressure drops significantly. This is valuable because a slow puncture may not be immediately felt but can cause handling problems at speed. Even without TPMS, check tyre pressure before every ride."},

  {cat:"Fordonskännedom",
   q:"Your motorcycle starts pulling to one side under braking. What could cause this?",
   a:["Normal behaviour on roads with a camber","Seized or partially seized brake caliper on the pulling side, uneven brake pad wear, or misaligned wheel — all require immediate inspection and correction","Slight tyre pressure difference between sides","Wind from one side during braking"], correct:1,
   exp:"One-sided pulling under braking suggests an uneven braking force: seized caliper, stuck piston, worn pad, or wheel misalignment. This can cause loss of control, especially during emergency braking. Stop riding and have it inspected before continuing."},

  {cat:"Fordonskännedom",
   q:"What is the recommended action when you notice your motorcycle is consuming significantly more fuel than usual?",
   a:["Add a fuel additive and monitor for another 1000 km","Investigate potential causes: air filter may be clogged, spark plugs fouled, tyre pressure low, valve adjustment needed, or fuel injectors/carburettor need attention","Increase tyre pressure to reduce rolling resistance","It is normal variation — no action needed"], correct:1,
   exp:"Increased fuel consumption is a symptom, not a problem in itself. Common causes: clogged air filter (restricts air, richens mixture), worn spark plugs, low tyre pressure, stuck choke, or a mechanical issue. Address the cause — running rich also increases engine wear."},

  {cat:"Fordonskännedom",
   q:"What does 'wet clutch' mean in the context of motorcycle transmissions?",
   a:["A clutch that has been contaminated with water","A clutch that runs in engine oil (as opposed to a dry clutch outside the engine cases) — most motorcycles use wet clutches, which are self-lubricating and less prone to sudden engagement","A clutch used specifically in wet/rainy conditions","A performance upgrade for track use"], correct:1,
   exp:"Most motorcycle clutches are 'wet' — they run submerged in engine oil. This keeps them cool, reduces wear, and gives smoother engagement. The friction characteristics of wet clutches depend on the correct type of engine oil (some oils, particularly those with 'energy conserving' ratings, can cause clutch slip)."},

  // Swedish Law
  {cat:"Svensk trafiklag",
   q:"What is 'trafiknykterhet' (traffic sobriety) in Swedish law?",
   a:["Zero alcohol tolerance for all drivers","The broader principle that drivers must not be impaired by any substance — including alcohol, drugs (including prescription), or any other substance affecting ability to drive safely","A test conducted at the roadside","A training programme for DUI offenders"], correct:1,
   exp:"Trafiknykterhet encompasses the requirement to be fully sober and unimpaired when driving. It covers alcohol (limit 0.2 ‰), illegal drugs (zero tolerance), and legal medications that impair ability. All are covered by the same law framework."},

  {cat:"Svensk trafiklag",
   q:"In Sweden, what is 'körkortsåterkallelse' (licence revocation) and how does it differ from 'körförbud'?",
   a:["They are the same thing — different words for the same action","Körkortsåterkallelse is a formal revocation of the licence by Transportstyrelsen after investigation; körförbud is often a temporary measure while revocation is being processed","Körkortsåterkallelse is a court order; körförbud is police-issued","Körkortsåterkallelse is permanent; körförbud is always temporary"], correct:1,
   exp:"Körförbud (driving prohibition) is often issued immediately pending investigation — you cannot drive during this period. Körkortsåterkallelse is the formal revocation of the licence by Transportstyrelsen after due process. You may appeal revocation. After revocation, you must reapply and potentially retake tests to regain a licence."},

  {cat:"Svensk trafiklag",
   q:"You are visiting Sweden with a Croatian (EU) motorcycle licence. What are your rights?",
   a:["You must obtain a Swedish licence within 30 days","You can ride in Sweden using your Croatian EU licence without conversion — EU licences are mutually recognised across all member states","You must take a Swedish theory test within 90 days","You can ride but only on non-motorway roads"], correct:1,
   exp:"EU/EEA driving licences are mutually recognised throughout the EU. Your Croatian licence is valid for riding in Sweden. If you become a permanent Swedish resident, you may eventually need to exchange it for a Swedish licence, but for visits and short-term stays, it is fully valid."},

  {cat:"Svensk trafiklag",
   q:"What is the legal requirement for motorcycle exhaust noise in Sweden?",
   a:["No specific noise limit — only emissions are regulated","Motorcycles must not exceed the noise level they were type-approved at (stamped on compliance plate). Aftermarket exhausts that increase noise above type approval level are illegal for road use","Noise limits only apply in residential areas","Any exhaust modification is legal if it is marked 'road legal' in its country of manufacture"], correct:1,
   exp:"Motorcycles must comply with the noise limit they were type-approved for. Fitting an aftermarket exhaust that exceeds this — even if sold as 'road legal' — can be illegal if it puts the bike above its approved noise level. Police and roadworthiness inspectors can test exhaust noise."},

  // Environment & Personal Conditions
  {cat:"Miljö",
   q:"What is the environmental advantage of a motorcycle compared to a car for urban commuting?",
   a:["Motorcycles produce less noise only — emissions are similar","Motorcycles are generally more fuel-efficient per vehicle, reduce congestion (reducing other vehicles' idling time), and require less infrastructure space — but this depends heavily on the motorcycle type and riding style","Motorcycles have zero emissions","Motorcycles and cars have identical environmental footprints"], correct:1,
   exp:"A motorcycle typically uses less fuel per kilometre than a car, occupies less road and parking space (reducing congestion), and reduces total traffic delays. However, older motorcycles can have higher NOx and HC emissions per km than modern cars. Euro 5 motorcycles are cleaner."},

  {cat:"Personliga förhållanden",
   q:"Your vision has become noticeably worse but you have not updated your glasses prescription. Is it safe to ride?",
   a:["Yes, if you ride more carefully","No — visual impairment directly reduces hazard detection distance and reaction time. Get your vision corrected before riding","Only if you stay under 50 km/h","Yes, if you only ride in daylight"], correct:1,
   exp:"Vision is fundamental to safe riding. You need adequate acuity to read signs, detect hazards at distance, and judge gaps. Riding with uncorrected visual impairment is dangerous and may be illegal (Swedish law requires minimum visual standards for driving). Update your prescription and ensure your visor or glasses are clean and scratch-free."},

  {cat:"Personliga förhållanden",
   q:"After a social event where you consumed alcohol, you sleep 6 hours and feel sober in the morning. Can you ride?",
   a:["Yes — 6 hours is sufficient to metabolise alcohol","Not necessarily — the body processes alcohol at approximately 0.1-0.15 ‰ per hour. Depending on how much was consumed, you may still be above the 0.2 ‰ limit. Calculate your approximate remaining BAC before riding","Yes, if you eat a large breakfast first","Yes, if you only ride locally"], correct:1,
   exp:"A common mistake is assuming sleep eliminates alcohol. Alcohol metabolises at a fixed rate (~0.1-0.15 ‰/hour) regardless of sleep. If you consumed 4-5 standard drinks, you could still be impaired 6-8 hours later. When in doubt, don't ride. Use a breathalyser, wait longer, or find alternative transport."},

  {cat:"Riskbedömning",
   q:"What are the key differences in braking characteristics between a wet and dry road for a motorcycle?",
   a:["Virtually no difference with modern ABS-equipped motorcycles","In wet conditions: tyre-to-road friction is significantly reduced (typically 30-60% of dry grip), stopping distances increase dramatically, ABS activates more easily and at lower deceleration levels — adjust following distances and entry speeds accordingly","Only the rear wheel is affected by wet conditions","Braking in the wet is actually better as water cools the brakes"], correct:1,
   exp:"Wet roads dramatically reduce available grip. Stopping distance may increase by 50-100% or more. ABS helps prevent lockup but cannot create grip that isn't there. In wet conditions, start braking much earlier, use both brakes smoothly and progressively, and carry significantly less speed into corners."},

  {cat:"Riskbedömning",
   q:"What is 'risk compensation' (riskompensation) and why is it important for motorcyclists with safety equipment?",
   a:["The financial compensation available after an accident","The tendency to take more risks when we feel safer — riders with full protective gear or ABS may ride faster or brake later, negating some of the safety benefit","A type of insurance product for high-risk riders","Risk assessment training provided by driving schools"], correct:1,
   exp:"Risk compensation (or risk homeostasis) describes how people adjust their behaviour to maintain a perceived acceptable risk level. A rider with ABS and airbag jacket may ride faster because they feel safer. Being aware of this tendency helps you consciously maintain safety margins rather than spend them on speed or comfort."},

   exp:"This sign prohibits vehicles exceeding the indicated height. It is commonly seen before low bridges, tunnels, and underpasses. On a motorcycle this rarely applies, but you should recognise it for the theory test."},

   q:"A warning triangle with children (two figures running) means:",
   a:["School zone — speed limit automatically drops to 30","Warning: children may be near the road — often near schools, playgrounds or residential areas","Children's hospital nearby","No children allowed on this road"], correct:1,
   exp:"This warning sign (barn / lekande barn) does not by itself impose a lower speed limit, but requires you to ride with extra caution. Children can be unpredictable — they may run into the road without warning. Often placed near schools and parks."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow diamond priority road sign -->
  <rect x="22" y="22" width="76" height="76" rx="4" fill="#f5c400" transform="rotate(45 60 60)" stroke="white" stroke-width="5"/>
</svg>`, imgCaption:"Yellow diamond sign",
   q:"A yellow diamond-shaped sign with a white border on Swedish roads means:",
   a:["Warning: uneven road","You are on a priority road (huvudled) and have right of way over side-road traffic","Speed cameras ahead","Road works — reduce speed"], correct:1,
   exp:"The yellow diamond (huvudledsskylt) indicates you are on a priority road. You have right of way over traffic from side roads. The right-hand priority rule does NOT apply as long as this sign is in effect. It is cancelled by the same sign with a diagonal bar through it."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">

  <polygon points="60,110 8,14 112,14" fill="white" stroke="#cc0000" stroke-width="7"/>

  <text x="60" y="145" font-size="9" fill="#999" text-anchor="middle" font-family="Arial">road markings</text>
</svg>`, imgCaption:"Give way sign and road markings",
   q:"The inverted triangle sign and the triangular road markings ('shark's teeth') on the road both mean the same thing. What is it?",
   a:["You have priority","Give way — you must yield to traffic on the road you are joining","Stop completely before proceeding","Pedestrian priority zone"], correct:1,
   exp:"Both the väjningsskylt (inverted triangle sign) and väjningsmarkering (shark's teeth painted on the road) indicate give way. You must yield to crossing traffic. You do not need to stop if the way is clear, but you cannot force other road users to wait for you."},

  {cat:"Vägmärken", img:`<svg viewBox="0 0 140 80" xmlns="http://www.w3.org/2000/svg">

   exp:"This sign marks the beginning of a motorway (motorväg). From this point, motorway rules apply: no pedestrians, cyclists, or mopeds; no stopping except at marked areas; minimum speed rules; entry/exit only at designated ramps."},

   q:"A blue square sign showing a pedestrian on the left and a bicycle on the right (sometimes with a dashed dividing line) means:",
   a:["Combined footpath and cycle path — motorcycles may also use it","Shared use path for pedestrians and cyclists only — motor vehicles including motorcycles are prohibited","Pedestrians must use left side, cyclists right","Advisory path — all vehicles welcome"], correct:1,
   exp:"This is a combined pedestrian and cycle path (gång- och cykelbana). Motor vehicles, including motorcycles, are not permitted. The dashed line indicates cyclists and pedestrians share the same surface; a solid line means separate lanes."},

   a:["No music or audio devices in vehicles","Sound signals (horn use) prohibited in this area","No vehicles with loud exhausts","Electric vehicles only beyond this point"], correct:1,
   exp:"This sign prohibits use of the horn. It is often found in hospital zones, residential areas at night, and similar locations. In Sweden, horn use is restricted to warning of danger — but this sign explicitly prohibits it entirely in the marked zone."},

   exp:"This sign warns of a height restriction ahead (lågt luftrum / bro med begränsat utrymme). The measurement shows the maximum vehicle height that can pass. As a motorcyclist, this virtually never affects you, but you must know what the sign means."},

   exp:"Blue circular signs with arrows are mandatory direction signs (påbudsskylt). This one means you must pass to the right of the obstacle or island. Do not pass on the left side. Common around traffic islands and central reservations."},

   exp:"This sign indicates a roundabout (rondell / cirkulationsplats). You must drive anticlockwise. Traffic already in the roundabout has priority — you must give way when entering. Look for the give-way markings at the entry points."},

   q:"You are riding on a divided road with two lanes each way (2+2) with a 100 km/h speed limit. What is the default rule for lane use?",
   a:["Use any lane freely — 2+2 roads have no lane discipline requirements","Ride in the right-hand lane unless overtaking — keeping right is required on all multi-lane roads in Sweden","Use the left lane for faster riding","Motorcycles may use any lane at any time on divided roads"], correct:1,

   q:"At night, a pedestrian steps onto a zebra crossing ahead of you. What must you do?",
   a:["Flash your headlights to warn the pedestrian and slow down","Give way and stop — pedestrians on or clearly about to use a zebra crossing always have priority, day or night","Pedestrians should not cross at night — maintain speed","Sound the horn and proceed carefully"], correct:1,

   a:["Overtake on the right — the car is turning left, leaving the right side free","Stay behind and wait — overtaking a turning vehicle on the right risks a collision if the driver misjudges","Overtake on the left now before the car turns","Sound your horn to make the driver aware you are there"], correct:0,
   exp:"When a vehicle is turning left and has cleared the right side of the lane, you may pass on the right — this is one of the exceptions to the general prohibition on right-side overtaking in Sweden (Trafikförordningen 3 kap. 14§). However, proceed with caution — confirm the car is genuinely turning and not stopping."},

   q:"You are stopped at a red light. The light turns green. Must you check for cross-traffic before moving off?",
   a:["No — green means go immediately","Yes — always check left and right before moving, even on green. Red-light runners and slow-clearing pedestrians are a serious risk","Only at night or when visibility is poor","Only if you can hear other vehicles approaching"], correct:1,
   exp:"A green light gives you legal priority but does not guarantee safety. Always make a quick visual check (left-right-left) before moving from a standstill at traffic lights. Red-light violations by other road users are a common cause of intersection accidents."},

  // ── VEHICLE KNOWLEDGE — TECHNICAL ─────────────

  {cat:"Fordonskännedom",
   q:"What does a motorcycle's 'rev limiter' (varvtalsregulator) do?",
   a:["Limits minimum idle speed","Prevents the engine from exceeding its maximum safe RPM by cutting fuel or ignition — protects the engine from over-revving","Limits maximum road speed electronically","Controls throttle response in rain mode"], correct:1,
   exp:"The rev limiter cuts fuel injection or ignition at a set maximum RPM to protect the engine. You will feel it as a rhythmic cut-and-restore sensation (bouncing off the limiter). Repeated contact with the rev limiter at high RPM is hard on the engine — upshift before you reach it under normal riding."},

  {cat:"Fordonskännedom",
   q:"What is the function of a motorcycle's rectifier/regulator unit?",
   a:["Controls fuel injection timing","Converts the alternator's AC output to DC and regulates charging voltage to protect the battery — typically 13.5–14.5V","Regulates oil pressure","Controls headlight brightness automatically"], correct:1,
   exp:"The alternator produces alternating current (AC) which must be converted to direct current (DC) for the battery and electronics. The regulator/rectifier does both jobs. A faulty unit can undercharge (dead battery) or overcharge (boiled battery, blown bulbs). Check with a voltmeter at idle and at revs."},

  {cat:"Fordonskännedom",
   q:"What does the 'choke' (startsats / berikningssystem) indicator on older motorcycles mean when lit during normal riding?",
   a:["The engine is at optimal temperature","You have left the choke open — this enriches the fuel mixture, increases fuel consumption, and can foul spark plugs. Close it once the engine is warm","Normal indication — ignore it","Oil temperature is high"], correct:1,
   exp:"Forgetting to close the choke after cold starting causes the engine to run rich continuously: poor fuel economy, excessive carbon buildup, and spark plug fouling. Close the choke progressively as the engine warms up over the first few minutes of riding."},

  {cat:"Fordonskännedom",
   q:"Your motorcycle has a hydraulic clutch. The lever travel has increased significantly. What is the most likely cause?",
   a:["Cable needs adjusting — hydraulic clutches don't need adjustment","Air in the hydraulic line, low clutch fluid, or a worn master/slave cylinder — requires bleeding or inspection","Normal wear — re-adjust the lever reach","Clutch plates are worn"], correct:1,
   exp:"A hydraulic clutch should have consistent lever feel. Increased travel (sponginess) typically means air has entered the system or fluid level is low. Clutch fluid (usually DOT 4 brake fluid) is hygroscopic and should be replaced periodically. Bleed the system if spongy."},

  {cat:"Fordonskännedom",
   q:"What does 'valve clearance' (ventilspel) adjustment affect on a motorcycle engine?",
   a:["Throttle body airflow only","The gap between the camshaft and valve stem — incorrect clearance causes poor performance, excessive noise, reduced power, and can lead to burnt valves if too tight","Exhaust gas recirculation","Oil pressure to the camshafts"], correct:1,
   exp:"Valves expand with heat. The clearance (cold gap) ensures they fully close when hot. Too tight: valve stays open slightly when hot → burnt valve, poor compression. Too loose: noisy ticking, reduced performance. Check and adjust per manufacturer schedule (often every 6,000–12,000 km for shim-type)."},

  {cat:"Fordonskännedom",
   q:"What is 'coolant' (kylarvätska) and why must it be the correct mixture ratio in Sweden?",
   a:["Only needed in summer — winter riding doesn't require coolant","A mixture of water and ethylene glycol antifreeze — the correct ratio (typically 50/50) prevents both freezing in winter AND boiling in summer, and contains corrosion inhibitors","Pure water is acceptable in modern closed cooling systems","Only required for liquid-cooled engines above 600 cc"], correct:1,
   exp:"Coolant prevents freezing (down to approx -35°C with 50/50 mix), raises the boiling point above 100°C, and protects metals from corrosion. In Sweden's climate, correct antifreeze concentration is essential year-round. Check the freeze protection rating with a refractometer or test strip."},

  {cat:"Fordonskännedom",
   q:"What does the 'TCS' or 'TC' warning light on a modern motorcycle's dashboard indicate when it illuminates while riding?",
   a:["Tyre pressure critically low","Traction control has activated (intervened) — the system detected wheel spin and reduced power. This is informational if it flashes briefly; if it stays on, a fault may be present","Time for a tyre change service","Temperature of coolant is critical"], correct:1,
   exp:"A brief TC/TCS flash indicates the system intervened to prevent wheel spin — normal operation on slippery surfaces. A continuously illuminated warning light (often with a different colour) indicates a system fault. Consult the owner's manual for your specific bike's indicator behaviour."},

  {cat:"Fordonskännedom",
   q:"What is the correct method to check engine oil level on a motorcycle?",
   a:["Check immediately after turning the engine off","Check on the sidestand (if the bike has one) or centrally depending on the bike — always after the engine has been off for at least 5 minutes to let oil drain back. Follow the owner's manual precisely","Check while the engine is warm and running","Check only at service intervals — daily checking is unnecessary"], correct:1,
   exp:"Method varies by bike: some require the bike on its sidestand, others upright (centrestand or held vertical). Always check when the engine is warm but off, after at least 3-5 minutes rest so oil has drained to the sump. Check your specific bike's manual — getting it wrong gives a false reading."},

  {cat:"Fordonskännedom",
   q:"What is 'spark plug fouling' and what causes it on a motorcycle?",
   a:["Spark plug overheating from incorrect heat range","Carbon, oil, or fuel deposits building up on the spark plug electrode, preventing reliable ignition — caused by rich running, oil burning, short trips, or incorrect plug heat range","Spark plug gap becoming too large over time","Corrosion from water ingress into the plug recess"], correct:1,
   exp:"A fouled plug misfires, causing rough running, hard starting, and poor fuel economy. Common causes: running with choke too long, oil burning (worn rings/valve seals), very short trips that don't fully warm the engine, or too-cold a heat range plug. Inspect plugs at service intervals."},

  {cat:"Fordonskännedom",
   q:"What is the purpose of a motorcycle's 'airbox' (luftfilterbox)?",
   a:["Stores compressed air for the horn","Houses the air filter and silences intake noise — the filter prevents dust and debris from entering the engine, and the box design helps tune intake resonance for optimal engine performance","Recirculates exhaust gases into the intake","Houses the fuel pump on carburetted motorcycles"], correct:1,
   exp:"The airbox contains the air filter (paper, foam, or cotton gauze) that prevents abrasive particles from entering the engine. It also dampens intake noise and can be tuned to specific resonance frequencies for power. A clogged air filter severely restricts performance and increases fuel consumption."},

  {cat:"Fordonskännedom",
   q:"What is a 'fuel petcock' (bränslekran) on older carburetted motorcycles and what do the positions mean?",
   a:["A fuel pressure regulator — set to 'high' for motorway riding","A manual valve controlling fuel flow from the tank: ON (normal riding), OFF (storage/long park), RES (reserve — main supply exhausted, last fuel available)","A fuel filter bypass for emergency use","An air-fuel mixture adjustment tool"], correct:1,
   exp:"Older carburetted bikes often have a manual fuel tap. 'ON' feeds fuel from the main tank portion. When the bike starts sputtering (main supply empty), switching to 'RES' gives access to reserve fuel — typically 1-2 litres. Always switch back to 'ON' after refuelling. Modern FI bikes manage this automatically."},

  {cat:"Fordonskännedom",
   q:"What causes a motorcycle to 'weave' at high speed (above ~120 km/h)?",
   a:["Normal aerodynamic behaviour — all motorcycles weave at speed","Wheel imbalance, worn steering head or wheel bearings, improperly loaded luggage, tyre defect, or incorrect tyre pressure — all can cause high-speed instability","Incorrect riding position only","Traction control system incorrectly calibrated"], correct:1,
   exp:"High-speed weaving (wobble/wallowing) indicates a mechanical issue: out-of-balance wheels (most common), worn bearings, asymmetric tyre wear, or improperly secured luggage shifting weight. A steering damper helps but does not fix the underlying cause. Have the bike inspected immediately."},

  {cat:"Fordonskännedom",
   q:"What is the correct procedure for breaking in a new motorcycle engine during the first 1,000 km?",
   a:["Full-throttle break-in — modern engines are pre-broken-in at the factory","Vary engine speed and load, avoid sustained high RPM or full throttle, and complete the first oil change at the specified interval — this beds in rings, bearings, and valve seats properly","Keep RPM below 3,000 at all times for 1,000 km","Engine break-in only applies to two-stroke engines"], correct:1,
   exp:"Modern four-stroke engines still benefit from a proper break-in. Varying RPM and load (avoid constant highway RPM) beds in piston rings against the cylinder wall. Avoid sustained high-RPM or full-throttle until the first service. Change oil at the specified break-in interval — it will contain metal particles from the bedding-in process."},

  // ── MC SAFETY — Advanced Situational ──────────

  {cat:"MC-Säkerhet",
   q:"You are approaching a long right-hand bend on a rural road. Where should you position yourself on entry?",
   a:["Far right to stay away from the centre line","Move toward the left side of your lane on entry — this straightens the effective radius, improves your sight line around the bend, and gives you maximum space if you run wide","Stay in the centre of the lane at all times","Position doesn't matter — focus on speed"], correct:1,
   exp:"For a right-hand bend: approach from the left side of your lane. This 'opens up' the corner geometrically, giving you a better sight line sooner and a longer path, which means you can carry more speed safely. It also gives you margin if the corner tightens unexpectedly."},

  {cat:"MC-Säkerhet",
   q:"What is the recommended approach when riding over a cattle grid (viltgaller)?",
   a:["Accelerate over it to reduce wheel-drop time","Approach at a gentle angle if possible, reduce speed, keep the bike as upright as possible, maintain steady throttle, and avoid braking or steering on the grid","Brake hard before and coast over","Steer sharply sideways to reduce the time crossing parallel bars"], correct:1,
   exp:"Cattle grids are extremely slippery when wet and wheel-drop risks destabilising the bike. Reduce speed before the grid, keep upright, use steady throttle, and avoid any braking or sharp steering while on the bars. Crossing at a slight angle reduces the risk of the wheel dropping between bars."},

  {cat:"MC-Säkerhet",
   q:"What is 'target fixation' in an emergency situation and how do you counteract it?",
   a:["Looking at your speedometer during an emergency stop","The tendency to steer towards what you are looking at — in an emergency, riders focus on the hazard and ride into it. Counteract by consciously looking at your escape route instead","An advanced technique for navigating obstacles at speed","The correct focus point for maximum braking performance"], correct:1,
   exp:"Target fixation causes many single-vehicle accidents: rider locks eyes on the hazard (barrier, car, pothole), and the motorcycle follows the eyes into it. Training yourself to immediately shift your gaze to the escape route — where you WANT to go — is a critical skill. 'Look where you want to go, not where you don't want to go.'"},

  {cat:"MC-Säkerhet",
   q:"How should you adjust your riding when following a vehicle that is throwing up spray or stones (grus)?",
   a:["Stay close behind to shelter from wind and let the vehicle clear debris ahead","Increase following distance significantly — spray reduces your visibility, and stones can crack your visor or damage your bike. The increased distance also gives time for the debris field to settle","Move to the opposite side of the lane to see past the vehicle","Overtake immediately to get out of the spray"], correct:1,
   exp:"Following distance is critical in spray conditions. Spray dramatically reduces visibility (treat it like fog) and the debris field pelts your visor and bodywork. Drop back until visibility improves. If the vehicle is throwing up stones (loose chippings / Löst grus), the increased distance also reduces stone-strike impact."},

  {cat:"MC-Säkerhet",
   q:"What is the effect of 'tank-slapper' (speed wobble) and the recommended response?",
   a:["Apply both brakes firmly to stop the oscillation","Hold the bars firmly but without fighting them, smoothly roll off the throttle, do NOT brake suddenly, and allow the bike to settle as speed reduces","Accelerate through it — the wobble stops at higher speed","Steer rapidly left-right to break the resonance cycle"], correct:1,
   exp:"A tank-slapper is a violent rapid oscillation of the handlebars. Braking abruptly can worsen it or throw the bike. Hold the bars firmly (resist the oscillation without fighting it), smoothly reduce throttle, and let the bike slow naturally. A steering damper helps prevent recurrence — investigate the root cause afterward."},

  {cat:"MC-Säkerhet",
   q:"Why is it particularly important to check for motorcycles before opening a car door — and as a motorcyclist, how do you reduce your exposure to this risk?",
   a:["Car doors are reinforced and a collision causes no significant risk","A car door opens into the path of a passing motorcycle with no warning, often causing serious injury. As a rider, stay out of the 'door zone' (approximately 1 metre from parked cars) and scan for occupants in parked cars","This risk only applies in urban areas with parking on both sides","Motorcycles should sound the horn continuously when passing parked cars"], correct:1,
   exp:"'Dooring' is a major cause of motorcycle injury. Car occupants rarely check for approaching motorcycles before opening doors. As a rider: ride at least 1 metre from parked cars, look for people in parked cars (occupied cars have higher risk), and reduce speed in areas with dense parking."},

  {cat:"MC-Säkerhet",
   q:"What specific hazard does white road paint (lane markings, arrows, text) present to motorcyclists in wet conditions?",
   a:["Increased grip due to textured surface","Significantly reduced grip — white paint becomes extremely slippery when wet, with friction coefficients approaching ice. Braking or leaning on painted surfaces when wet risks sliding","Only thick paint layers are slippery","Only relevant at temperatures below 5°C"], correct:1,
   exp:"Painted road surfaces (thermoplastic markings) become very slippery when wet. Avoid hard braking, sharp turns, or acceleration on painted surfaces (arrows, text, crossings). If you must cross them, do so upright with smooth inputs. Particular care at stop lines, zebra crossings, and directional arrows."},

  // ── TRAFFIC RULES — Detailed ──────────────────

  {cat:"Trafikregler",
   q:"In Sweden, what is the rule about using dipped (low beam) headlights in daytime?",
   a:["Only required November to March","Required at all times when driving — day and night, year-round. This has been mandatory for all motor vehicles since 1977","Only required when visibility is below 300 metres","Only required outside built-up areas during daylight hours"], correct:1,
   exp:"Sweden requires dipped headlights at all times for all motor vehicles — this has been mandatory since 1977. For motorcycles, this is particularly important for conspicuity. DRL (daytime running lights) may satisfy this requirement on newer vehicles if they meet the technical specification, but check your bike's compliance."},

  {cat:"Trafikregler",
   q:"What is 'omkörning' (overtaking) and when is the simplified rule for when it's permitted?",
   a:["Passing a stationary vehicle — always permitted","Passing a moving vehicle going in the same direction — only permitted when you can see clearly that the road ahead is sufficiently free, you are not approaching a place where overtaking is forbidden, and you can complete the manoeuvre safely without forcing others to adjust","Passing a vehicle going in the opposite direction — requires horn warning","Overtaking is always the driver's own responsibility with no specific rules"], correct:1,
   exp:"Overtaking (Trafikförordningen 3 kap. 14–23§§) requires: clear view of sufficient road ahead, no prohibition (signs, solid centre line), no forbidden location (intersections, bends, crests, crossings), and that you can complete the pass without forcing others to brake or steer. The overtaken vehicle must not accelerate."},

  {cat:"Trafikregler",
   q:"What is the minimum distance you must maintain from a fire engine, ambulance, or police vehicle that is responding to an emergency (blue lights and siren)?",
   a:["There is no specific minimum distance","At least 20 metres from behind — do not follow emergency vehicles closely through red lights or restricted areas, and give way immediately","5 metres — close following is required to use the path they create","Only give way if they signal you specifically"], correct:1,
   exp:"You must give way to emergency vehicles using blue lights and sirens. Keep a safe distance (Trafikförordningen sets a minimum of 20 metres behind a responding emergency vehicle on motorways and major roads). Never follow them through red lights — other drivers may pull out after the emergency vehicle passes."},

  {cat:"Trafikregler",
   q:"What does 'gångfartsområde' (pedestrian priority zone / 'shared space') mean in Sweden?",
   a:["A pedestrian-only zone — no vehicles permitted","An area where vehicles are permitted but must travel at walking pace (max ~7 km/h), give way to all pedestrians, and pedestrians may use the entire width of the area","A school zone with a 20 km/h limit","A zone where cyclists have priority over motor vehicles"], correct:1,
   exp:"A gångfartsområde is marked by specific signs and requires all vehicles to travel no faster than walking pace. Pedestrians have absolute priority throughout the area and may walk anywhere. Parking is only allowed in marked spaces. Motor vehicles may enter to access properties but must immediately give way to any pedestrian."},

  {cat:"Trafikregler",
   q:"You are towing a trailer with your motorcycle. What speed limit restrictions apply in Sweden?",
   a:["No specific restrictions — standard speed limits apply","A motorcycle with a trailer may not exceed 80 km/h regardless of the posted speed limit","A motorcycle may not legally tow a trailer in Sweden","The trailer limits you to 70 km/h on all road types"], correct:1,
   exp:"Under Swedish regulations (Trafikförordningen), a motorcycle towing a trailer is limited to 80 km/h maximum, regardless of the posted limit. Additionally, motorcycles may only tow trailers if they have a minimum engine displacement of 50 cc and the trailer has approved couplings and lighting."},

  {cat:"Trafikregler",
   q:"What is 'körbana' vs 'körbanehalva' in Swedish traffic terminology?",
   a:["Körbana = road; körbanehalva = half of a dual carriageway","Körbana = the part of the road surface intended for vehicle traffic (excluding footpaths, cycle paths, shoulders); körbanehalva = one side of the road (your half when driving on the right)","Körbana = left lane; körbanehalva = right lane","Both mean the same thing in modern usage"], correct:1,
   exp:"Körbana refers to the vehicle roadway surface (excluding shoulders, cycle paths, footpaths). Körbanehalva is 'your half' of the road — the right side on right-hand traffic systems. Keeping to your körbanehalva is fundamental: stray across the centre line and you enter oncoming traffic territory."},

  // ── RISK AWARENESS — Situational ──────────────

  {cat:"Riskbedömning", img:`<svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="180" fill="#bbb"/>

  <!-- Curve to the right -->
  <path d="M100,0 Q180,90 100,180" fill="#555" stroke="none"/>
  <path d="M100,0 Q100,90 20,180" fill="#bbb" stroke="none"/>

  <!-- Motorcycle at entry to right-hand bend -->
  <text x="95" y="35" font-size="20" text-anchor="middle">🏍️</text>
  <!-- Hazard: gravel on apex -->
  <circle cx="140" cy="90" r="3" fill="#d4c4a0"/>
  <circle cx="148" cy="94" r="2" fill="#d4c4a0"/>
  <circle cx="135" cy="98" r="3" fill="#d4c4a0"/>
